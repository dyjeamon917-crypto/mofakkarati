<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover">

<meta name="theme-color" content="#10131a">

<title>ملاحظاتي</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#10131a;
    color:#fff;
    font-family:Arial,"Noto Sans Arabic",sans-serif;
}

body{
    display:flex;
    justify-content:center;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    max-width:900px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#10131a;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    flex:0 0 auto;
    min-height:56px;
    padding:8px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#171b24;
    border-bottom:1px solid #292e3a;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:6px;
}

.header button{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#252b36;
    color:#fff;
    font-size:20px;
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px;
}

.empty{
    padding:50px 20px;
    text-align:center;
    color:#7f8795;
}

.note{
    position:relative;
    max-width:92%;
    margin:0 0 12px auto;
    padding:14px 44px 14px 14px;
    background:#202631;
    border:1px solid #2c3441;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.note.editing-note{
    border-color:#527df5;
}

.note-content{
    min-width:0;
    line-height:1.8;
    word-break:break-word;
    overflow-wrap:anywhere;
}

.note-menu{
    position:absolute;
    top:8px;
    right:7px;
    width:32px;
    height:32px;
    border-radius:9px;
    background:#2b323e;
    color:#fff;
    font-size:21px;
}

.search-highlight{
    outline:2px solid #ffc107;
    outline-offset:2px;
}

.search-word{
    background:#ffe600;
    color:#111;
    border-radius:3px;
    padding:0 2px;
}


/* =====================================================
   EDITOR
===================================================== */

.editor-area{
    flex:0 0 auto;
    padding:8px 10px 10px;
    background:#151922;
    border-top:1px solid #292e3a;
}

.editor-state{
    margin:0 5px 6px;
    font-size:12px;
    color:#8e98a8;
}

.editor{
    min-height:95px;
    max-height:30vh;
    overflow-y:auto;
    padding:13px;
    border:1px solid #303745;
    border-radius:14px;
    background:#1c212b;
    color:#fff;
    outline:none;
    direction:rtl;
    text-align:right;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.8;
}

.editor:empty::before{
    content:"اكتبي ملاحظتك هنا…";
    color:#737d8e;
    pointer-events:none;
}

.editor:focus{
    border-color:#527df5;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
    display:flex;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    padding:7px 0 2px;
    scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#252c38;
    color:#fff;
    font-size:17px;
    font-weight:bold;
}

.tool.active{
    background:#4169d8;
}

.tool:active{
    transform:scale(.94);
}


/* =====================================================
   SUB TOOLBAR
===================================================== */

.sub-toolbar{
    display:none;
    gap:5px;
    overflow-x:auto;
    padding:5px 0;
    scrollbar-width:none;
}

.sub-toolbar::-webkit-scrollbar{
    display:none;
}

.sub-toolbar.open{
    display:flex;
}

.sub-toolbar button{
    flex:0 0 auto;
    min-width:40px;
    height:36px;
    border-radius:9px;
    background:#292f3b;
    color:#fff;
}

.sub-toolbar button.active{
    background:#4169d8;
}


/* =====================================================
   ACTIONS
===================================================== */

.editor-actions{
    display:flex;
    gap:7px;
    margin-top:6px;
}

.send-button{
    flex:0 0 46px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#3867dc;
    color:#fff;
    font-size:21px;
}

.cancel-button{
    flex:1;
    height:42px;
    border-radius:11px;
    background:#303744;
    color:#fff;
}


/* =====================================================
   MESSAGE MENU
===================================================== */

.message-menu{
    position:fixed;
    z-index:2000;
    display:none;
    min-width:145px;
    padding:5px;
    background:#252b36;
    border:1px solid #3a4250;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.message-menu.open{
    display:block;
}

.message-menu button{
    display:block;
    width:100%;
    padding:11px;
    border-radius:8px;
    background:transparent;
    color:#fff;
    text-align:right;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.62);
}

.overlay.open{
    display:flex;
}

.overlay-box{
    width:min(600px,100%);
    max-height:90dvh;
    overflow-y:auto;
    padding:18px;
    background:#191e27;
    border:1px solid #343b48;
    border-radius:22px 22px 0 0;
}

.overlay-title{
    margin-bottom:15px;
    font-size:18px;
    font-weight:bold;
}

.overlay-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
}

.overlay-actions button{
    flex:1;
    min-height:42px;
    border-radius:11px;
    background:#303744;
    color:#fff;
}

.overlay-actions .primary{
    background:#3867dc;
}


/* =====================================================
   COLOR WHEEL
===================================================== */

.color-wheel-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.color-wheel{
    position:relative;
    width:min(300px,78vw);
    height:min(300px,78vw);
    flex:0 0 auto;
    border-radius:50%;
    overflow:hidden;
    touch-action:none;

    background:
        conic-gradient(
            #ff0000,
            #ffff00,
            #00ff00,
            #00ffff,
            #0000ff,
            #ff00ff,
            #ff0000
        );
}

.color-wheel::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    pointer-events:none;

    background:
        radial-gradient(
            circle,
            transparent 0%,
            transparent 42%,
            rgba(0,0,0,.03) 58%,
            rgba(0,0,0,.48) 100%
        );
}

.color-marker{
    position:absolute;
    z-index:5;
    width:20px;
    height:20px;
    margin:-10px;
    border:2px solid #fff;
    border-radius:50%;
    box-shadow:
        0 0 0 2px rgba(0,0,0,.65),
        0 2px 6px rgba(0,0,0,.7);
    pointer-events:none;
}

.color-presets{
    display:flex;
    justify-content:center;
    gap:14px;
}

.color-preset{
    width:40px;
    height:40px;
    border:2px solid #fff;
    border-radius:50%;
}

#blackText{
    background:#000;
}

#whiteText{
    background:#fff;
}


/* =====================================================
   OPACITY
===================================================== */

.range-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.range-row input{
    flex:1;
}


/* =====================================================
   COUNTERS
===================================================== */

.counter-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:20px 0;
}

.counter-box button{
    width:44px;
    height:44px;
    border-radius:10px;
    background:#303744;
    color:#fff;
    font-size:22px;
}

.counter-box strong{
    min-width:55px;
    text-align:center;
    font-size:20px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-input{
    width:100%;
    height:44px;
    padding:0 12px;
    border:1px solid #303745;
    border-radius:11px;
    outline:none;
    background:#1c212b;
    color:#fff;
}

.search-result{
    min-height:25px;
    margin-top:12px;
    color:#aeb7c5;
}


/* =====================================================
   TABLE
===================================================== */

.editor-table{
    width:100%;
    max-width:100%;
    margin:8px 0;
    border-collapse:collapse;
    table-layout:fixed;
}

.editor-table td,
.editor-table th{
    min-width:0;
    padding:8px;
    border:1px solid #687386;
    word-break:break-word;
    overflow-wrap:anywhere;
    white-space:normal;
    vertical-align:top;
}

.editor-table td:focus,
.editor-table th:focus{
    outline:2px solid #527df5;
}


/* =====================================================
   MIND MAP
===================================================== */

.mind-map{
    width:100%;
    max-width:100%;
    margin:10px 0;
    padding:12px;
    border:1px solid #53617a;
    border-radius:14px;
    background:#202631;
    overflow:hidden;
}

.mind-map-center{
    width:min(70%,260px);
    margin:auto;
    padding:10px;
    border-radius:12px;
    background:#3867dc;
    text-align:center;
    word-break:break-word;
}

.mind-map-branches{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
    gap:8px;
    margin-top:12px;
}

.mind-map-branch{
    min-width:0;
    padding:8px;
    border-radius:10px;
    background:#303744;
    text-align:center;
    word-break:break-word;
}


/* =====================================================
   MIND TREE
===================================================== */

.mind-tree{
    width:100%;
    max-width:100%;
    margin:10px 0;
    padding:12px;
    border:1px solid #53617a;
    border-radius:14px;
    background:#202631;
    overflow:hidden;
}

.mind-tree-root{
    width:min(65%,240px);
    margin:auto;
    padding:10px;
    border-radius:12px;
    background:#3867dc;
    text-align:center;
    word-break:break-word;
}

.mind-tree-branches{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
    gap:8px;
    margin-top:14px;
}

.mind-tree-branch{
    min-width:0;
    padding:8px;
    border-radius:10px;
    background:#303744;
    text-align:center;
    word-break:break-word;
}


/* =====================================================
   TEXT FORMATTING
   كل تنسيق مستقل
===================================================== */

.editor b,
.editor strong{
    font-weight:700;
}

.editor i,
.editor em{
    font-style:italic;
}

/*
   0.08 بوصة ≈ 7.68px
*/
.editor u,
.editor .custom-underline{
    text-decoration-line:underline;
    text-decoration-thickness:1px;
    text-underline-offset:7.68px;
    text-decoration-skip-ink:none;
}

.editor .custom-bold{
    font-weight:700;
}

.editor .custom-italic{
    font-style:italic;
}

.editor .custom-underline{
    text-decoration-line:underline;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .messages{
        padding:10px;
    }

    .note{
        max-width:96%;
    }

    .editor{
        max-height:28vh;
    }

    .overlay-box{
        padding:15px;
    }

    .color-wheel{
        width:min(270px,78vw);
        height:min(270px,78vw);
    }
}

</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="title">ملاحظاتي</div>

    <div class="header-actions">

        <button id="newButton"
                type="button"
                aria-label="جديد">＋</button>

        <button id="searchButton"
                type="button"
                aria-label="بحث">⌕</button>

    </div>

</header>


<main id="messages"
      class="messages">
</main>


<section class="editor-area">

    <div id="state"
         class="editor-state">
        رسالة جديدة
    </div>

    <div id="editor"
         class="editor"
         contenteditable="true"
         spellcheck="true"></div>


    <div class="toolbar">

        <button id="boldButton"
                class="tool"
                type="button"
                aria-label="عريض">

        </button>

        <button id="italicButton"
                class="tool"
                type="button"

        <button id="underlineButton"

                aria-label="تسطير">

        </button>

        <button id="sizeButton"
                class="tool"
                type="button"
                aria-label="حجم">
            A
        </button>

        <button id="listButton"
                class="tool"
                type="button"
                aria-label="قائمة">

        </button>

        <button id="alignmentButton"
                class="tool"
                type="button"
                aria-label="محاذاة">

        </button>

        <button id="colorButton"
                class="tool"
                type="button"

            🎨
        </button>

        <button id="highlightButton"
                class="tool"
                type="button"
                aria-label="تمييز">
            🖍
        </button>

        <button id="tableButton"

                type="button"

                type="button"

        <button id="cancelButton"

    </div>

</section>

</div>


<!-- =====================================================
     MESSAGE MENU
===================================================== -->

<div id="messageMenu"
     class="message-menu">

    <button id="editButton"
            type="button"
            aria-label="تعديل">✎</button>

    <button id="deleteButton"
            type="button"

</div>


<!-- =====================================================
     TEXT COLOR
===================================================== -->

    <div class="overlay-box">

        <div class="overlay-title">🎨</div>

            </div>

                <button id="blackText"

            <button id="mindBranchPlus"

        <div class="overlay-actions">

<script>

"use strict";

/* =====================================================
   CONFIG
===================================================== */

const STORAGE_KEY = "notes_clean_editor_v1";

const FONT_SIZES = [
    8,9,10,11,12,14,16,18,20,22,
    24,26,28,32,36,40,48,56,64,72
];


/* =====================================================
   STATE
===================================================== */

const State = {

    notes:[],

    editingId:null,

    selectedNoteId:null,

    savedRange:null,

    bold:false,

    italic:false,

    underline:false,

    fontSize:8,

    alignment:"right",

    textColor:"rgb(255,255,255)",

    highlightColor:"rgb(255,255,0)",

    highlightOpacity:.60,

    tableRows:3,

    tableCols:3,

    mindBranches:2,

    treeBranches:2
};


/* =====================================================
   DOM
===================================================== */

const $ = id => document.getElementById(id);

let editor;
let messages;
let state;
let messageMenu;


/* =====================================================
   INIT DOM
===================================================== */

function initDOM(){

    editor=$("editor");
    messages=$("messages");
    state=$("state");
    messageMenu=$("messageMenu");

}


/* =====================================================
   EVENTS
===================================================== */

function on(id,event,fn,options){

    const element=$(id);

    if(element){
        element.addEventListener(event,fn,options);
    }

}


/* =====================================================
   ID
===================================================== */

function createId(){

    if(
        crypto &&
        typeof crypto.randomUUID==="function"
    ){
        return crypto.randomUUID();
    }

    return "note_"+Date.now()+"_"+Math.random();

}


/* =====================================================
   STORAGE
===================================================== */

function loadNotes(){

    try{

        const raw=
            localStorage.getItem(STORAGE_KEY);

        if(!raw){
            return;
        }

        const data=JSON.parse(raw);

        if(!Array.isArray(data)){
            return;
        }

        State.notes=data.filter(
            n =>
                n &&
                typeof n.id==="string" &&
                typeof n.html==="string"
        );

    }catch(error){

        console.error(error);

    }

}


function saveNotes(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(State.notes)
        );

        return true;

    }catch(error){

        alert("تعذر حفظ الملاحظات");

        return false;

    }

}


/* =====================================================
   SELECTION
===================================================== */

function insideEditor(node){

    return Boolean(
        node &&
        editor &&
        (
            node===editor ||
            editor.contains(node)
        )
    );

}


function getRange(){

    const selection=
        window.getSelection();

    if(
        !selection ||
        !selection.rangeCount
    ){
        return null;
    }

    const range=
        selection.getRangeAt(0);

    if(
        !insideEditor(range.startContainer) ||
        !insideEditor(range.endContainer)
    ){
        return null;
    }

    return range;

}


function saveSelection(){

    const range=getRange();

    if(!range){
        return false;
    }

    State.savedRange=
        range.cloneRange();

    return true;

}


function restoreSelection(){

    const range=State.savedRange;

    if(
        !range ||
        !insideEditor(range.startContainer) ||
        !insideEditor(range.endContainer)
    ){
        return false;
    }

    const selection=
        window.getSelection();

    selection.removeAllRanges();
    selection.addRange(range);

    editor.focus({
        preventScroll:true
    });

    return true;

}


function focusEnd(){

    editor.focus({
        preventScroll:true
    });

    const range=
        document.createRange();

    range.selectNodeContents(editor);
    range.collapse(false);

    const selection=
        window.getSelection();

    selection.removeAllRanges();
    selection.addRange(range);

    saveSelection();

}


function prepareSelection(){

    return restoreSelection() || (
        focusEnd(),
        true
    );

}

/* =====================================================
   INDEPENDENT FORMATTING
===================================================== */

/*
   كل وظيفة هنا مستقلة تمامًا.
   لا توجد أوامر execCommand مشتركة.
*/


function getSelectedText(){

    const range=getRange();

    if(!range || range.collapsed){
        return null;
    }

    return range;
}


function wrapSelection(className){

    const range=getSelectedText();

    if(!range){
        return false;
    }

    const fragment=
        range.extractContents();

    const span=
        document.createElement("span");

    span.className=className;

    span.appendChild(fragment);

    range.insertNode(span);

    const selection=
        window.getSelection();

    const newRange=
        document.createRange();

    newRange.selectNodeContents(span);

    selection.removeAllRanges();
    selection.addRange(newRange);

    saveSelection();

    return true;

}


function unwrapSelection(className){

    const range=getSelectedText();

    if(!range){
        return false;
    }

    const elements=
        Array.from(
            editor.querySelectorAll(
                "."+className
            )
        );

    elements.forEach(
        element=>{

            try{

                if(
                    range.intersectsNode(element)
                ){

                    const parent=
                        element.parentNode;

                    while(element.firstChild){

                        parent.insertBefore(
                            element.firstChild,
                            element
                        );

                    }

                    element.remove();

                }

            }catch(error){}

        }
    );

    saveSelection();

    return true;

}

/* =====================================================
   COLOR WHEEL
===================================================== */

function createColorWheel(
    wheel,
    marker,
    callback
){

    let hue=0;
    let saturation=100;
    let value=100;

    let dragging=false;

    function hsvToRgb(
        h,
        s,
        v
    ){

        s/=100;
        v/=100;

        const c=v*s;

        const x=
            c*
            (
                1-
                Math.abs(
                    (h/60)%2-1
                )
            );

        const m=v-c;

        let r=0;
        let g=0;
        let b=0;

        if(h<60){
            r=c;
            g=x;
        }else if(h<120){
            r=x;
            g=c;
        }else if(h<180){
            g=c;
            b=x;
        }else if(h<240){
            g=x;
            b=c;
        }else if(h<300){
            r=x;
            b=c;
        }else{
            r=c;
            b=x;
        }

        return {
            r:Math.round((r+m)*255),
            g:Math.round((g+m)*255),
            b:Math.round((b+m)*255)
        };

    }


    function update(){

        const rect=
            wheel.getBoundingClientRect();

        const size=
            Math.min(
                rect.width,
                rect.height
            );

        const center=
            size/2;

        const radius=
            Math.max(
                1,
                center-12
            );

        const angle=
            hue*Math.PI/180;

        /*
          المؤشر دائمًا داخل الدائرة
        */

        const distance=
            Math.min(
                radius,
                radius*(saturation/100)
            );

        const x=
            center+
            Math.sin(angle)*
            distance;

        const y=
            center-
            Math.cos(angle)*
            distance;

        marker.style.left=
            x+"px";

        marker.style.top=
            y+"px";

        const rgb=
            hsvToRgb(
                hue,
                saturation,
                value
            );

        const color=
            `rgb(${rgb.r},${rgb.g},${rgb.b})`;

        marker.style.backgroundColor=
            color;

        callback(color);

    }


    function setPointer(event){

        const rect=
            wheel.getBoundingClientRect();

        const cx=
            rect.left+
            rect.width/2;

        const cy=
            rect.top+
            rect.height/2;

        let dx=
            event.clientX-cx;

        let dy=
            event.clientY-cy;

        const radius=
            Math.min(
                rect.width,
                rect.height
            )/2;

        const distance=
            Math.hypot(dx,dy);

        /*
          لا يسمح للمؤشر بالخروج
        */

        if(distance>radius){

            dx=
                dx/distance*
                radius;

            dy=
                dy/distance*
                radius;

        }

        const actualDistance=
            Math.min(
                radius-12,
                Math.hypot(dx,dy)
            );

        saturation=
            Math.max(
                0,
                Math.min(
                    100,
                    actualDistance/
                    Math.max(
                        1,
                        radius-12
                    )*
                    100
                )
            );

        let angle=
            Math.atan2(dx,-dy)*
            180/Math.PI;

        if(angle<0){
            angle+=360;
        }

        hue=angle;

        update();

    }


    wheel.addEventListener(
        "pointerdown",
        event=>{

            dragging=true;

            wheel.setPointerCapture?.(
                event.pointerId
            );

            setPointer(event);

            event.preventDefault();

        }
    );


    wheel.addEventListener(
        "pointermove",
        event=>{

            if(dragging){
                setPointer(event);
            }

        }
    );


    wheel.addEventListener(
        "pointerup",
        ()=>{

            dragging=false;

        }
    );


    wheel.addEventListener(
        "pointercancel",
        ()=>{

            dragging=false;

        }
    );


    window.addEventListener(
        "resize",
        update
    );


    update();

    return {
        update
    };

}

    }

    const fragment=
        range.extractContents();

    const span=
        document.createElement("span");

        "word-text-highlight";

    const color=
        colorToRgba(
            State.highlightColor,
            State.highlightOpacity
        );

    span.style.backgroundColor=
        color;

    span.appendChild(fragment);

    range.insertNode(span);

    const selection=

    const newRange=
        document.createRange();

    newRange.selectNodeContents(span);

    selection.removeAllRanges();
    selection.addRange(newRange);

    saveSelection();

}


function colorToRgba(
    color,
    opacity
){

    const temp=
        document.createElement("span");

    temp.style.color=color;

    document.body.appendChild(temp);

    const computed=
        getComputedStyle(temp).color;

    temp.remove();

    const values=
        computed.match(/\d+/g);

    if(!values){
        return `rgba(255,255,0,${opacity})`;
    }

    return `rgba(
        ${values[0]},
        ${values[1]},
        ${values[2]},
        ${opacity}
    )`;

}

function createTable(
    rows,
    cols
){

    const table=
        document.createElement("table");

    table.className=
        "editor-table";

    const tbody=
        document.createElement("tbody");

    for(
        let r=0;
        r<rows;
        r++
    ){

        const tr=
            document.createElement("tr");

        for(
            let c=0;
            c<cols;
            c++
        ){

            const td=
                document.createElement("td");

            td.contentEditable="true";

            td.innerHTML="<br>";

            tr.appendChild(td);

        }

        tbody.appendChild(tr);

    }

    table.appendChild(tbody);

    return table;

}


function insertElement(element){

    prepareSelection();

    const range=
        getRange();

    if(!range){

        editor.appendChild(element);

    }else{

        range.deleteContents();

        range.insertNode(element);

    }

    const selection=
        window.getSelection();

    const newRange=
        document.createRange();

    newRange.setStartAfter(element);
    newRange.collapse(true);

    selection.removeAllRanges();
    selection.addRange(newRange);

    saveSelection();

}

function createMindTree(branches){

    const box=

    box.className=
        "mind-tree";

    const root=
        document.createElement("div");

    root.className=
        "mind-tree-root";

    root.textContent=
        "الفكرة";

    const list=
        document.createElement("div");

    list.className=
        "mind-tree-branches";

    for(
        let i=1;
        i<=branches;
        i++
    ){

        const branch=
            document.createElement("div");

        branch.className=
            "mind-tree-branch";

        branch.contentEditable="true";

        branch.textContent=
            "فرع "+i;

        list.appendChild(branch);

    }

    box.append(
        root,
        list
    );

    return box;

}

/* =====================================================
   SEARCH
===================================================== */

function clearSearch(){

    messages
        .querySelectorAll(
            ".search-word"
        )
        .forEach(
            unwrapElement
        );

    messages
        .querySelectorAll(
            ".search-highlight"
        )
        .forEach(
            element=>
                element.classList.remove(
                    "search-highlight"
                )
        );

}


function searchTextNode(
    node,
    query
){

    const text=
        node.nodeValue;

    const lower=
        text.toLocaleLowerCase();

    const q=
        query.toLocaleLowerCase();

    if(!lower.includes(q)){
        return 0;
    }

    const fragment=
        document.createDocumentFragment();

    let start=0;
    let index;

    let count=0;

    while(
        (index=
            lower.indexOf(
                q,
                start
            )
        )!==-1
    ){

        fragment.appendChild(
            document.createTextNode(
                text.slice(
                    start,
                    index
                )
            )
        );

        const mark=
            document.createElement(
                "span"
            );

        mark.className=
            "search-word";

        mark.textContent=
            text.slice(
                index,
                index+query.length
            );

        fragment.appendChild(mark);

        count++;

        start=
            index+query.length;

    }

    fragment.appendChild(
        document.createTextNode(
            text.slice(start)
        )
    );

    node.parentNode.replaceChild(
        fragment,
        node
    );

    return count;

}


function searchNote(
    content,
    query
){

    const walker=
        document.createTreeWalker(
            content,
            NodeFilter.SHOW_TEXT
        );

    const nodes=[];

    let node;

    while(
        node=walker.nextNode()
    ){

        if(
            node.parentElement?.closest(
                ".search-word"
            )
        ){
            continue;
        }

        nodes.push(node);

    }

    return nodes.reduce(
        (total,textNode)=>
            total+
            searchTextNode(
                textNode,
                query
            ),
        0
    );

}


function performSearch(){

    clearSearch();

    const query=
        $("searchInput")
            .value
            .trim();

    if(!query){

        $("searchResult")
            .textContent="";

        return;

    }

    const notes=
        messages
            .querySelectorAll(".note");

    let noteCount=0;
    let resultCount=0;
    let first=null;

    notes.forEach(
        note=>{

            const content=
                note.querySelector(
                    ".note-content"
                );

            if(
                !content ||
                !content.textContent
                    .toLocaleLowerCase()
                    .includes(
                        query.toLocaleLowerCase()
                    )
            ){
                return;
            }

            noteCount++;

            if(!first){
                first=note;
            }

        }
    );

    if(!first){

        $("searchResult")
            .textContent="0";

        return;

    }

    notes.forEach(
        note=>{

            const content=
                note.querySelector(
                    ".note-content"
                );

            if(content){

                resultCount+=
                    searchNote(
                        content,
                        query
                    );

            }

        }
    );

    first.classList.add(
        "search-highlight"
    );

    first.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

    $("searchResult")
        .textContent=
        `${resultCount} / ${noteCount}`;

}


on(
    "searchButton",
    "click",
    ()=>{

        clearSearch();

        $("searchInput").value="";

        $("searchResult")
            .textContent="";

        $("searchOverlay")
            .classList.add("open");

        setTimeout(
            ()=>
                $("searchInput").focus(),
            80
        );

    }
);


$("searchInput")
    .addEventListener(
        "input",
        performSearch
    );


on(
    "searchDone",
    "click",
    ()=>{

        clearSearch();

        $("searchOverlay")
            .classList.remove("open");

    }
);


/* =====================================================
   RENDER
===================================================== */

function renderNotes(){

    messages.innerHTML="";

    if(!State.notes.length){

        const empty=
            document.createElement("div");

        empty.className="empty";

        empty.textContent=
            "لا توجد ملاحظات بعد";

        messages.appendChild(empty);

        return;

    }

    State.notes.forEach(
        note=>{

            const box=
                document.createElement("article");

            box.className="note";

            if(
                note.id===
                State.editingId
            ){

                box.classList.add(
                    "editing-note"
                );

            }

            const menu=
                document.createElement("button");

            menu.type="button";
            menu.className="note-menu";
            menu.textContent="⋮";

            menu.addEventListener(
                "click",
                event=>{

                    event.stopPropagation();

                    State.selectedNoteId=
                        note.id;

                    openMessageMenu(
                        event.clientX,
                        event.clientY
                    );

                }
            );

            const content=
                document.createElement("div");

            content.className=
                "note-content";

            content.innerHTML=
                note.html;

            box.append(
                menu,
                content
            );

            messages.appendChild(box);

        }
    );

}


/* =====================================================
   MESSAGE MENU
===================================================== */

function openMessageMenu(x,y){

    const menu=
        messageMenu;

    menu.dataset.noteId=
        State.selectedNoteId;

    menu.classList.add("open");

    const width=
        menu.offsetWidth||145;

    const height=
        menu.offsetHeight||90;

    let left=x-width;
    let top=y;

    left=
        Math.max(
            5,
            Math.min(
                left,
                innerWidth-width-5
            )
        );

    top=
        Math.max(
            5,
            Math.min(
                top,
                innerHeight-height-5
            )
        );

    menu.style.left=
        left+"px";

    menu.style.top=
        top+"px";

}


function closeMessageMenu(){

    messageMenu.classList.remove(
        "open"
    );

}


on(
    "editButton",
    "click",
    ()=>{

        const id=
            messageMenu.dataset.noteId;

        const note=
            State.notes.find(
                n=>n.id===id
            );

        if(!note){
            return;
        }

        State.editingId=
            note.id;

        State.selectedNoteId=
            note.id;

        editor.innerHTML=
            note.html;

        state.textContent=
            "✎";

        closeMessageMenu();

        renderNotes();

        focusEnd();

    }
);


on(
    "deleteButton",
    "click",
    ()=>{

        const id=
            messageMenu.dataset.noteId;

        const index=
            State.notes.findIndex(
                n=>n.id===id
            );

        if(index<0){
            return;
        }

        State.notes.splice(
            index,
            1
        );

        saveNotes();

        if(
            State.editingId===id
        ){
            resetEditor();
        }else{
            renderNotes();
        }

        closeMessageMenu();

    }
);


/* =====================================================
   SAVE
===================================================== */

on(
    "sendButton",
    "click",
    ()=>{

        if(!hasContent()){
            return;
        }

        const html=
            cleanHTML();

        if(!html){
            return;
        }

        if(State.editingId){

            const note=
                State.notes.find(
                    n=>
                        n.id===
                        State.editingId
                );

            if(note){
                note.html=html;
            }

        }else{

            State.notes.push({
                id:createId(),
                html
            });

        }

        if(saveNotes()){

            renderNotes();

            resetEditor();

            setTimeout(
                ()=>{
                    messages.scrollTop=
                        messages.scrollHeight;
                },
                30
            );

        }

    }
);


/* =====================================================
   RESET
===================================================== */

function resetEditor(){

    State.editingId=null;
    State.selectedNoteId=null;
    State.savedRange=null;

    State.bold=false;
    State.italic=false;
    State.underline=false;

    State.fontSize=8;
    State.alignment="right";

    editor.innerHTML="";

    state.textContent=
        "رسالة جديدة";

    document
        .querySelectorAll(".tool")
        .forEach(
            button=>
                button.classList.remove(
                    "active"
                )
        );

    closeSubBars();

    renderNotes();

}


/* =====================================================
   NEW / CANCEL
===================================================== */

on(
    "newButton",
    "click",
    ()=>{

        resetEditor();

        editor.focus();

    }
);


on(
    "cancelButton",
    "click",
    ()=>{

        resetEditor();

    }
);


/* =====================================================
   PASTE
===================================================== */

editor.addEventListener(
    "paste",
    event=>{

        event.preventDefault();

        const text=
            event.clipboardData
                ?.getData("text/plain")||"";

        prepareSelection();

        const range=
            getRange();

        if(!range){
            return;
        }

        range.deleteContents();

        const fragment=
            document.createDocumentFragment();

        const lines=
            text
                .replace(/\r\n/g,"\n")
                .replace(/\r/g,"\n")
                .split("\n");

        lines.forEach(
            (line,index)=>{

                if(index){
                    fragment.appendChild(
                        document.createElement("br")
                    );
                }

                fragment.appendChild(
                    document.createTextNode(
                        line
                    )
                );

            }
        );

        range.insertNode(fragment);

        range.collapse(false);

        const selection=
            window.getSelection();

        selection.removeAllRanges();
        selection.addRange(range);

        saveSelection();

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

editor.addEventListener(
    "keydown",
    event=>{

        if(
            event.ctrlKey||
            event.metaKey
        ){

            const key=
                event.key.toLowerCase();

            if(key==="b"){

                event.preventDefault();

                toggleBold();

            }

            if(key==="i"){

                event.preventDefault();

                toggleItalic();

            }

            if(key==="u"){

                event.preventDefault();

                toggleUnderline();

            }

        }

    }
);


/* =====================================================
   TABLE TAB
===================================================== */

editor.addEventListener(
    "keydown",
    event=>{

        if(event.key!=="Tab"){
            return;
        }

        const cell=
            event.target.closest?.(
                "td,th"
            );

        if(!cell){
            return;
        }

        event.preventDefault();

        const cells=
            Array.from(
                editor.querySelectorAll(
                    "td,th"
                )
            );

        const index=
            cells.indexOf(cell);

        if(index<0){
            return;
        }

        let next=
            event.shiftKey
                ? index-1
                : index+1;

        if(next<0){
            next=cells.length-1;
        }

        if(next>=cells.length){
            next=0;
        }

        const target=
            cells[next];

        target.focus();

        const range=
            document.createRange();

        range.selectNodeContents(target);
        range.collapse(false);

        const selection=
            window.getSelection();

        selection.removeAllRanges();
        selection.addRange(range);

        saveSelection();

    }
);


/* =====================================================
   OVERLAY CLOSE
===================================================== */

document
.querySelectorAll(".overlay")
.forEach(
    overlay=>{

        overlay.addEventListener(
            "click",
            event=>{

                if(
                    event.target===
                    overlay
                ){

                    overlay.classList.remove(
                        "open"
                    );

                    setTimeout(
                        restoreSelection,
                        0
                    );

                }

            }
        );

    }
);


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key!=="Escape"){
            return;
        }

        document
            .querySelectorAll(
                ".overlay.open"
            )
            .forEach(
                overlay=>
                    overlay.classList.remove(
                        "open"
                    )
            );

        closeMessageMenu();
        closeSubBars();

        setTimeout(
            restoreSelection,
            0
        );

    }
);


/* =====================================================
   OUTSIDE CLICK
===================================================== */

document.addEventListener(
    "click",
    event=>{

        if(
            !event.target.closest(".toolbar") &&
            !event.target.closest(".sub-toolbar")
        ){

            closeSubBars();

        }

        if(
            !event.target.closest(".message-menu") &&
            !event.target.closest(".note-menu")
        ){

            closeMessageMenu();

        }

    }
);


/* =====================================================
   TOUCH SELECTION
===================================================== */

editor.addEventListener(
    "touchend",
    ()=>{
        setTimeout(
            saveSelection,
            120
        );
    },
    {
        passive:true
    }
);


/* =====================================================
   MOBILE KEYBOARD
===================================================== */

(function(){

    const viewport=
        window.visualViewport;

    if(!viewport){
        return;
    }

    const composer=
        document.querySelector(
            ".editor-area"
        );

    const app=
        document.querySelector(
            ".app"
        );

    const messages=
        document.querySelector(
            ".messages"
        );

    function update(){

        const visible=
            viewport.height;

        const keyboard=
            Math.max(
                0,
                window.innerHeight-
                visible-
                viewport.offsetTop
            );

        if(keyboard>80){

            composer.style.position=
                "fixed";

            composer.style.left="0";
            composer.style.right="0";

            composer.style.bottom=
                keyboard+"px";

            composer.style.zIndex=
                "900";

            messages.style.paddingBottom=
                (
                    composer.offsetHeight+
                    12
                )+"px";

        }else{

            composer.style.position="";
            composer.style.left="";
            composer.style.right="";
            composer.style.bottom="";
            composer.style.zIndex="";

            messages.style.paddingBottom="";

        }

        app.style.height=
            visible+"px";

    }

    viewport.addEventListener(
        "resize",
        update,
        {
            passive:true
        }
    );

    viewport.addEventListener(
        "scroll",
        update,
        {
            passive:true
        }
    );

    window.addEventListener(
        "resize",
        update,
        {
            passive:true
        }
    );

    update();

})();
