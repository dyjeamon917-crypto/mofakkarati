<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no"
    >

    <title>مفكرتي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101114;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            touch-action: manipulation;
        }

        /* الصفحة الرئيسية */

        #home {
            width: 100%;
            height: 100%;
        }

        .topBar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid #30323a;
            background: #181a20;
        }

        .topTitle {
            font-size: 18px;
            font-weight: bold;
        }

        .iconButton {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: white;
            font-size: 22px;
        }

        .notebook {
            padding: 18px;
            border-bottom: 1px solid #30323a;
            font-size: 17px;
        }

        /* صفحة المحادثة */

        #chat {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 8px 230px;
            -webkit-overflow-scrolling: touch;
        }

        .empty {
            text-align: center;
            color: #777;
            margin-top: 30vh;
        }

        .messageRow {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            margin: 7px 0;
        }

        .message {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border-radius: 13px;
            background: #1d2028;
            overflow-wrap: anywhere;
        }

        .messageMenu {
            width: 34px;
            height: 34px;
            border: 0;
            background: transparent;
            color: #aaa;
            font-size: 22px;
        }

        /* المحرر الموحد */

        #editor {
            position: fixed;
            z-index: 50;
            left: 0;
            right: 0;
            bottom: 0;

            padding:
                6px
                7px
                calc(7px + env(safe-area-inset-bottom));

            background: #181a20;
            border-top: 1px solid #383b45;
            box-shadow: 0 -4px 18px rgba(0, 0, 0, .45);
        }

        .editorHeader {
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #aaa;
            font-size: 12px;
        }

        /*
            مهم:
            زر X هنا لا يحذف منطقة الكتابة.
            وظيفته فقط إلغاء وضع التعديل.
        */

        #cancelEdit {
            width: 34px;
            height: 28px;
            border: 0;
            background: transparent;
            color: #aaa;
            font-size: 20px;
        }

        .toolbar {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 5px 0;

            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .toolbar::-webkit-scrollbar {
            display: none;
        }

        .tool {
            flex: 0 0 auto;

            min-width: 36px;
            height: 36px;

            border: 1px solid #3b3e48;
            border-radius: 9px;

            background: #242730;
            color: white;

            font-size: 16px;
        }

        .tool:active {
            transform: scale(.95);
        }

        /* B */

        #boldButton {
            font-size: 19px;
        }

        /* منطقة الكتابة */

        .writeArea {
            display: flex;
            align-items: flex-end;
            gap: 6px;
        }

        #textEditor {
            flex: 1;

            min-height: 48px;
            max-height: 180px;

            overflow-y: auto;

            padding: 9px 10px;

            border: 1px solid #3b3e48;
            border-radius: 10px;

            background: #0f1014;

            color: white;

            outline: none;

            text-align: right;

            white-space: pre-wrap;
            overflow-wrap: anywhere;

            -webkit-user-select: text;
            user-select: text;
        }

        #textEditor:empty::before {
            content: "اكتب هنا...";
            color: #666;
            pointer-events: none;
        }

        #sendButton {
            flex: 0 0 auto;

            width: 46px;
            height: 46px;

            border: 0;
            border-radius: 50%;

            background: #2b6cff;
            color: white;

            font-size: 20px;
        }

        /* البحث */

        #searchBox {
            display: none;
            padding: 7px;
            background: #181a20;
        }

        #searchInput {
            width: 100%;
            padding: 9px 12px;

            border: 1px solid #444;
            border-radius: 18px;

            background: #101114;
            color: white;

            outline: none;
        }

        /* القوائم المنبثقة */

        .popup {
            display: none;

            position: fixed;
            z-index: 100;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            min-width: 180px;
            max-width: 90vw;

            padding: 10px;

            border: 1px solid #444;
            border-radius: 12px;

            background: #20232b;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }

        .popup button {
            width: 100%;
            min-height: 38px;
            margin: 3px 0;

            border: 1px solid #3b3e48;
            border-radius: 8px;

            background: #292c35;
            color: white;
        }

        /* قائمة الرسالة */

        #messageMenu {
            display: none;

            position: fixed;
            z-index: 200;

            padding: 5px;

            border: 1px solid #444;
            border-radius: 10px;

            background: #20232b;
        }

        #messageMenu button {
            display: block;

            min-width: 100px;
            min-height: 38px;

            border: 0;
            border-radius: 7px;

            background: transparent;
            color: white;

            text-align: right;
        }

        #messageMenu button:active {
            background: #30333d;
        }
    </style>
</head>

<body>

<!-- =========================
     الصفحة الرئيسية
========================= -->

<section id="home">

    <div class="topBar">

        <button
            class="iconButton"
            id="homeMenu"
            type="button"
        >
            ☰
        </button>

        <div class="topTitle">
            مفكرتي
        </div>

        <button
            class="iconButton"
            id="homeSearch"
            type="button"
        >
            ⌕
        </button>

    </div>

    <div
        class="notebook"
        id="openNotebook"
    >
        <b>مذاكرة النحو</b>
    </div>

</section>


<!-- =========================
     المحادثة
========================= -->

<section id="chat">

    <div class="topBar">

        <button
            class="iconButton"
            id="backButton"
            type="button"
        >
            ‹
        </button>

        <div class="topTitle">
            مذاكرة النحو
        </div>

        <button
            class="iconButton"
            id="chatSearch"
            type="button"
        >
            ⌕
        </button>

    </div>


    <div id="searchBox">

        <input
            id="searchInput"
            type="search"
            placeholder="بحث"
        >

    </div>


    <div id="messages"></div>


    <!-- =========================
         المحرر الواحد
    ========================== -->

    <div id="editor">

        <div class="editorHeader">

            <span id="editorStatus">
                ＋ رسالة جديدة
            </span>

            <button
                id="cancelEdit"
                type="button"
                aria-label="إلغاء"
            >
                ×
            </button>

        </div>


        <div class="toolbar">

            <!-- B -->

            <button
                class="tool"
                id="boldButton"
                type="button"
            >
                <b>B</b>
            </button>


            <!-- مائل -->

            <button
                class="tool"
                id="italicButton"
                type="button"
            >
                <i>I</i>
            </button>


            <!-- تسطير -->

            <button
                class="tool"
                id="underlineButton"
                type="button"
            >
                <u>U</u>
            </button>


            <!-- لون الخط -->

            <button
                class="tool"
                id="textColorButton"
                type="button"
            >
                ●
            </button>


            <!-- تمييز -->

            <button
                class="tool"
                id="highlightButton"
                type="button"
            >
                🖍
            </button>


            <!-- حجم الخط -->

            <button
                class="tool"
                id="fontSizeButton"
                type="button"
            >
                A↕
            </button>


            <!-- التنقيط / الترقيم -->

            <button
                class="tool"
                id="listButton"
                type="button"
            >
                ☷
            </button>


            <!-- المحاذاة -->

            <button
                class="tool"
                data-command="justifyRight"
                type="button"
            >
                →
            </button>

            <button
                class="tool"
                data-command="justifyCenter"
                type="button"
            >
                ↔
            </button>

            <button
                class="tool"
                data-command="justifyLeft"
                type="button"
            >
                ←
            </button>


            <!-- جدول -->

            <button
                class="tool"
                id="tableButton"
                type="button"
            >
                ▦
            </button>


            <!-- خريطة ذهنية -->

            <button
                class="tool"
                id="mindButton"
                type="button"
            >
                ⌘
            </button>


            <!-- صف / عمود -->

            <button
                class="tool"
                id="addRow"
                type="button"
            >
                ⬇️
            </button>

            <button
                class="tool"
                id="addColumn"
                type="button"
            >
                ⬅️
            </button>

            <button
                class="tool"
                id="deleteRow"
                type="button"
            >
                ✕
            </button>

            <button
                class="tool"
                id="deleteColumn"
                type="button"
            >
                ✕
            </button>

        </div>


        <!-- منطقة الكتابة -->

        <div class="writeArea">

            <div
                id="textEditor"
                contenteditable="true"
                spellcheck="true"
            ></div>

            <button
                id="sendButton"
                type="button"
            >
                ➤
            </button>

        </div>

    </div>

</section>


<!-- =========================
     قائمة الرسالة
========================= -->

<div id="messageMenu">

    <button
        id="editMessage"
        type="button"
    >
        تعديل
    </button>

    <button
        id="noteMessage"
        type="button"
    >
        ?
    </button>

    <button
        id="deleteMessage"
        type="button"
    >
        حذف
    </button>

</div>


<!-- =========================
     نوافذ الأدوات
========================= -->

<div
    class="popup"
    id="colorPopup"
>
    <b>لون الخط</b>
    <p>سنضع عجلة الألوان هنا في الملف التالي.</p>

    <button
        id="closeColor"
        type="button"
    >
        ✓
    </button>
</div>


<div
    class="popup"
    id="highlightPopup"
>
    <b>تمييز النص</b>
    <p>سنضع اختيار التمييز هنا في الملف التالي.</p>

    <button
        id="closeHighlight"
        type="button"
    >
        ✓
    </button>
</div>


<div
    class="popup"
    id="fontSizePopup"
>
    <b>حجم الخط</b>

    <div id="fontSizes"></div>

    <button
        id="closeFontSize"
        type="button"
    >
        ✓
    </button>
</div>


<div
    class="popup"
    id="listPopup"
>
    <button
        id="bulletList"
        type="button"
    >
        • تنقيط
    </button>

    <button
        id="numberList"
        type="button"
    >
        ١. ترقيم
    </button>

</div>


<script>

    /*
        المرحلة الأولى فقط:

        - محرر واحد.
        - إرسال وتعديل من نفس المكان.
        - زر × لا يخفي منطقة الكتابة.
        - حفظ الرسائل في localStorage.
        - تنسيق B / I / U.
        - المحاذاة.
        - البحث.
        
        الألوان والجدول والخريطة الذهنية
        سنبنيها في ملفات منفصلة بعد اختبار
        هذه المرحلة.
    */


    const home = document.getElementById("home");
    const chat = document.getElementById("chat");

    const openNotebook =
        document.getElementById("openNotebook");

    const backButton =
        document.getElementById("backButton");

    const textEditor =
        document.getElementById("textEditor");

    const sendButton =
        document.getElementById("sendButton");

    const messagesBox =
        document.getElementById("messages");

    const editorStatus =
        document.getElementById("editorStatus");

    const cancelEdit =
        document.getElementById("cancelEdit");

    const messageMenu =
        document.getElementById("messageMenu");


    let messages =
        JSON.parse(
            localStorage.getItem("myNotesClean") || "[]"
        );


    let editingIndex = -1;

    let selectedMessage = -1;

    let savedSelection = null;


    /* =========================
       تحديد النص
    ========================== */

    function saveSelection() {

        const selection =
            window.getSelection();

        if (
            selection &&
            selection.rangeCount
        ) {

            savedSelection =
                selection
                .getRangeAt(0)
                .cloneRange();
        }
    }


    function restoreSelection() {

        if (!savedSelection) {
            return;
        }

        const selection =
            window.getSelection();

        selection.removeAllRanges();

        selection.addRange(
            savedSelection
        );
    }


    textEditor.addEventListener(
        "mouseup",
        saveSelection
    );


    textEditor.addEventListener(
        "keyup",
        saveSelection
    );


    textEditor.addEventListener(
        "touchend",
        function () {

            setTimeout(
                saveSelection,
                0
            );

        }
    );


    /* =========================
       فتح المفكرة
    ========================== */

    openNotebook.onclick =
        function () {

            home.style.display =
                "none";

            chat.style.display =
                "flex";

            renderMessages();

            openNewEditor();

        };


    /* =========================
       العودة
    ========================== */

    backButton.onclick =
        function () {

            chat.style.display =
                "none";

            home.style.display =
                "block";

        };


    /* =========================
       محرر جديد
    ========================== */

    function openNewEditor() {

        editingIndex = -1;

        editorStatus.textContent =
            "＋ رسالة جديدة";

        textEditor.innerHTML = "";

        textEditor.focus();

    }


    /* =========================
       تعديل رسالة
    ========================== */

    function editMessage(index) {

        editingIndex = index;

        editorStatus.textContent =
            "✎ تعديل";

        textEditor.innerHTML =
            messages[index].html;

        textEditor.focus();

        messageMenu.style.display =
            "none";

    }


    /* =========================
       زر X
       
       مهم جدًا:
       لا يخفي المحرر.
       فقط يخرج من وضع التعديل.
    ========================== */

    cancelEdit.onclick =
        function () {

            editingIndex = -1;

            editorStatus.textContent =
                "＋ رسالة جديدة";

            textEditor.innerHTML =
                "";

            textEditor.focus();

        };


    /* =========================
       إرسال / حفظ التعديل
    ========================== */

    sendButton.onclick =
        function () {

            const html =
                textEditor.innerHTML.trim();

            if (!html) {
                return;
            }


            if (editingIndex >= 0) {

                messages[
                    editingIndex
                ].html = html;

            } else {

                messages.push({

                    html: html,

                    note: ""

                });

            }


            localStorage.setItem(
                "myNotesClean",
                JSON.stringify(messages)
            );


            renderMessages();

            openNewEditor();

        };


    /* =========================
       عرض الرسائل
    ========================== */

    function renderMessages() {

        messagesBox.innerHTML =
            "";


        if (!messages.length) {

            messagesBox.innerHTML =
                '<div class="empty">المفكرة فارغة</div>';

            return;

        }


        messages.forEach(
            function (message, index) {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "messageRow";


                const content =
                    document.createElement(
                        "div"
                    );

                content.className =
                    "message";

                content.innerHTML =
                    message.html;


                const menuButton =
                    document.createElement(
                        "button"
                    );

                menuButton.className =
                    "messageMenu";

                menuButton.textContent =
                    "⋮";


                menuButton.onclick =
                    function (event) {

                        selectedMessage =
                            index;


                        messageMenu.style.display =
                            "block";


                        messageMenu.style.left =
                            Math.max(
                                5,
                                event.clientX -
