<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>ملاحظاتي</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#101218;
color:#fff
}

button{
font-family:inherit;
touch-action:manipulation;
cursor:pointer
}

.app{
width:100%;
height:100%;
display:flex;
flex-direction:column
}

.header{
height:56px;
flex-shrink:0;
display:flex;
align-items:center;
gap:8px;
padding:7px 10px;
background:#191c24;
border-bottom:1px solid #343944
}

.title{
flex:1;
text-align:center;
font-size:18px;
font-weight:bold
}

.icon{
width:40px;
height:40px;
border:0;
border-radius:50%;
background:#292e39;
color:#fff;
font-size:20px
}

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:10px;
-webkit-overflow-scrolling:touch
}

.empty{
text-align:center;
color:#777;
margin-top:30vh
}

.note{
background:#20242d;
border-radius:14px;
padding:11px 13px;
margin-bottom:9px;
line-height:1.7;
overflow-wrap:anywhere
}

.note-menu{
float:left;
width:32px;
height:32px;
border:0;
border-radius:50%;
background:transparent;
color:#aaa;
font-size:20px
}

.editor-area{
flex-shrink:0;
background:#191c24;
border-top:1px solid #343944;
padding:5px 7px calc(8px + env(safe-area-inset-bottom))
}

.edit-state{
height:28px;
display:flex;
align-items:center;
justify-content:space-between;
color:#aaa;
font-size:12px
}

.cancel{
width:34px;
height:28px;
border:0;
background:transparent;
color:#aaa;
font-size:21px
}

.toolbar{
display:flex;
gap:5px;
overflow-x:auto;
padding:3px 0 7px;
scrollbar-width:none
}

.toolbar::-webkit-scrollbar{
display:none
}

.tool{
flex:0 0 39px;
width:39px;
height:39px;
border:1px solid #444955;
border-radius:10px;
background:#292e39;
color:#fff;
font-size:17px;
display:flex;
align-items:center;
justify-content:center
}

.tool.active{
background:#315fae;
border-color:#5f8fe8;
box-shadow:0 0 0 2px rgba(52,113,246,.25)
}

.bold{
font-weight:900
}

.underline{
text-decoration:underline;
text-decoration-thickness:2px;
text-underline-offset:7px
}

.write-row{
display:flex;
align-items:flex-end;
gap:6px
}

.editor{
flex:1;
min-width:0;
min-height:48px;
max-height:170px;
overflow-y:auto;
padding:9px 11px;
border:1px solid #464b57;
border-radius:12px;
outline:none;
background:#0e1015;
color:#fff;
line-height:1.7;
overflow-wrap:anywhere;
word-break:break-word;
white-space:pre-wrap;
user-select:text;
-webkit-user-select:text;
direction:rtl;
text-align:right
}

.editor:empty::before{
content:"اكتبي ملاحظتك هنا...";
color:#666
}

.editor u{
text-underline-offset:7px;
text-decoration-thickness:2px
}

.send{
flex:0 0 47px;
width:47px;
height:47px;
border:0;
border-radius:50%;
background:#3471f6;
color:#fff;
font-size:21px
}

.font-size-bar{
display:none;
align-items:center;
gap:5px;
overflow-x:auto;
scrollbar-width:none;
padding:3px 0 7px;
direction:ltr
}

.font-size-bar::-webkit-scrollbar{
display:none
}

.font-size-item{
flex:0 0 34px;
width:34px;
height:32px;
border:1px solid #444955;
border-radius:8px;
background:#292e39;
color:#fff;
font-size:13px;
padding:0
}

.font-size-item.active{
background:#315fae;
border-color:#6b98ef
}

.alignment-bar{
display:none;
align-items:center;
gap:5px;
overflow-x:auto;
scrollbar-width:none;
padding:3px 0 7px
}

.alignment-bar::-webkit-scrollbar{
display:none
}

.align-item{
flex:0 0 36px;
width:36px;
height:32px;
border:1px solid #444955;
border-radius:8px;
background:#292e39;
color:#fff;
font-size:16px;
padding:0
}

.align-item.active{
background:#315fae;
border-color:#6b98ef
}

.overlay{
display:none;
position:fixed;
inset:0;
z-index:500;
background:rgba(0,0,0,.58);
align-items:center;
justify-content:center;
padding:15px
}

.panel{
width:min(94vw,350px);
max-height:86vh;
overflow:auto;
background:#20242d;
border:1px solid #444955;
border-radius:17px;
padding:15px;
box-shadow:0 15px 50px #000b
}

.panel-title{
text-align:center;
font-weight:bold;
margin-bottom:12px
}

.color-picker{
width:270px;
max-width:78vw;
margin:10px auto 15px
}

.color-wheel{
position:relative;
width:250px;
height:250px;
max-width:72vw;
max-height:72vw;
margin:auto;
touch-action:none;
border-radius:50%;
overflow:hidden
}

.hue-ring{
position:absolute;
inset:0;
border-radius:50%;
background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)
}

.sv-area{
position:absolute;
inset:13%;
border-radius:50%;
overflow:hidden;
background:linear-gradient(to right,#fff,hsl(var(--hue),100%,50%)),
linear-gradient(to bottom,transparent,#000)
}

.sv-white{
position:absolute;
inset:0;
background:linear-gradient(to right,rgba(255,255,255,1),rgba(255,255,255,0))
}

.sv-black{
position:absolute;
inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,1))
}

.color-marker{
position:absolute;
width:21px;
height:21px;
border:3px solid white;
border-radius:50%;
box-shadow:0 0 0 2px #000,0 0 4px #000;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:10
}

.hue-marker{
position:absolute;
width:19px;
height:19px;
border:3px solid white;
border-radius:50%;
box-shadow:0 0 0 2px #000;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:11
}

.color-presets{
display:flex;
justify-content:center;
gap:8px;
margin-top:10px
}

.color-preset{
width:36px;
height:36px;
border:2px solid #666;
border-radius:50%
}

.black-preset{
background:#000
}

.white-preset{
background:#fff
}

.range-title{
text-align:center;
color:#ccc;
margin-bottom:5px
}

.range{
width:100%;
accent-color:#4c80ff
}

.panel-button{
width:100%;
height:43px;
border:0;
border-radius:10px;
background:#303642;
color:#fff;
margin-top:10px
}

.highlight-actions{
display:flex;
gap:7px
}

.highlight-actions button{
flex:1
}

.list-choice{
display:flex;
gap:7px
}

.list-choice button{
flex:1;
min-height:48px;
border:1px solid #444955;
border-radius:10px;
background:#2a2f39;
color:#fff
}

.editor table,
.note table{
width:max-content;
max-width:100%;
border-collapse:collapse;
table-layout:auto;
margin:8px 0
}

.editor td,
.editor th,
.note td,
.note th{
border:1px solid #666d7b;
padding:7px 9px;
min-width:45px;
height:34px;
vertical-align:top;
white-space:pre-wrap;
overflow-wrap:anywhere;
word-break:break-word
}

.editor td:focus,
.editor th:focus{
outline:1px solid #3471f6
}

.mind-map{
width:100%;
max-width:100%;
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
margin:10px 0
}

.mind-center{
width:fit-content;
max-width:90%;
padding:9px 15px;
border:1px solid #5579bd;
border-radius:12px;
background:#263657;
text-align:center;
overflow-wrap:anywhere;
word-break:break-word;
white-space:pre-wrap
}

.mind-branches{
width:100%;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:9px
}

.mind-branch{
width:auto;
max-width:45%;
min-width:80px;
padding:8px 10px;
border:1px solid #555d6d;
border-radius:10px;
background:#292e39;
text-align:center;
overflow-wrap:anywhere;
word-break:break-word;
white-space:pre-wrap;
line-height:1.6
}

.mind-input{
width:100%;
min-height:43px;
max-height:130px;
border:1px solid #464b57;
border-radius:10px;
background:#0e1015;
color:#fff;
padding:8px 10px;
outline:none;
margin-bottom:7px;
font-family:inherit;
font-size:16px;
line-height:1.6;
resize:vertical;
direction:rtl;
text-align:right;
white-space:pre-wrap;
overflow-y:auto
}

.mind-input:focus{
border-color:#3471f6
}

.menu{
display:none;
position:fixed;
z-index:1000;
min-width:135px;
padding:5px;
background:#20242d;
border:1px solid #444955;
border-radius:11px;
box-shadow:0 10px 35px #000b
}

.menu button{
display:block;
width:100%;
min-height:42px;
border:0;
border-radius:7px;
background:transparent;
color:#fff;
text-align:right;
padding:0 10px
}

.search-input{
width:100%;
height:45px;
border:1px solid #464b57;
border-radius:10px;
background:#0e1015;
color:#fff;
padding:8px 10px;
outline:none;
font-size:16px
}

.search-result{
margin-top:10px;
color:#aaa;
text-align:center;
font-size:13px
}

.search-highlight{
outline:2px solid #3471f6;
outline-offset:2px
}

.search-word{
background:rgba(255,214,0,.45);
border-radius:3px;
padding:0 2px
}

@media(max-width:420px){
.panel{
width:94vw
}

.color-wheel{
width:220px;
height:220px
}

.mind-branch{
min-width:70px;
max-width:45%
}
}
</style>
</head>

<body>

</div>

<script>
"use strict";


/* =========================================================
   التخزين والحالة
========================================================= */

const STORAGE="notes_clean_editor_v2";

let notes=[];

try{
const stored=localStorage.getItem(STORAGE);
const parsed=stored?JSON.parse(stored):[];
notes=Array.isArray(parsed)?parsed:[];
}catch(error){
notes=[];
}

let editingIndex=-1;
let selectedIndex=-1;

let savedRange=null;

let currentFontSize=8;
let currentAlignment="right";


/* =========================================================
   العناصر
========================================================= */

const editor=document.getElementById("editor");
const messages=document.getElementById("messages");
const state=document.getElementById("state");
const messageMenu=document.getElementById("messageMenu");
const fontSizeBar=document.getElementById("fontSizeBar");
const alignmentBar=document.getElementById("alignmentBar");


/* =========================================================
   الحفظ
========================================================= */

function saveNotes(){
try{
localStorage.setItem(STORAGE,JSON.stringify(notes));
}catch(error){
console.error("تعذر حفظ الملاحظات:",error);
}
}


/* =========================================================
   التحقق من المحتوى
========================================================= */

function editorHasRealContent(){

const clone=editor.cloneNode(true);

clone.querySelectorAll("br").forEach(br=>{
br.replaceWith(" ");
});

const text=(clone.textContent||"")
.replace(/\u200B/g,"")
.replace(/\uFEFF/g,"")
.trim();

const hasTable=clone.querySelector("table");
const hasMindMap=clone.querySelector(".mind-map");

return Boolean(text||hasTable||hasMindMap);
}


/* =========================================================
   تنظيف بقايا المؤشر الوهمي
========================================================= */

function cleanEditorHtml(html){

return String(html||"")
.replace(/\u200B/g,"")
.replace(/^\s+|\s+$/g,"");
}


/* =========================================================
   عرض الملاحظات
========================================================= */

function render(){

messages.innerHTML="";

if(notes.length===0){

messages.innerHTML=
'<div class="empty">لا توجد ملاحظات بعد</div>';

return;
}

notes.forEach(function(note,index){

const box=document.createElement("div");

box.className="note";

const menu=document.createElement("button");

menu.className="note-menu";
menu.textContent="⋮";
menu.type="button";

menu.addEventListener("click",function(event){

event.stopPropagation();

selectedIndex=index;

openMessageMenu(
event.clientX,
event.clientY
);

});

box.appendChild(menu);

const content=document.createElement("div");

content.innerHTML=note.html||"";

box.appendChild(content);

messages.appendChild(box);

});

}


/* =========================================================
   قائمة الملاحظة
========================================================= */

function openMessageMenu(x,y){

messageMenu.style.display="block";

let left=x-140;
let top=y;

if(left<5){
left=5;
}

if(left+140>window.innerWidth){
left=window.innerWidth-145;
}

if(top+100>window.innerHeight){
top=window.innerHeight-110;
}

messageMenu.style.left=left+"px";
messageMenu.style.top=top+"px";

}


document.addEventListener("click",function(event){

if(
!event.target.closest(".menu") &&
!event.target.closest(".note-menu")
){
messageMenu.style.display="none";
}

});


/* =========================================================
   Range / Selection
========================================================= */

function selectionIsInsideEditor(range){

if(!range)return false;

return (
editor.contains(range.startContainer) &&
editor.contains(range.endContainer)
);

}


function saveSelection(){

const selection=window.getSelection();

if(
selection &&
selection.rangeCount>0
){

const range=selection.getRangeAt(0);

if(selectionIsInsideEditor(range)){

savedRange=range.cloneRange();

}

}

}


function restoreSelection(){

if(
!savedRange ||
!selectionIsInsideEditor(savedRange)
){
return false;
}

const selection=window.getSelection();

selection.removeAllRanges();

selection.addRange(savedRange);

return true;

}


function focusEditor(){

editor.focus();

restoreSelection();

}


/* =========================================================
   معرفة حجم الخط الحالي
========================================================= */

function detectCurrentFontSize(){

const selection=window.getSelection();

if(
!selection ||
selection.rangeCount===0 ||
!selectionIsInsideEditor(selection.getRangeAt(0))
){
return currentFontSize;
}

let node=selection.anchorNode;

if(node&&node.nodeType===Node.TEXT_NODE){
node=node.parentElement;
}

if(!node || !editor.contains(node)){
return currentFontSize;
}

const computed=getComputedStyle(node);

const size=parseFloat(computed.fontSize);

if(
Number.isFinite(size) &&
size>0
){
currentFontSize=Math.round(size);
}

return currentFontSize;

}


/* =========================================================
   معرفة المحاذاة الحالية
========================================================= */

function detectCurrentAlignment(){

const selection=window.getSelection();

if(
!selection ||
selection.rangeCount===0 ||
!selectionIsInsideEditor(selection.getRangeAt(0))
){
return currentAlignment;
}

let node=selection.anchorNode;

if(node&&node.nodeType===Node.TEXT_NODE){
node=node.parentElement;
}

while(
node &&
node!==editor
){

const style=getComputedStyle(node);

if(
style.textAlign==="right" ||
style.textAlign==="center" ||
style.textAlign==="left"
){

currentAlignment=style.textAlign;

return currentAlignment;

}

node=node.parentElement;

}

currentAlignment=getComputedStyle(editor).textAlign||"right";

return currentAlignment;

}


/* =========================================================
   حالة أزرار التنسيق
========================================================= */

function updateToolbarState(){

if(
!selectionIsInsideEditor(
window.getSelection() &&
window.getSelection().rangeCount
?window.getSelection().getRangeAt(0)
:null
)
){
return;
}

document.getElementById("boldButton")
.classList.toggle(
"active",
document.queryCommandState("bold")
);

document.getElementById("italicButton")
.classList.toggle(
"active",
document.queryCommandState("italic")
);

document.getElementById("underlineButton")
.classList.toggle(
"active",

/* =========================================================
   الألوان
========================================================= */

function hsvToRgb(h,s,v){

s/=100;
v/=100;

const c=v*s;
const x=c*(1-Math.abs((h/60)%2-1));
const m=v-c;

let r=0,g=0,b=0;

if(h<60){
r=c;
g=x;
}else if(h<120){
r=x;
g=c;
}else if(h<180){
g=c;
b=x;
}else if(h<240){
g=x;
b=c;
}else if(h<300){
r=x;
b=c;
}else{
r=c;
b=x;
}

return{
r:Math.round((r+m)*255),
g:Math.round((g+m)*255),
b:Math.round((b+m)*255)
};

}


function rgbString(rgb){

return `rgb(${rgb.r},${rgb.g},${rgb.b})`;

}


/* =========================================================
   عجلة الألوان
========================================================= */

function setupAdvancedColorWheel(
wheel,
hueMarker,
colorMarker,
initialHue,
callback
){

let hue=initialHue;
let saturation=100;
let value=100;

function setColor(){

wheel.style.setProperty("--hue",hue);

const rgb=hsvToRgb(
hue,
saturation,
value
);

colorMarker.style.background=rgbString(rgb);

callback(rgbString(rgb));

}


function setHue(event){

const rect=wheel.getBoundingClientRect();

const cx=rect.left+rect.width/2;
const cy=rect.top+rect.height/2;

let dx=event.clientX-cx;
let dy=event.clientY-cy;

let angle=Math.atan2(dy,dx)*180/Math.PI;

angle=(angle+90+360)%360;

hue=angle;

const radius=Math.min(
rect.width,
rect.height
)/2;

const ringRadius=radius*.89;

const x=
cx+
Math.sin(hue*Math.PI/180)*
ringRadius;

const y=
cy-
Math.cos(hue*Math.PI/180)*
ringRadius;

hueMarker.style.left=
((x-rect.left)/rect.width*100)+"%";

hueMarker.style.top=
((y-rect.top)/rect.height*100)+"%";

setColor();

}


function setSV(event){

const rect=wheel.getBoundingClientRect();

const innerLeft=rect.width*.13;
const innerTop=rect.height*.13;

const innerWidth=rect.width*.74;
const innerHeight=rect.height*.74;

let x=
event.clientX-
rect.left-
innerLeft;

let y=
event.clientY-
rect.top-
innerTop;

x=Math.max(
0,
Math.min(innerWidth,x)
);

y=Math.max(
0,
Math.min(innerHeight,y)
);

saturation=x/innerWidth*100;

value=100-y/innerHeight*100;

const markerX=innerLeft+x;
const markerY=innerTop+y;

colorMarker.style.left=
(markerX/rect.width*100)+"%";

colorMarker.style.top=
(markerY/rect.height*100)+"%";

setColor();

}


let hueDragging=false;
let svDragging=false;


wheel.addEventListener(
"pointerdown",
function(event){

const rect=wheel.getBoundingClientRect();

const cx=rect.left+rect.width/2;
const cy=rect.top+rect.height/2;

const distance=Math.sqrt(
Math.pow(event.clientX-cx,2)+
Math.pow(event.clientY-cy,2)
);

const radius=Math.min(
rect.width,
rect.height
)/2;

if(distance>radius*.78){
hueDragging=true;
}else{
svDragging=true;
}

try{
wheel.setPointerCapture(event.pointerId);
}catch(error){}

if(hueDragging){
setHue(event);
}else{
setSV(event);
}

event.preventDefault();

});


wheel.addEventListener(
"pointermove",
function(event){

if(hueDragging){
setHue(event);
}

if(svDragging){
setSV(event);
}

event.preventDefault();

});


wheel.addEventListener(
"pointerup",
function(event){

hueDragging=false;
svDragging=false;

try{
wheel.releasePointerCapture(event.pointerId);
}catch(error){}

});


wheel.addEventListener(
"pointercancel",
function(){

hueDragging=false;
svDragging=false;

});


setColor();

}

/*
   إصلاح مهم:
   بعد execCommand لا نبحث في المحرر كله،
   بل نعالج فقط عناصر font التي تتقاطع
   مع Range الأصلي.
*/

function applyFontSize(size){

currentFontSize=size;

const range=
savedRange &&
savedRange.cloneRange
?savedRange.cloneRange()
:null;

if(
range &&
!range.collapsed &&
selectionIsInsideEditor(range)
){

const selection=window.getSelection();

selection.removeAllRanges();

selection.addRange(range);

try{

document.execCommand(
"fontSize",
false,
"7"
);

}catch(error){

console.error(error);

}


const fonts=[
...editor.querySelectorAll('font[size="7"]')
];

fonts.forEach(function(font){

try{

if(
typeof range.intersectsNode==="function" &&
!range.intersectsNode(font)
){
return;
}

font.removeAttribute("size");

font.style.fontSize=
size+"px";

}catch(error){

/*
   إذا فشل intersectsNode بسبب Range
   غير صالح، لا نعدل العنصر.
*/

}

});


saveSelection();

}else{

editor.focus();

restoreSelection();

const selection=window.getSelection();

if(
selection &&
selection.rangeCount>0
){

const activeRange=selection.getRangeAt(0);

if(
selectionIsInsideEditor(activeRange) &&
activeRange.collapsed
){

const span=document.createElement("span");

span.style.fontSize=
size+"px";

const textNode=
document.createTextNode("\u200B");

span.appendChild(textNode);

activeRange.insertNode(span);

const newRange=
document.createRange();

newRange.setStart(
textNode,
textNode.length
);

newRange.collapse(true);

selection.removeAllRanges();

selection.addRange(newRange);

savedRange=
newRange.cloneRange();

}

}

}


fontSizeBar.style.display="none";

editor.focus();

updateToolbarState();

updateFontSizeButtons();

}

   حذف الملاحظة
========================================================= */

document.getElementById("deleteButton")
.addEventListener("click",function(){

if(
selectedIndex<0 ||
selectedIndex>=notes.length
){
return;
}


const deletedIndex=selectedIndex;

notes.splice(
deletedIndex,
1
);


/*
   إصلاح مهم جدًا:
   إذا كانت الملاحظة المحذوفة هي
   الملاحظة التي يتم تعديلها،
   نلغي وضع التعديل.

   وإذا كانت قبل الملاحظة التي يتم تعديلها،
   ننقص editingIndex حتى يبقى يشير
   للملاحظة الصحيحة.
*/

if(editingIndex===deletedIndex){

resetEditor();

}else if(
editingIndex>deletedIndex
){

editingIndex--;

}


selectedIndex=-1;

saveNotes();

render();

messageMenu.style.display="none";

});


/* =========================================================
   إلغاء
========================================================= */

document.getElementById("cancelButton")
.addEventListener("click",function(){

resetEditor();

editor.focus();

});


/* =========================================================
   ملاحظة جديدة
========================================================= */

document.getElementById("newButton")
.addEventListener("click",function(){

resetEditor();

editor.focus();

});


/* =========================================================
   إغلاق النوافذ بالضغط خارجها
========================================================= */

document
.querySelectorAll(".overlay")
.forEach(function(overlay){

overlay.addEventListener(
"click",
function(event){

if(event.target===overlay){

overlay.style.display="none";

}

});

});


/* =========================================================
   منع خروج النص من الشاشة داخل الجداول
========================================================= */

editor.addEventListener(
"paste",
function(){

setTimeout(function(){

saveSelection();

},0);

});


/* =========================================================
   بدء التطبيق
========================================================= */

render();

updateFontSizeButtons();

updateAlignmentButtons();

</script>

</body>
</html>
