<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>ملاحظاتي</title>

<style>
:root{
  --bg:#0d0f12;
  --panel:#15181d;
  --panel2:#1c2027;
  --editor:#111419;
  --line:#2b313b;
  --text:#f4f6f8;
  --muted:#8d97a5;
  --accent:#6ea8fe;
  --danger:#ff6464;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans Arabic",sans-serif;
}

body{
  overflow:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

header{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 9px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}

.logo{
  margin-inline:auto;
  font-size:18px;
  font-weight:bold;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--panel2);
  font-size:19px;
}

.icon-btn:active,
.tool:active,
.mini:active{
  transform:scale(.94);
}

.icon-btn.active,
.tool.active{
  background:#263b5d;
  outline:1px solid var(--accent);
}

/* ================= MAIN ================= */

.main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.notes{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:12px 9px 100px;
}

.empty{
  height:100%;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-size:25px;
}

/* ================= NOTE ================= */

.note{
  max-width:900px;
  margin:0 auto 12px;
  padding:12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  box-shadow:0 5px 20px #0002;
}

.note-head{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:7px;
}

.note-time{
  margin-inline-end:auto;
  color:var(--muted);
  font-size:10px;
}

.note-actions{
  display:flex;
  gap:5px;
}

.mini{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:var(--panel2);
}

.note-content{
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:16px;
}

.note-content table{
  width:100%;
  max-width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

.note-content td,
.note-content th{
  border:1px solid #66707d;
  padding:7px;
  min-width:30px;
  overflow-wrap:anywhere;
}

/* ================= COMPOSER ================= */

.composer{
  flex:none;
  background:var(--panel);
  border-top:1px solid var(--line);
  padding:7px;
  padding-bottom:max(7px,env(safe-area-inset-bottom));
}

.toolbar{
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:7px;
}

.toolbar::-webkit-scrollbar{
  display:none;
}

.tool{
  flex:0 0 39px;
  height:39px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:var(--panel2);
  font-weight:bold;
  font-size:17px;
}

.editor-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.editor{
  flex:1;
  min-height:48px;
  max-height:34dvh;
  overflow:auto;
  padding:11px;
  background:var(--editor);
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;

  direction:rtl;
  text-align:right;
  white-space:pre-wrap;
  overflow-wrap:anywhere;

  font-size:8px;
  line-height:1.6;
}

.editor:empty::before{
  content:"اكتبي ملاحظتك هنا…";
  color:#68717d;
  pointer-events:none;
}

.save{
  width:48px;
  height:48px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:var(--accent);
  color:#08111e;
  font-size:20px;
}

/* ================= FONT / ALIGN ================= */

.extra-bar{
  display:none;
  gap:5px;
  overflow-x:auto;
  padding-bottom:7px;
}

.extra-bar.show{
  display:flex;
}

.extra-bar button{
  min-width:37px;
  height:32px;
  padding:0 7px;
  border-radius:8px;
  background:var(--panel2);
}

/* ================= OVERLAYS ================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:#000a;
}

.overlay.show{
  display:flex;
}

.sheet{
  width:min(530px,100%);
  max-height:90dvh;
  overflow:auto;

  background:var(--panel);
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:20px 20px 0 0;

  padding:15px;
}

.sheet-head{
  display:flex;
  align-items:center;
  min-height:40px;
  margin-bottom:12px;
}

.sheet-head strong{
  font-size:20px;
}

.close{
  margin-inline-start:auto;
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--panel2);
}

/* ================= COUNTERS ================= */

.counter-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin:12px 0 18px;
}

.counter{
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px;
  background:var(--panel2);
  border-radius:12px;
}

.counter button{
  width:40px;
  height:40px;
  border-radius:10px;
  background:#252b34;
  font-size:22px;
}

.counter output{
  min-width:32px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.confirm{
  margin:auto;
}

/* ================= COLOR ================= */

.color-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:13px;
}

.color-wheel{
  position:relative;

  width:min(78vw,300px);
  aspect-ratio:1;

  border-radius:50%;

  background:
    conic-gradient(
      #ff0000,
      #ffff00,
      #00ff00,
      #00ffff,
      #0000ff,
      #ff00ff,
      #ff0000
    );

  box-shadow:
    inset 0 0 0 2px #343b46,
    0 8px 30px #0008;

  touch-action:none;
}

.color-wheel::after{
  content:"";

  position:absolute;
  inset:13%;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #fff 0%,
      #fff0 70%
    );

  pointer-events:none;
}

.color-marker{
  position:absolute;

  width:22px;
  height:22px;

  border-radius:50%;

  border:3px solid white;

  box-shadow:
    0 0 0 2px #111,
    0 2px 7px #000;

  transform:translate(-50%,-50%);

  z-index:3;
}

.special-colors{
  display:flex;
  gap:13px;
}

.special-color{
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid #66707d;

  display:grid;
  place-items:center;
  font-size:20px;
}

.white{
  background:white;
  color:black;
}

.black{
  background:black;
  color:white;
}

.color-presets{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.color-preset{
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid #65707e;
}

/* ================= SEARCH ================= */

.search-row{
  display:flex;
  gap:7px;
}

.search-row input{
  flex:1;
  min-width:0;

  padding:11px;

  border-radius:11px;
  border:1px solid var(--line);

  background:var(--editor);
  color:var(--text);

  outline:none;
}

.search-result{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
}

/* ================= MIND MAP ================= */

.mind-preview,
.tree-preview{
  width:100%;
  padding:12px;
  overflow:auto;
  background:var(--editor);
  border:1px solid var(--line);
  border-radius:13px;
}

.mind-center,
.tree-center{
  width:max-content;
  max-width:90%;
  margin:auto;
  padding:9px 13px;
  border:1px solid #65707e;
  border-radius:10px;
  background:#1d232c;
  text-align:center;
  overflow-wrap:anywhere;
}

.branches{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  width:100%;
  margin-top:10px;
}

.branch{
  flex:0 1 auto;
  min-width:55px;
  max-width:180px;

  padding:8px 10px;

  border:1px solid #65707e;
  border-radius:9px;

  background:#171c23;

  text-align:center;
  overflow-wrap:anywhere;
}

.tree-preview{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.tree-line{
  width:2px;
  height:17px;
  background:#65707e;
}

/* ================= CONTEXT MENU ================= */

.context{
  position:fixed;
  z-index:300;

  display:none;
  gap:5px;

  padding:7px;

  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;

  box-shadow:0 12px 35px #0008;
}

.context.show{
  display:flex;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  z-index:500;

  left:50%;
  bottom:90px;

  transform:translateX(-50%);

  display:none;

  padding:9px 13px;

  border-radius:10px;

  background:#272d36;
  color:white;

  font-size:13px;
}

.toast.show{
  display:block;
}

mark{
  background:#e6c85a;
  color:#111;
  border-radius:2px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  header{
    height:55px;
  }

  .logo{
    font-size:16px;
  }

  .notes{
    padding-bottom:105px;
  }

  .note{
    border-radius:15px;
  }

  .editor{
    max-height:31dvh;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

<header>

  <button
    class="icon-btn"
    id="newBtn"
    title="جديد"
  >＋</button>

  <div class="logo">ملاحظاتي</div>

  <button
    class="icon-btn"
    id="searchBtn"
    title="بحث"
  >⌕</button>

</header>


<!-- ================= MAIN ================= -->

<main class="main">

<section
  class="notes"
  id="notes"
></section>


<!-- ================= COMPOSER ================= -->

<section class="composer">

<div class="toolbar">

<button class="tool" data-command="bold">B</button>

<button class="tool" data-command="italic">I</button>

<button class="tool" data-command="underline">U</button>

<button class="tool" id="fontBtn">A</button>

<button
  class="tool"
  data-command="insertUnorderedList"
>☷</button>

<button
  class="tool"
  id="alignBtn"
>≡</button>

<button
  class="tool"
  id="colorBtn"
>🎨</button>

<button
  class="tool"
  id="highlightBtn"
>🖍</button>

<button
  class="tool"
  id="tableBtn"
>▦</button>

<button
  class="tool"
  id="mindBtn"
>⌘</button>

<button
  class="tool"
  id="treeBtn"
>🌳</button>

</div>


<!-- FONT BAR -->

<div
  class="extra-bar"
  id="fontBar"
></div>


<!-- ALIGN BAR -->

<div
  class="extra-bar"
  id="alignBar"
>

<button data-align="right">◀</button>

<button data-align="center">≡</button>

<button data-align="left">▶</button>

<button data-align="justify">≋</button>

</div>


<div class="editor-row">

<div
  id="editor"
  class="editor"
  contenteditable="true"
  spellcheck="true"
></div>

<button

  id="saveBtn"
>➤</button>

</div>

</section>

</main>

</div>


<!-- =====================================================
     COLOR
===================================================== -->

<div
  class="overlay"
  id="colorOverlay"
>

<div class="sheet">

<div class="sheet-head">

<strong>🎨</strong>

<button
  class="close"
  data-close="colorOverlay"
>×</button>

</div>


<div class="color-box">

<div
  class="color-wheel"
  id="colorWheel"
>

<div
  class="color-marker"
  id="colorMarker"
></div>

</div>


<div class="special-colors">

<button
  class="special-color white"
  data-text-color="#ffffff"
>⚪</button>

<button
  class="special-color black"
  data-text-color="#000000"
>⚫</button>

</div>


<div
  class="color-presets"
  id="textPresets"
></div>

</div>

</div>

</div>


<!-- =====================================================
     HIGHLIGHT
===================================================== -->

<div
  class="overlay"
  id="highlightOverlay"
>

<div class="sheet">

<div class="sheet-head">

<strong>🖍</strong>

<button
  class="close"
  data-close="highlightOverlay"
>×</button>

</div>


<div
  class="color-presets"
  id="highlightPresets"
></div>


<div

  display:flex;
  justify-content:center;
  margin-top:14px;
  "
>

<button
  class="icon-btn"

<!-- =====================================================
     TABLE
===================================================== -->

<div

>

  data-counter="cols"

<div class="counter">

<button
  data-counter="mind"
  data-delta="-1"
>−</button>

<!-- =====================================================

>

<strong>🌳</strong>

<button
  class="close"
  data-close="treeOverlay"

</div>

<div class="counter">

<button

>−</button>

>

<div class="sheet-head">

  data-close="searchOverlay"

  type="search"

<!-- =====================================================
     CONTEXT
===================================================== -->

  class="context"
  id="contextMenu"
>

  class="mini"
  id="editNote"
>✎</button>

<button
  class="mini"
  id="deleteNote"
>🗑</button>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

"use strict";


/* =====================================================
   CONFIG
===================================================== */

const STORAGE_KEY =
  "notes_clean_editor_v1";

const FONT_SIZES = [
  8,9,10,11,12,
  14,16,18,20,22,
  24,26,28,32,
  36,40,48,56,
  64,72
];


/* =====================================================
   STATE
===================================================== */

const state = {

  notes: loadNotes(),

  editingId: null,

  selectedId: null,

  rows: 2,

  cols: 2,

  mind: 3,

  tree: 3,

  fontSize: 8,

  savedRange: null,

  textColor: "#ffffff",

  highlightColor: "#fff59d"

};


/* =====================================================
   DOM
===================================================== */

const editor =
  document.getElementById("editor");

const notes =
  document.getElementById("notes");

const toast =
  document.getElementById("toast");


/* =====================================================
   STORAGE
===================================================== */

function loadNotes(){

  try{

    const data =
      localStorage.getItem(STORAGE_KEY);

    return data ? JSON.parse(data) : [];

  }catch(error){

    return [];

  }

}


function saveStorage(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state.notes)
  );

}


/* =====================================================
   TOAST
===================================================== */

function showToast(symbol){

  toast.textContent = symbol;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(
      ()=>{
        toast.classList.remove("show");
      },
      1200
    );

}


/* =====================================================
   OVERLAY
===================================================== */

function openOverlay(id){

  document
    .getElementById(id)
    .classList.add("show");

}


function closeOverlay(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


document
  .querySelectorAll(".close")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{
        closeOverlay(
          button.dataset.close
        );
      }
    );

  });


document
  .querySelectorAll(".overlay")
  .forEach(overlay=>{

    overlay.addEventListener(
      "click",
      event=>{

        if(event.target === overlay){

          overlay.classList.remove("show");

        }

      }
    );

  });


/* =====================================================
   SELECTION
===================================================== */

function saveSelection(){

  const selection =
    window.getSelection();

  if(
    selection &&
    selection.rangeCount
  ){

    state.savedRange =
      selection
        .getRangeAt(0)
        .cloneRange();

  }

}


function restoreSelection(){

  if(!state.savedRange)
    return;

  const selection =
    window.getSelection();

  selection.removeAllRanges();

  selection.addRange(
    state.savedRange
  );

}


/* =====================================================
   COMMAND
===================================================== */

function command(
  name,
  value=null
){

  editor.focus();

  restoreSelection();

  document.execCommand(
    name,
    false,
    value
  );

  saveSelection();

  updateButtons();

}


/* =====================================================
   TOGGLE BUTTONS
===================================================== */

function updateButtons(){

  document
    .querySelectorAll(
      "[data-command]"
    )
    .forEach(button=>{

      try{

        button.classList.toggle(
          "active",
          document.queryCommandState(
            button.dataset.command
          )
        );

      }catch(error){}

    });

}


/* =====================================================
   BASIC TOOLS
===================================================== */

document
  .querySelectorAll("[data-command]")
  .forEach(button=>{

    button.addEventListener(
      "mousedown",
      event=>{
        event.preventDefault();
      }
    );

    button.addEventListener(
      "click",
      ()=>{

        command(
          button.dataset.command
        );

      }
    );

  });


/* =====================================================
   FONT SIZE
===================================================== */

const fontBar =
  document.getElementById("fontBar");


FONT_SIZES.forEach(size=>{

  const button =
    document.createElement("button");

  button.textContent = size;

  button.addEventListener(
    "mousedown",
    event=>{
      event.preventDefault();
    }
  );

  button.addEventListener(
    "click",
    ()=>{

      restoreSelection();

      document.execCommand(
        "fontSize",
        false,
        "7"
      );

      document
        .querySelectorAll(
          'font[size="7"]'
        )
        .forEach(font=>{

          font.removeAttribute("size");

          font.style.fontSize =
            size + "px";

        });

      state.fontSize = size;

      saveSelection();

    }
  );

  fontBar.appendChild(button);

});


document
  .getElementById("fontBtn")
  .addEventListener(
    "click",
    ()=>{
      fontBar.classList.toggle("show");
    }
  );


/* =====================================================
   ALIGNMENT
===================================================== */

document
  .getElementById("alignBtn")
  .addEventListener(
    "click",
    ()=>{
      document
        .getElementById("alignBar")
        .classList.toggle("show");
    }

/* =====================================================
   COLOR WHEEL
===================================================== */

const wheel =
  document.getElementById(
    "colorWheel"
  );

const marker =
  document.getElementById(
    "colorMarker"
  );


function hueToColor(hue){

  const h = hue / 60;

  const x =
    1 -
    Math.abs(
      (h % 2) - 1
    );

  let r=0;
  let g=0;
  let b=0;

  if(h < 1){

    r=1;
    g=x;

  }else if(h < 2){

    r=x;
    g=1;

  }else if(h < 3){

    g=1;
    b=x;

  }else if(h < 4){

    g=x;
    b=1;

  }else if(h < 5){

    r=x;
    b=1;

  }else{

    r=1;
    b=x;

  }

  return "#"+
    [
      r,g,b
    ]
      .map(
        value=>
          Math.round(
            value*255
          )
          .toString(16)
          .padStart(2,"0")
      )
      .join("");

}


function selectWheel(event){

  const rect =
    wheel.getBoundingClientRect();

  let x =
    event.clientX -
    rect.left -
    rect.width/2;

  let y =
    event.clientY -
    rect.top -
    rect.height/2;

  const radius =
    rect.width/2;

  const distance =
    Math.sqrt(
      x*x+y*y
    );

  if(distance > radius){

    x =
      x / distance * radius;

    y =
      y / distance * radius;

  }

  const angle =
    Math.atan2(
      y,
      x
    );

  let degrees =
    angle * 180 / Math.PI +
    90;

  if(degrees < 0)
    degrees += 360;

  const px =
    x + rect.width/2;

  const py =
    y + rect.height/2;

  marker.style.left =
    px + "px";

  marker.style.top =
    py + "px";

  const color =
    hueToColor(degrees);

  state.textColor =
    color;

  command(
    "foreColor",
    color
  );

}


wheel.addEventListener(
  "pointerdown",
  event=>{

    event.preventDefault();

    wheel.setPointerCapture(
      event.pointerId
    );

    selectWheel(event);

  }
);


wheel.addEventListener(
  "pointermove",
  event=>{

    if(event.buttons){

      selectWheel(event);

    }

  }
);

===================================================== */

document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    saveNote
  );


function saveNote(){

  const html =
    editor.innerHTML.trim();

  if(!html){

    showToast("✕");

    return;

  }

  const now =
    Date.now();

  if(state.editingId){

    const note =
      state.notes.find(
        item =>
          item.id ===
          state.editingId
      );

    if(note){

      note.html =
        html;

      note.updated =
        now;

    }

  }else{

    state.notes.unshift({

      id:
        (
          crypto.randomUUID ?
          crypto.randomUUID() :
          String(now)+Math.random()
        ),

      html:
        html,

      updated:
        now

    });

  }

  saveStorage();

  renderNotes();

  editor.innerHTML =
    "";

  state.editingId =
    null;

  showToast("✓");

}

/* =====================================================
   RENDER NOTES
===================================================== */

function renderNotes(
  search=""
){

  notes.innerHTML =
    "";

  let list =
    state.notes;

  if(search){

    const q =
      search.toLowerCase();

    list =
      list.filter(
        note =>
          stripHTML(
            note.html
          )
          .toLowerCase()
          .includes(q)
      );

  }

  if(!list.length){

    notes.innerHTML =
      '<div class="empty">＋</div>';

    return;

  }

  list.forEach(note=>{

    const article =
      document.createElement(
        "article"
      );

    article.className =
      "note";

    article.dataset.id =
      note.id;

    const date =
      new Date(
        note.updated
      )
      .toLocaleString(
        "ar-EG",
        {
          dateStyle:"short",
          timeStyle:"short"
        }
      );

    article.innerHTML = `

      <div class="note-head">

        <span class="note-time">
          ${date}
        </span>

        <div class="note-actions">

          <button
            class="mini menu"
          >⋮</button>

        </div>

      </div>

      <div class="note-content">
        ${note.html}
      </div>

    `;

    notes.appendChild(
      article
    );

  });

}


function stripHTML(html){

  const div =
    document.createElement(
      "div"
    );

  div.innerHTML =
    html;

  return div.textContent ||
    "";

}

    contextMenu.style.top =
      Math.min(
        window.innerHeight-55,
        rect.bottom+5

    contextMenu.style.right =
      Math.max(
        8,
        window.innerWidth-
        rect.right
      ) + "px";

    contextMenu.classList.add(
      "show"
    );

  }
);

function searchNotes(){

  const input =
    document.getElementById(
      "searchInput"
    );

  const result =
    document.getElementById(
      "searchResult"
    );

  const query =
    input.value.trim();

  if(!query){

    result.textContent =
      "";

    renderNotes();

    return;

  }

  const q =
    query.toLowerCase();

  const found =
    state.notes.filter(
      note =>
        stripHTML(
          note.html
        )
        .toLowerCase()
        .includes(q)
    );

  result.textContent =
    found.length;

  renderNotes(
    query
  );

}
