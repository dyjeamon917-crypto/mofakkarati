<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover"
>

<meta name="theme-color" content="#10131a">

<title>ملاحظاتي</title>

<style>

/* =========================================================
   1. RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

html{
    color-scheme:dark;
}

body{
    overflow:hidden;
    background:#0f1117;
    color:#f5f7fb;
    font-family:
        Arial,
        "Segoe UI",
        Tahoma,
        sans-serif;

    -webkit-text-size-adjust:100%;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    touch-action:manipulation;
}

button:disabled{
    opacity:.45;
    cursor:default;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
[contenteditable="true"]:focus-visible{
    outline:2px solid #6d9dff;
    outline-offset:2px;
}


/* =========================================================
   2. APP
========================================================= */

.app{
    width:100%;
    height:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(64,100,170,.12),
            transparent 45%
        ),
        #10131a;
}


/* =========================================================
   3. HEADER
========================================================= */

.header{
    flex:0 0 58px;
    height:58px;

    display:flex;
    align-items:center;

    gap:8px;
    padding:7px 10px;

    background:rgba(25,29,38,.96);

    border-bottom:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 2px 12px rgba(0,0,0,.15);

    position:relative;
    z-index:20;
}

.title{
    flex:1;

    text-align:center;

    font-size:18px;
    font-weight:800;

    letter-spacing:.2px;
}

.icon{
    width:42px;
    height:42px;
    flex:0 0 42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#292e39;
    color:#fff;

    font-size:20px;

    transition:
        transform .15s ease,
        background .15s ease;
}

.icon:hover{
    background:#343b49;
}

.icon:active{
    transform:scale(.93);
}


/* =========================================================
   4. NOTES AREA
========================================================= */

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:
        12px
        10px
        14px;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior-y:contain;

    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:5px;
}

.messages::-webkit-scrollbar-thumb{
    background:#3a404c;
    border-radius:10px;
}

.empty{
    margin-top:30vh;

    text-align:center;

    color:#707783;

    font-size:14px;
}


/* =========================================================
   5. NOTE
========================================================= */

.note{
    position:relative;

    margin-bottom:10px;
    padding:12px 14px;

    border:
        1px solid rgba(255,255,255,.055);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #222731,
            #1e222b
        );

    box-shadow:
        0 4px 18px rgba(0,0,0,.12);

    line-height:1.75;

    overflow-wrap:anywhere;
    word-break:break-word;

    animation:
        noteIn .18s ease;
}

@keyframes noteIn{
    from{
        opacity:0;
        transform:translateY(4px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.note-content{
    min-width:0;

    overflow-wrap:anywhere;
    word-break:break-word;
}

.note:after{
    content:"";
    display:block;
    clear:both;
}

.note img{
    display:block;

    max-width:100%;
    height:auto;

    margin:6px 0;

    border-radius:8px;
}

.note-menu{
    float:left;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:
        -3px
        -5px
        2px
        7px;

    border-radius:50%;

    background:transparent;
    color:#aab0bb;

    font-size:21px;

    transition:
        background .15s ease,
        transform .15s ease;
}

.note-menu:hover{
    background:#303642;
}

.note-menu:active{
    transform:scale(.92);
}


/* =========================================================
   6. NOTE CONTENT
========================================================= */

.note ul,
.note ol{
    margin:7px 0;

    padding-right:27px;
}

.note table{
    display:block;

    width:max-content;
    max-width:100%;

    overflow-x:auto;

    margin:10px 0;

    border-collapse:collapse;

    scrollbar-width:thin;
}

.note td,
.note th{
    min-width:48px;
    min-height:35px;

    padding:7px 9px;

    border:
        1px solid #687080;

    vertical-align:top;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
    word-break:break-word;

    line-height:1.55;
}

.note .mind-map{
    width:100%;
}


/* =========================================================
   7. EDITOR AREA
========================================================= */

.editor-area{
    flex-shrink:0;

    padding:
        5px
        8px
        calc(8px + env(safe-area-inset-bottom));

    background:rgba(25,29,38,.98);

    border-top:
        1px solid rgba(255,255,255,.08);

    box-shadow:
        0 -4px 20px rgba(0,0,0,.12);

    position:relative;
    z-index:30;
}

.edit-state{
    height:27px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    color:#9299a5;

    font-size:12px;
}

.cancel{
    width:34px;
    height:27px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:transparent;
    color:#9da4af;

    font-size:21px;

    border-radius:7px;
}

.cancel:hover{
    background:#292e39;
}


/* =========================================================
   8. TOOLBAR
========================================================= */

.toolbar{
    display:flex;

    gap:5px;

    padding:
        3px
        0
        7px;

    overflow-x:auto;

    scrollbar-width:none;

    overscroll-behavior-x:contain;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    width:40px;
    height:40px;

    flex:0 0 40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        1px solid #444b58;

    border-radius:11px;

    background:#292e39;
    color:#fff;

    font-size:17px;

    transition:
        background .15s ease,
        border-color .15s ease,
        transform .12s ease;
}

.tool:hover{
    background:#323845;
}

.tool:active{
    transform:scale(.94);
}

.tool.active{
    background:#315fae;

    border-color:#6b9bf0;

    box-shadow:
        0 0 0 2px
        rgba(67,122,230,.18);
}

.bold{
    font-weight:900;
}

.underline{
    text-decoration:underline;
    text-decoration-thickness:2px;
    text-underline-offset:5px;
}


/* =========================================================
   9. SUB TOOLBARS
========================================================= */

.sub-toolbar{
    display:none;

    align-items:center;

    gap:5px;

    padding:
        2px
        0
        7px;

    overflow-x:auto;

    scrollbar-width:none;
}

.sub-toolbar::-webkit-scrollbar{
    display:none;
}

.font-size-bar{
    direction:ltr;
}

.list-bar{
    direction:rtl;
}

.alignment-bar{
    direction:rtl;
}

.font-size-item,
.align-item{
    flex:0 0 auto;

    height:34px;

    border:
        1px solid #444b58;

    border-radius:9px;

    background:#292e39;
    color:#fff;
}

.font-size-item{
    width:36px;

    font-size:13px;
}

.align-item{
    width:38px;

    font-size:17px;
}

.font-size-item:hover,
.align-item:hover{
    background:#333a47;
}

.font-size-item.active,
.align-item.active{
    background:#315fae;
    border-color:#6b9bf0;
}


/* =========================================================
   10. WRITE ROW
========================================================= */

.write-row{
    display:flex;
    align-items:flex-end;

    gap:7px;
}

.editor{
    flex:1;
    min-width:0;

    min-height:49px;
    max-height:175px;

    overflow-y:auto;

    padding:9px 11px;

    border:
        1px solid #484f5c;

    border-radius:13px;

    background:#0c0f14;
    color:#fff;

    line-height:1.7;

    direction:rtl;
    text-align:right;

    overflow-wrap:anywhere;
    word-break:break-word;

    white-space:pre-wrap;

    caret-color:#fff;

    user-select:text;
    -webkit-user-select:text;

    overscroll-behavior:contain;

    -webkit-overflow-scrolling:touch;

    transition:
        border-color .15s ease,
        box-shadow .15s ease;
}

.editor:focus{
    border-color:#4d7fd8;

    box-shadow:
        0 0 0 2px
        rgba(66,120,220,.12);
}

.editor:empty:before{
    content:"اكتبي ملاحظتك هنا...";
    color:#606774;
}

.editor img{
    max-width:100%;
    height:auto;
}

.editor ul,
.editor ol{
    margin:7px 0;
    padding-right:27px;
}

.editor table{
    width:max-content;
    max-width:100%;

    border-collapse:collapse;

    margin:8px 0;
}

.editor td,
.editor th{
    min-width:48px;
    min-height:35px;

    padding:7px 9px;

    border:
        1px solid #687080;

    vertical-align:top;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
    word-break:break-word;

    direction:rtl;
    text-align:right;

    line-height:1.55;
}

.editor td:focus,
.editor th:focus{
    outline:
        1px solid #3471f6;

    outline-offset:-1px;
}


/* =========================================================
   11. SEND
========================================================= */

.send{
    width:48px;
    height:48px;

    flex:0 0 48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #4280fa,
            #2c65d8
        );

    color:#fff;

    font-size:21px;

    box-shadow:
        0 5px 15px
        rgba(40,91,190,.25);

    transition:
        transform .15s ease,
        filter .15s ease;
}

.send:hover{
    filter:brightness(1.08);
}

.send:active{
    transform:scale(.92);
}


/* =========================================================
   12. OVERLAY
========================================================= */

.overlay{
    display:none;

    position:fixed;
    inset:0;

    z-index:500;

    align-items:center;
    justify-content:center;

    padding:14px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:
        blur(4px);

    -webkit-backdrop-filter:
        blur(4px);

    overscroll-behavior:contain;
}

.panel{
    width:min(94vw,360px);
    max-height:90vh;

    overflow:auto;

    padding:16px;

    border:
        1px solid #454c59;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #222731,
            #1d2129
        );

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55);

    overscroll-behavior:contain;

    animation:
        panelIn .18s ease;
}

@keyframes panelIn{
    from{
        opacity:0;
        transform:scale(.96) translateY(5px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.panel-title{
    text-align:center;

    font-size:16px;
    font-weight:800;

    margin-bottom:13px;
}


/* =========================================================
   13. PANEL BUTTON
========================================================= */

.panel-button{
    width:100%;
    min-height:43px;

    margin-top:10px;

    border-radius:11px;

    background:#303642;
    color:#fff;

    transition:
        background .15s ease,
        transform .12s ease;
}

.panel-button:hover{
    background:#383f4c;
}

.panel-button:active{
    transform:scale(.98);
}


/* =========================================================
   14. COLOR PICKER
========================================================= */

.color-picker{
    width:270px;
    max-width:78vw;

    margin:
        10px
        auto
        15px;
}

.color-wheel{
    position:relative;

    width:250px;
    height:250px;

    max-width:72vw;
    max-height:72vw;

    margin:auto;

    border-radius:50%;

    overflow:hidden;

    touch-action:none;
}

.hue-ring{
    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        conic-gradient(
            #ff0000,
            #ffff00,
            #00ff00,
            #00ffff,
            #0000ff,
            #ff00ff,
            #ff0000
        );
}

.sv-area{
    position:absolute;

    inset:13%;

    border-radius:50%;

    overflow:hidden;

    background:
        hsl(
            var(--hue),
            100%,
            50%
        );
}

.sv-white{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to right,
            #fff,
            rgba(255,255,255,0)
        );
}

.sv-black{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0),
            #000
        );
}

.color-marker,
.hue-marker{
    position:absolute;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    border-radius:50%;
}

.color-marker{
    width:21px;
    height:21px;

    border:
        3px solid #fff;

    box-shadow:
        0 0 0 2px #000,
        0 0 5px #000;

    z-index:10;
}

.hue-marker{
    width:19px;
    height:19px;

    border:
        3px solid #fff;

    box-shadow:
        0 0 0 2px #000;

    z-index:11;
}

.color-presets{
    display:flex;
    justify-content:center;

    gap:9px;

    margin-top:10px;
}

.color-preset{
    width:37px;
    height:37px;

    border:
        2px solid #6a7180;

    border-radius:50%;
}

.black-preset{
    background:#000;
}

.white-preset{
    background:#fff;
}


/* =========================================================
   15. RANGE
========================================================= */

.range-title{
    text-align:center;

    margin-bottom:5px;

    color:#c8cdd6;

    font-size:13px;
}

.range{
    width:100%;

    accent-color:#4c80ff;
}


/* =========================================================
   16. HIGHLIGHT ACTIONS
========================================================= */

.highlight-actions{
    display:flex;

    gap:7px;
}

.highlight-actions .panel-button{
    flex:1;
}


/* =========================================================
   17. CHOICES
========================================================= */

.list-choice{
    display:flex;
    gap:7px;
}

.list-choice button{
    flex:1;

    min-height:47px;

    border:
        1px solid #454c59;

    border-radius:11px;

    background:#292f3a;
    color:#fff;
}

.list-choice button:hover{
    background:#333a47;
}


/* =========================================================
   18. MIND MAP
========================================================= */

.mind-map{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:12px;

    margin:10px 0;
}

.mind-center{
    width:fit-content;
    max-width:90%;

    padding:9px 15px;

    border:
        1px solid #5579bd;

    border-radius:12px;

    background:#263657;

    text-align:center;

    line-height:1.6;

    overflow-wrap:anywhere;
    word-break:break-word;

    white-space:pre-wrap;
}

.mind-branches{
    width:100%;

    display:flex;
    flex-wrap:wrap;

    justify-content:center;

    gap:9px;
}

.mind-branch{
    width:auto;

    max-width:45%;
    min-width:80px;

    padding:8px 10px;

    border:
        1px solid #555d6d;

    border-radius:10px;

    background:#292e39;

    text-align:center;

    line-height:1.6;

    overflow-wrap:anywhere;
    word-break:break-word;

    white-space:pre-wrap;
}

.mind-input{
    width:100%;

    min-height:43px;
    max-height:130px;

    padding:8px 10px;

    margin-bottom:7px;

    border:
        1px solid #464d5a;

    border-radius:10px;

    background:#0d1015;
    color:#fff;

    outline:none;

    font-size:16px;
    line-height:1.6;

    direction:rtl;
    text-align:right;

    resize:vertical;

    overflow-y:auto;
}

.mind-input:focus{
    border-color:#3471f6;
}


/* =========================================================
   19. SEARCH
========================================================= */

.search-input{
    width:100%;
    height:46px;

    padding:8px 11px;

    border:
        1px solid #464d5a;

    border-radius:11px;

    background:#0d1015;
    color:#fff;

    outline:none;

    font-size:16px;
}

.search-input:focus{
    border-color:#3471f6;
}

.search-result{
    min-height:20px;

    margin-top:10px;

    color:#aab0ba;

    text-align:center;

    font-size:13px;
}

.search-highlight{
    outline:
        2px solid #3471f6;

    outline-offset:2px;
}

.search-word{
    padding:0 2px;

    border-radius:3px;

    background:
        rgba(255,214,0,.45);
}


/* =========================================================
   20. MESSAGE MENU
========================================================= */

.menu{
    display:none;

    position:fixed;

    z-index:1000;

    min-width:145px;

    padding:5px;

    border:
        1px solid #454c59;

    border-radius:12px;

    background:#20242d;

    box-shadow:
        0 12px 40px
        rgba(0,0,0,.55);

    animation:
        menuIn .12s ease;
}

@keyframes menuIn{
    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.menu button{
    display:block;

    width:100%;
    min-height:42px;

    padding:0 10px;

    border-radius:8px;

    background:transparent;
    color:#fff;

    text-align:right;
}

.menu button:hover{
    background:#2d333e;
}


/* =========================================================
   21. RESPONSIVE
========================================================= */

@media(max-width:420px){

    .header{
        height:55px;
        flex-basis:55px;
    }

    .icon{
        width:40px;
        height:40px;
        flex-basis:40px;
    }

    .messages{
        padding:
            9px
            8px
            12px;
    }

    .note{
        padding:11px 12px;
        border-radius:14px;
    }

    .color-wheel{
        width:220px;
        height:220px;
    }

    .mind-branch{
        min-width:70px;
        max-width:46%;
    }

    .editor{
        max-height:155px;
    }

    .tool{
        width:38px;
        height:38px;
        flex-basis:38px;
    }

    .send{
        width:46px;
        height:46px;
        flex-basis:46px;
    }
}

@media(max-height:650px){

    .panel{
        max-height:93vh;
    }

    .editor{
        max-height:125px;
    }

    .messages{
        padding-top:7px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
        transition-duration:.001ms !important;
    }
}

</style>
</head>


<body>

<div class="app">

<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <button
        class="icon"
        id="searchButton"
        type="button"
        aria-label="بحث"
        title="بحث"
    >⌕</button>

    <div class="title">
        ملاحظاتي
    </div>

    <button
        class="icon"
        id="newButton"
        type="button"
        aria-label="ملاحظة جديدة"
        title="ملاحظة جديدة"
    >＋</button>

</header>


<!-- =======================================================
     NOTES
======================================================= -->

<main
    class="messages"
    id="messages"
></main>


<!-- =======================================================
     EDITOR
======================================================= -->

<section class="editor-area">

    <div class="edit-state">

        <span id="state">
            رسالة جديدة
        </span>

        <button
            class="cancel"
            id="cancelButton"
            type="button"
            aria-label="إلغاء"
            title="إلغاء"
        >×</button>

    </div>


    <!-- أدوات التنسيق -->

    <div
        class="toolbar"
        id="mainToolbar"
    >

        <button
            class="tool bold"
            id="boldButton"
            type="button"
            title="عريض"
        >B</button>

        <button
            class="tool"
            id="italicButton"
            type="button"
            title="مائل"
        ><i>I</i></button>

        <button
            class="tool underline"
            id="underlineButton"
            type="button"
            title="تحته خط"
        >U</button>

        <button
            class="tool"
            id="colorButton"
            type="button"
            title="لون الخط"
        >●</button>

        <button
            class="tool"
            id="highlightButton"
            type="button"
            title="تمييز النص"
        >▰</button>

        <button
            class="tool"
            id="sizeButton"
            type="button"
            title="حجم الخط"
        >A↕</button>

        <button
            class="tool"
            id="listButton"
            type="button"
            title="القوائم"
        >☷</button>

        <button
            class="tool"
            id="alignmentButton"
            type="button"
            title="المحاذاة"
        >☰</button>

        <button
            class="tool"
            id="tableButton"

<script>
"use strict";

/* =========================================================
   1. CONFIGURATION
========================================================= */

const STORAGE_KEY =
    "notes_modern_editor_v6";


/* =========================================================
   2. STATE
========================================================= */

const AppState = {

    notes: [],

    editingIndex: -1,

    selectedIndex: -1,

    savedRange: null,

    fontSize: 16,

    alignment: "right",

    tableRows: 3,

    tableCols: 3,

    textColor: "rgb(255,255,255)",

    highlightColor: "rgb(255,255,0)",

    highlightOpacity: .60

};


/* =========================================================
   3. DOM
========================================================= */

const $ = id =>
    document.getElementById(id);


const editor =
    $("editor");

const messages =
    $("messages");

const state =
    $("state");

const messageMenu =
    $("messageMenu");

const fontSizeBar =
    $("fontSizeBar");

const listBar =
    $("listBar");

const alignmentBar =
    $("alignmentBar");


const colorOverlay =
    $("colorOverlay");

const highlightOverlay =
    $("highlightOverlay");

const tableOverlay =
    $("tableOverlay");

const mindMapOverlay =
    $("mindMapOverlay");

const searchOverlay =
    $("searchOverlay");


/* =========================================================
   4. STORAGE
========================================================= */

function loadNotes(){

    try{

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if(!raw){

            AppState.notes = [];
            return;
        }

        const data =
            JSON.parse(raw);

        if(!Array.isArray(data)){

            AppState.notes = [];
            return;
        }

        AppState.notes =
            data.filter(note => {

                return (
                    note &&
                    typeof note === "object" &&
                    typeof note.html === "string"
                );

            });

    }catch(error){

        console.error(
            "خطأ في تحميل الملاحظات:",
            error
        );

        AppState.notes = [];
    }
}


function saveNotes(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                AppState.notes
            )
        );

        return true;

    }catch(error){

        console.error(
            "خطأ في حفظ الملاحظات:",
            error
        );

        return false;
    }
}


/* =========================================================
   5. HTML UTILITIES
========================================================= */

function cleanHtml(html){

    return String(html || "")
        .replace(/\u200B/g,"")
        .replace(/\uFEFF/g,"")
        .trim();
}


function hasRealContent(){

    const clone =
        editor.cloneNode(true);

    clone
        .querySelectorAll("br")
        .forEach(br => {
            br.replaceWith(" ");
        });

    const text =
        (clone.textContent || "")
        .replace(/\u200B/g,"")
        .replace(/\uFEFF/g,"")
        .replace(/\u00a0/g," ")
        .trim();

    return Boolean(
        text ||
        clone.querySelector("table") ||
        clone.querySelector(".mind-map") ||
        clone.querySelector("img")
    );
}


/* =========================================================
   6. RENDER NOTES
========================================================= */

function renderNotes(){

    clearSearchHighlights();

    messages.innerHTML = "";

    if(AppState.notes.length === 0){

        messages.innerHTML =
            `<div class="empty">
                لا توجد ملاحظات بعد
            </div>`;

        return;
    }


    AppState.notes.forEach(
        (note,index) => {

            const box =
                document.createElement("article");

            box.className =
                "note";


            const menuButton =
                document.createElement("button");

            menuButton.className =
                "note-menu";

            menuButton.type =
                "button";

            menuButton.textContent =
                "⋮";

            menuButton.setAttribute(
                "aria-label",
                "خيارات الملاحظة"
            );


            menuButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    AppState.selectedIndex =
                        index;

                    openMessageMenu(
                        event.clientX,
                        event.clientY
                    );
                }
            );


            const content =
                document.createElement("div");

            content.className =
                "note-content";

            content.innerHTML =
                note.html || "";


            box.appendChild(menuButton);
            box.appendChild(content);

            messages.appendChild(box);
        }
    );
}


/* =========================================================
   7. MESSAGE MENU
========================================================= */

function openMessageMenu(x,y){

    messageMenu.style.display =
        "block";


    const width =
        messageMenu.offsetWidth || 145;

    const height =
        messageMenu.offsetHeight || 95;


    let left =
        x - width;

    let top =
        y;


    left =
        Math.max(
            5,
            Math.min(
                left,
                window.innerWidth -
                width -
                5
            )
        );


    top =
        Math.max(
            5,
            Math.min(
                top,
                window.innerHeight -
                height -
                5
            )
        );


    messageMenu.style.left =
        `${left}px`;

    messageMenu.style.top =
        `${top}px`;
}


document.addEventListener(
    "click",
    event => {

        if(
            !event.target.closest(".menu") &&
            !event.target.closest(".note-menu")
        ){

            messageMenu.style.display =
                "none";
        }
    }
);


/* =========================================================
   8. SELECTION
========================================================= */

function nodeInsideEditor(node){

    return Boolean(
        node &&
        (
            node === editor ||
            editor.contains(node)
        )
    );
}


function rangeInsideEditor(range){

    return Boolean(
        range &&
        nodeInsideEditor(
            range.startContainer
        ) &&
        nodeInsideEditor(
            range.endContainer
        )
    );
}


function saveSelection(){

    const selection =
        window.getSelection();

    if(
        !selection ||
        !selection.rangeCount
    ){

        return false;
    }


    const range =
        selection.getRangeAt(0);


    if(!rangeInsideEditor(range)){

        return false;
    }


    AppState.savedRange =
        range.cloneRange();

    return true;
}


function restoreSelection(){

    const range =
        AppState.savedRange;


    if(!range){
        return false;
    }


    if(!rangeInsideEditor(range)){

        AppState.savedRange =
            null;

        return false;
    }


    try{

        const selection =
            window.getSelection();

        selection.removeAllRanges();

        selection.addRange(
            range
        );

        return true;

    }catch(error){

        AppState.savedRange =
            null;

        return false;
    }
}


function focusEditorEnd(){

    editor.focus();

    const range =
        document.createRange();

    range.selectNodeContents(
        editor
    );

    range.collapse(false);


    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
        range
    );


    AppState.savedRange =
        range.cloneRange();
}


/* =========================================================
   9. TOOLBAR STATE
========================================================= */

function hideSubToolbars(){

    fontSizeBar.style.display =
        "none";

    listBar.style.display =
        "none";

    alignmentBar.style.display =
        "none";
}


function selectionElement(){

    const selection =
        window.getSelection();

    if(
        !selection ||
        !selection.rangeCount
    ){

        return null;
    }


    let node =
        selection.anchorNode;


    if(
        node &&
        node.nodeType === Node.TEXT_NODE
    ){

        node =
            node.parentElement;
    }


    if(
        !node ||
        !nodeInsideEditor(node)
    ){

        return null;
    }


    return node;
}


/* =========================================================
   10. DETECT FONT SIZE
========================================================= */

function detectFontSize(){

    const element =
        selectionElement();

    if(!element){
        return AppState.fontSize;
    }


    let node =
        element;


    while(
        node &&
        node !== editor
    ){

        const size =
            parseFloat(
                getComputedStyle(node).fontSize
            );


        if(
            Number.isFinite(size) &&
            size > 0
        ){

            AppState.fontSize =
                Math.round(size);

            return AppState.fontSize;
        }


        node =
            node.parentElement;
    }


    return AppState.fontSize;
}


/* =========================================================
   11. DETECT ALIGNMENT
========================================================= */

function detectAlignment(){

    const element =
        selectionElement();

    if(!element){
        return AppState.alignment;
    }


    let node =
        element;


    while(
        node &&
        node !== editor
    ){

        const align =
            getComputedStyle(node).textAlign;


        if(
            ["right","center","left"]
                .includes(align)
        ){

            AppState.alignment =
                align;

            return align;
        }


        node =
            node.parentElement;
    }


    return AppState.alignment;
}


/* =========================================================
   12. UPDATE TOOLBAR
========================================================= */

function updateToolbar(){

    try{

        $("boldButton").classList.toggle(
            "active",
            document.queryCommandState("bold")
        );

        $("italicButton").classList.toggle(
            "active",
            document.queryCommandState("italic")
        );

        $("underlineButton").classList.toggle(
            "active",
            document.queryCommandState("underline")
        );

    }catch(error){}


    detectFontSize();
    detectAlignment();

    updateFontSizeButtons();
    updateAlignmentButtons();
}


/* =========================================================
   13. EXECUTE COMMAND
========================================================= */

function exec(command,value=null){

    if(!restoreSelection()){
        focusEditorEnd();
    }


    try{

        document.execCommand(
            command,
            false,
            value
        );

    }catch(error){

        console.error(
            "فشل الأمر:",
            command,
            error
        );
    }


    saveSelection();

    updateToolbar();
}


/* =========================================================
   14. TOOLBAR SELECTION PROTECTION
========================================================= */

const toolbarButtons = [

    "boldButton",
    "italicButton",
    "underlineButton",
    "colorButton",
    "highlightButton",
    "sizeButton",
    "listButton",
    "alignmentButton",
    "tableButton",
    "mindMapButton"

];


toolbarButtons.forEach(id => {

    const button =
        $(id);

    if(!button){
        return;
    }


    button.addEventListener(
        "pointerdown",
        event => {

            if(event.pointerType !== "mouse"){
                event.preventDefault();
            }

            saveSelection();
        }
    );


    button.addEventListener(
        "mousedown",
        event => {

            event.preventDefault();

            saveSelection();
        }
    );
});


/* =========================================================
   15. BASIC FORMATTING
========================================================= */

$("boldButton").onclick =
    () => {

        exec("bold");
        editor.focus();

    };


$("italicButton").onclick =
    () => {

        exec("italic");
        editor.focus();

    };


$("underlineButton").onclick =
    () => {

        exec("underline");
        editor.focus();

    };


/* =========================================================
   16. ENTER
========================================================= */

editor.addEventListener(
    "keydown",
    event => {

        if(event.key !== "Enter"){
            return;
        }


        if(
            event.target.closest &&
            event.target.closest("td,th")
        ){

            return;
        }


        event.preventDefault();


        const selection =
            window.getSelection();

        if(
            !selection ||
            !selection.rangeCount
        ){

            return;
        }


        const range =
            selection.getRangeAt(0);


        if(!rangeInsideEditor(range)){
            return;
        }


        if(!range.collapsed){
            range.deleteContents();
        }


        const br =
            document.createElement("br");


        const marker =
            document.createTextNode(
                "\u200B"
            );


        range.insertNode(br);


        br.parentNode.insertBefore(
            marker,
            br.nextSibling
        );


        const newRange =
            document.createRange();


        newRange.setStart(
            marker,
            marker.length
        );


        newRange.collapse(true);


        selection.removeAllRanges();

        selection.addRange(
            newRange
        );


        AppState.savedRange =
            newRange.cloneRange();


        updateToolbar();
    }
);


/* =========================================================
   17. SELECTION EVENTS
========================================================= */

function updateSelection(){

    setTimeout(
        () => {

            saveSelection();
            updateToolbar();

        },
        0
    );
}


editor.addEventListener(

);

editor.addEventListener(
    "keyup",

        );

    }

editor.addEventListener(

        );

    }

document.addEventListener(
    "selectionchange",
    () => {

        const selection =
            window.getSelection();

        if(
            !selection ||
            !selection.rangeCount
        ){
            return;
        }


        const range =
            selection.getRangeAt(0);


        if(rangeInsideEditor(range)){

            AppState.savedRange =
                range.cloneRange();

        }
    }
);


/* =========================================================
   18. HSV COLOR
========================================================= */

function hsvToRgb(h,s,v){

    s /= 100;
    v /= 100;


    const c =
        v * s;

    const x =
        c *
        (
            1 -
            Math.abs(
                ((h / 60) % 2) - 1
            )
        );


    const m =
        v - c;


    let r = 0;
    let g = 0;
    let b = 0;


    if(h < 60){

        r = c;
        g = x;

    }else if(h < 120){

        r = x;
        g = c;

    }else if(h < 180){

        g = c;
        b = x;

    }else if(h < 240){

        g = x;
        b = c;

    }else if(h < 300){

        r = x;
        b = c;

    }else{

        r = c;
        b = x;
    }


    return {

        r:Math.round(
            (r+m)*255
        ),

        g:Math.round(
            (g+m)*255
        ),

        b:Math.round(
            (b+m)*255
        )

    };
}


function rgbString(rgb){

    return `rgb(
        ${rgb.r},
        ${rgb.g},
        ${rgb.b}
    )`
    .replace(/\s+/g,"");
}


/* =========================================================
   19. COLOR WHEEL
========================================================= */

function setupColorWheel(
    wheel,
    hueMarker,
    colorMarker,
    initialHue,
    callback
){

    let hue =
        initialHue;

    let saturation =
        100;

    let value =
        100;


    let draggingHue =
        false;

    let draggingSV =
        false;


    function update(){

        wheel.style.setProperty(
            "--hue",
            hue
        );


        const rgb =
            hsvToRgb(
                hue,
                saturation,
                value
            );


        const color =
            rgbString(rgb);


        colorMarker.style.background =
            color;


        const rect =
            wheel.getBoundingClientRect();


        const width =
            rect.width;

        const height =
            rect.height;


        const cx =
            width / 2;

        const cy =
            height / 2;


        const radius =
            Math.min(
                width,
                height
            ) / 2;


        const ringRadius =
            radius * .88;


        const angle =
            hue *
            Math.PI /
            180;


        const hx =
            cx +
            Math.sin(angle) *
            ringRadius;


        const hy =
            cy -
            Math.cos(angle) *
            ringRadius;


        hueMarker.style.left =
            `${hx / width * 100}%`;

        hueMarker.style.top =
            `${hy / height * 100}%`;


        const left =
            width * .13;

        const top =
            height * .13;

        const innerWidth =
            width * .74;

        const innerHeight =
            height * .74;


        const sx =
            left +
            saturation /
            100 *
            innerWidth;


        const sy =
            top +
            (1 - value / 100) *
            innerHeight;


        colorMarker.style.left =
            `${sx / width * 100}%`;

        colorMarker.style.top =
            `${sy / height * 100}%`;


        callback(color);
    }


    function setHue(event){

        const rect =
            wheel.getBoundingClientRect();


        const cx =
            rect.left +
            rect.width / 2;

        const cy =
            rect.top +
            rect.height / 2;


        const dx =
            event.clientX - cx;

        const dy =
            event.clientY - cy;


        let angle =
            Math.atan2(
                dx,
                -dy
            ) *
            180 /
            Math.PI;


        if(angle < 0){
            angle += 360;
        }


        hue =
            angle;

        update();
    }


    function setSV(event){

        const rect =
            wheel.getBoundingClientRect();


        const left =
            rect.width * .13;

        const top =
            rect.height * .13;

        const width =
            rect.width * .74;

        const height =
            rect.height * .74;


        let x =
            event.clientX -
            rect.left -
            left;

        let y =
            event.clientY -
            rect.top -
            top;


        x =
            Math.max(
                0,
                Math.min(width,x)
            );


        y =
            Math.max(
                0,
                Math.min(height,y)
            );


        saturation =
            x / width * 100;


        value =
            100 -
            y / height * 100;


        update();
    }


    wheel.addEventListener(
        "pointerdown",
        event => {

            const rect =
                wheel.getBoundingClientRect();


            const cx =
                rect.left +
                rect.width / 2;

            const cy =
                rect.top +
                rect.height / 2;


            const distance =
                Math.hypot(
                    event.clientX - cx,
                    event.clientY - cy
                );


            const radius =
                Math.min(
                    rect.width,
                    rect.height
                ) / 2;


            if(distance > radius * .76){

                draggingHue = true;
                draggingSV = false;

                setHue(event);

            }else{

                draggingSV = true;
                draggingHue = false;

                setSV(event);
            }


            try{

                wheel.setPointerCapture(
                    event.pointerId
                );

            }catch(error){}


            event.preventDefault();
        }
    );


    wheel.addEventListener(
        "pointermove",
        event => {

            if(draggingHue){
                setHue(event);
            }

            if(draggingSV){
                setSV(event);
            }

            event.preventDefault();
        }
    );


    function stop(event){

        draggingHue = false;
        draggingSV = false;

        try{

            wheel.releasePointerCapture(
                event.pointerId
            );

        }catch(error){}
    }


    wheel.addEventListener(
        "pointerup",
        stop
    );

    wheel.addEventListener(
        "pointercancel",
        stop
    );


    update();
}

function colorToRgba(
    color,
    opacity
){

    const temp =
        document.createElement("span");


    temp.style.color =
        color;


    document.body.appendChild(
        temp
    );


    const computed =
        getComputedStyle(temp).color;


    temp.remove();


    const match =
        computed.match(/\d+/g);


    if(
        !match ||
        match.length < 3
    ){

        return color;
    }


    return `rgba(
        ${match[0]},
        ${match[1]},
        ${match[2]},
        ${opacity}
    )`
    .replace(/\s+/g,"");
}

function updateFontSizeButtons(){

    fontSizeBar
        .querySelectorAll(".font-size-item")
        .forEach(button => {

            button.classList.toggle(
                "active",
                Number(button.textContent) ===
                AppState.fontSize
            );

        });
}


function applyFontSize(size){

    AppState.fontSize =
        size;


    if(!restoreSelection()){
        focusEditorEnd();
    }


    const selection =
        window.getSelection();


    if(
        !selection ||
        !selection.rangeCount
    ){

        return;
    }


    const range =
        selection.getRangeAt(0);


    if(!rangeInsideEditor(range)){
        return;
    }


    if(!range.collapsed){

        try{

            document.execCommand(
                "fontSize",
                false,
                "7"
            );


            editor
                .querySelectorAll(
                    'font[size="7"]'
                )
                .forEach(font => {

                    const span =
                        document.createElement(
                            "span"
                        );


                    span.style.fontSize =
                        `${size}px`;


                    while(font.firstChild){

                        span.appendChild(
                            font.firstChild
                        );

                    }


                    font.replaceWith(
                        span
                    );

                });

        }catch(error){

            console.error(error);
        }

    }else{

        const span =
            document.createElement("span");


        span.style.fontSize =
            `${size}px`;


        const marker =
            document.createTextNode(
                "\u200B"
            );


        span.appendChild(marker);


        range.insertNode(
            span
        );


        const newRange =
            document.createRange();


        newRange.setStart(
            marker,
            marker.length
        );


        newRange.collapse(true);


        selection.removeAllRanges();

        selection.addRange(
            newRange
        );


        AppState.savedRange =
            newRange.cloneRange();
    }


    saveSelection();


    fontSizeBar.style.display =
        "none";

    editor.focus();

    updateToolbar();
}

function createTable(
    rows,
    cols
){

    const table =
        document.createElement("table");


    const tbody =
        document.createElement("tbody");


    for(let r=0;r<rows;r++){

        const tr =
            document.createElement("tr");


        for(let c=0;c<cols;c++){

            const td =
                document.createElement("td");


            td.contentEditable =
                "true";


            td.innerHTML =
                "<br>";


            tr.appendChild(td);

        }


        tbody.appendChild(
            tr
        );
    }


    table.appendChild(
        tbody
    );


    return table;
}

function insertElement(element){

    if(!restoreSelection()){
        focusEditorEnd();
    }


    const selection =
        window.getSelection();


    if(
        !selection ||
        !selection.rangeCount
    ){

        editor.appendChild(
            element
        );

        focusEditorEnd();

        return;
    }


    const range =
        selection
            .getRangeAt(0)
            .cloneRange();


    if(!rangeInsideEditor(range)){

        editor.appendChild(
            element
        );

        focusEditorEnd();

        return;
    }


    range.deleteContents();

    range.insertNode(
        element
    );


    const marker =
        document.createTextNode(
            "\u200B"
        );


    if(element.parentNode){

        element.parentNode.insertBefore(
            marker,
            element.nextSibling
        );

    }


    const newRange =
        document.createRange();


    newRange.setStart(
        marker,
        marker.length
    );


    newRange.collapse(true);


    selection.removeAllRanges();

    selection.addRange(
        newRange
    );


    AppState.savedRange =
        newRange.cloneRange();
}

const searchInput =

function clearSearchHighlights(){

    document
        .querySelectorAll(".search-word")
        .forEach(span => {

            const parent =
                span.parentNode;

            if(!parent){
                return;
            }


            while(span.firstChild){

                parent.insertBefore(
                    span.firstChild,
                    span
                );
            }


            span.remove();

        });


    document
        .querySelectorAll(".search-highlight")
        .forEach(element => {

            element.classList.remove(
                "search-highlight"
            );

        });
}


function highlightTextNode(
    node,
    query
){

    const text =
        node.nodeValue;


    if(
        !text ||
        !query
    ){
        return 0;
    }


    const lowerText =
        text.toLocaleLowerCase();

    const lowerQuery =
        query.toLocaleLowerCase();


    let index =
        lowerText.indexOf(
            lowerQuery
        );


    if(index === -1){
        return 0;
    }


    const fragment =
        document.createDocumentFragment();


    let last =
        0;

    let count =
        0;


    while(index !== -1){

        fragment.appendChild(
            document.createTextNode(
                text.slice(
                    last,
                    index
                )
            )
        );


        const mark =
            document.createElement("span");


        mark.className =
            "search-word";


        mark.textContent =
            text.slice(
                index,
                index + query.length
            );


        fragment.appendChild(
            mark
        );


        count++;


        last =
            index + query.length;


        index =
            lowerText.indexOf(
                lowerQuery,
                last
            );
    }


    fragment.appendChild(
        document.createTextNode(
            text.slice(last)
        )
    );


    node.parentNode.replaceChild(
        fragment,
        node
    );


    return count;
}


function highlightNote(
    content,
    query
){

    let count =
        0;


    const walker =
        document.createTreeWalker(
            content,
            NodeFilter.SHOW_TEXT,
            {
                acceptNode(node){

                    if(
                        !node.nodeValue ||
                        !node.nodeValue
                            .toLocaleLowerCase()
                            .includes(
                                query.toLocaleLowerCase()
                            )
                    ){

                        return NodeFilter.FILTER_REJECT;
                    }


                    if(
                        node.parentElement &&
                        node.parentElement.closest(
                            ".search-word"
                        )
                    ){

                        return NodeFilter.FILTER_REJECT;
                    }


                    return NodeFilter.FILTER_ACCEPT;
                }
            }
        );


    const nodes = [];


    let node;


    while(
        (node = walker.nextNode())
    ){

        nodes.push(
            node
        );
    }


    nodes.forEach(
        textNode => {

            count +=
                highlightTextNode(
                    textNode,
                    query
                );

        }
    );


    return count;
}


function performSearch(){

    clearSearchHighlights();


    const query =
        searchInput.value.trim();


    if(!query){

        searchResult.textContent =
            "";

        return;
    }


    const lowerQuery =
        query.toLocaleLowerCase();


    const noteElements =
        messages.querySelectorAll(
            ".note"
        );


    let noteCount =
        0;

    let matchCount =
        0;

    let firstNote =
        null;


    noteElements.forEach(
        note => {

            const content =
                note.querySelector(
                    ".note-content"
                );


            if(!content){
                return;
            }


            const text =
                content.textContent
                    .toLocaleLowerCase();


            if(
                text.includes(
                    lowerQuery
                )
            ){

                noteCount++;


                if(!firstNote){
                    firstNote = note;
                }

            }

        }
    );


    if(!firstNote){

        searchResult.textContent =
            "لم يتم العثور على النص";

        return;
    }


    noteElements.forEach(
        note => {

            const content =
                note.querySelector(
                    ".note-content"
                );


            if(content){

                matchCount +=
                    highlightNote(
                        content,
                        query
                    );
            }

        }
    );


    firstNote.classList.add(
        "search-highlight"
    );


    firstNote.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });


    searchResult.textContent =
        `تم العثور على ${matchCount} نتيجة في ${noteCount} ملاحظة`;
}

    };


/* =========================================================
   34. CANCEL
========================================================= */

$("cancelButton").onclick =
    () => {

        resetEditor();

        editor.focus();

    };


/* =========================================================
   35. NEW NOTE
========================================================= */

$("newButton").onclick =
    () => {

        resetEditor();

        editor.focus();

    };


/* =========================================================
   36. CLOSE OVERLAYS
========================================================= */

document
    .querySelectorAll(".overlay")
    .forEach(overlay => {

        overlay.addEventListener(
            "click",
            event => {

                if(
                    event.target === overlay
                ){

                    overlay.style.display =
                        "none";

                    editor.focus();

                }

            }
        );

    });


/* =========================================================
   37. ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key !== "Escape"){
            return;
        }


        document
            .querySelectorAll(".overlay")
            .forEach(
                overlay => {

                    overlay.style.display =
                        "none";

                }
            );


        messageMenu.style.display =
            "none";

    }
);


/* =========================================================
   38. PASTE AS PLAIN TEXT
========================================================= */

editor.addEventListener(
    "paste",
    event => {

        event.preventDefault();


        const clipboard =
            event.clipboardData ||
            window.clipboardData;


        if(!clipboard){
            return;
        }


        const text =
            clipboard.getData(
                "text/plain"
            );


        if(!text){
            return;
        }


        if(!restoreSelection()){
            focusEditorEnd();
        }


        const selection =
            window.getSelection();


        if(
            !selection ||
            !selection.rangeCount
        ){
            return;
        }


        const range =
            selection.getRangeAt(0);


        if(!rangeInsideEditor(range)){
            return;
        }


        range.deleteContents();


        const fragment =
            document.createDocumentFragment();


        const lines =
            text
                .replace(/\r\n/g,"\n")
                .replace(/\r/g,"\n")
                .split("\n");


        lines.forEach(
            (line,index) => {

                if(index > 0){

                    fragment.appendChild(
                        document.createElement("br")
                    );

                }


                fragment.appendChild(
                    document.createTextNode(
                        line
                    )
                );

            }
        );


        range.insertNode(
            fragment
        );


        range.collapse(false);


        selection.removeAllRanges();

        selection.addRange(
            range
        );


        AppState.savedRange =
            range.cloneRange();


        setTimeout(
            () => {

                saveSelection();

                updateToolbar();

            },
            0
        );

    }
);


/* =========================================================
   39. IMAGE PROTECTION
========================================================= */

editor.addEventListener(
    "dragstart",
    event => {

        if(
            event.target &&
            event.target.tagName === "IMG"
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   40. DROP FILE PROTECTION
========================================================= */

editor.addEventListener(
    "drop",
    event => {

        if(
            event.dataTransfer &&
            event.dataTransfer.files &&
            event.dataTransfer.files.length
        ){

            event.preventDefault();

        }

    }
);


/* =========================================================
   41. WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if(
            messageMenu.style.display ===
            "block"
        ){

            messageMenu.style.display =
                "none";

        }

    }
);


/* =========================================================
   42. INITIALIZATION
========================================================= */

loadNotes();

renderNotes();

updateFontSizeButtons();

updateAlignmentButtons();

updateTableInfo();

</script>

</body>
</html>
