<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>مفكرتي</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101114;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    font-family:Arial,sans-serif;
    touch-action:manipulation;
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

/* =========================
   الصفحة الرئيسية
========================= */

#home{
    width:100%;
    height:100%;
}

.topbar{
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    background:#181a20;
    border-bottom:1px solid #333;
}

.topbar-title{
    font-size:18px;
    font-weight:bold;
}

.top-button{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:white;
    font-size:23px;
    border-radius:50%;
}

.notebook{
    padding:18px;
    border-bottom:1px solid #333;
    font-size:17px;
}

/* =========================
   المحادثة
========================= */

#chat{
    display:none;
    width:100%;
    height:100%;
    flex-direction:column;
}

#messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px 8px 250px;
    -webkit-overflow-scrolling:touch;
}

.empty{
    text-align:center;
    color:#777;
    margin-top:30vh;
}

.message-row{
    display:flex;
    align-items:flex-end;
    gap:4px;
    margin:7px 0;
}

.message{
    flex:1;
    min-width:0;
    background:#1d2028;
    border-radius:13px;
    padding:10px 12px;
    overflow-wrap:anywhere;
    line-height:1.6;
}

.message-menu-button{
    width:34px;
    height:34px;
    border:0;
    background:transparent;
    color:#aaa;
    font-size:22px;
}

/* =========================
   المحرر الواحد
========================= */

#editor{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:100;

    background:#181a20;

    border-top:1px solid #3b3d45;

    padding:
        5px
        7px
        calc(7px + env(safe-area-inset-bottom));

    box-shadow:0 -5px 20px rgba(0,0,0,.45);
}

.editor-status{
    height:25px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    color:#aaa;
    font-size:12px;
}

#cancel-edit{
    width:34px;
    height:28px;

    border:0;
    background:transparent;

    color:#aaa;
    font-size:21px;
}

/* =========================
   شريط الأدوات
========================= */

.toolbar{
    display:flex;
    align-items:center;
    gap:5px;

    overflow-x:auto;

    padding:5px 0;

    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 auto;

    min-width:36px;
    height:36px;

    border:1px solid #3d404a;
    border-radius:9px;

    background:#242730;
    color:white;

    font-size:16px;
}

.tool b{
    font-size:19px;
}

/* =========================
   منطقة الكتابة
========================= */

.write-row{
    display:flex;
    align-items:flex-end;
    gap:6px;
}

#editor-text{
    flex:1;

    min-height:48px;
    max-height:180px;

    overflow-y:auto;

    padding:10px;

    border:1px solid #444750;
    border-radius:11px;

    background:#0e0f13;
    color:#fff;

    outline:none;

    line-height:1.6;

    text-align:right;

    overflow-wrap:anywhere;

    -webkit-user-select:text;
    user-select:text;

    touch-action:manipulation;
}

#editor-text:empty::before{
    content:"اكتب هنا...";
    color:#666;
    pointer-events:none;
}

#send{
    flex:0 0 auto;

    width:46px;
    height:46px;

    border:0;
    border-radius:50%;

    background:#2b6cff;
    color:white;

    font-size:20px;
}

/* =========================
   النوافذ
========================= */

.modal{
    display:none;

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:500;

    width:min(92vw,340px);
    max-height:80vh;

    overflow:auto;

    padding:14px;

    border:1px solid #454853;
    border-radius:15px;

    background:#20232b;

    box-shadow:0 15px 45px rgba(0,0,0,.65);
}

.modal-title{
    text-align:center;
    margin-bottom:10px;
    font-weight:bold;
}

/* =========================
   عجلة الألوان
========================= */

.color-wheel-area{
    position:relative;

    width:230px;
    height:230px;

    margin:10px auto;

    touch-action:none;
}

.color-wheel{
    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        conic-gradient(
            red,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
        );
}

.color-wheel::after{
    content:"";

    position:absolute;

    left:22%;
    top:22%;

    width:56%;
    height:56%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #fff 0%,
            rgba(255,255,255,.7) 35%,
            rgba(255,255,255,0) 75%
        );
}

.color-marker{
    position:absolute;

    width:20px;
    height:20px;

    border-radius:50%;

    border:3px solid white;

    box-shadow:
        0 0 0 2px #111,
        0 2px 8px #000;

    transform:translate(-50%,-50%);

    pointer-events:none;
}

/* =========================
   حجم الخط
========================= */

.size-list{
    display:flex;
    flex-direction:column;

    gap:5px;

    max-height:280px;

    overflow-y:auto;

    padding:5px;

    touch-action:pan-y;
}

.size-item{
    width:100%;
    min-height:38px;

    border:1px solid #444750;
    border-radius:8px;

    background:#292c35;
    color:#fff;

    font-size:16px;
}

/* =========================
   جدول
========================= */

.note-table{
    width:100%;
    border-collapse:collapse;
    table-layout:auto;
}

.note-table td{
    border:1px solid #888;
    padding:6px;

    min-width:45px;

    white-space:normal;
    overflow-wrap:anywhere;

    vertical-align:top;
}

.note-table td:focus{
    outline:2px solid #2b6cff;
    outline-offset:-2px;
}

/* =========================
   قائمة الترقيم
========================= */

.list-choice{
    display:flex;
    gap:8px;
}

.list-choice button{
    flex:1;
    min-height:45px;

    border:1px solid #444750;
    border-radius:9px;

    background:#292c35;
    color:white;
}

/* =========================
   قائمة الرسالة
========================= */

#message-menu{
    display:none;

    position:fixed;

    z-index:700;

    min-width:120px;

    padding:5px;

    border:1px solid #444;
    border-radius:10px;

    background:#20232b;

    box-shadow:0 8px 30px #0008;
}

#message-menu button{
    width:100%;
    min-height:40px;

    border:0;
    border-radius:7px;

    background:transparent;
    color:#fff;

    text-align:right;
}

#message-menu button:active{
    background:#333641;
}

/* =========================
   بحث
========================= */

#search-box{
    display:none;

    padding:7px;

    background:#181a20;
}

#search-input{
    width:100%;

    height:40px;

    padding:0 14px;

    border:1px solid #444;
    border-radius:20px;

    background:#101114;
    color:white;

    outline:none;
}
</style>
</head>

<body>

<!-- =========================
     الرئيسية
========================= -->

<div id="home">

    <div class="topbar">

        <button
            class="top-button"
            id="home-menu"
            type="button">
            ☰
        </button>

        <div class="topbar-title">
            مفكرتي
        </div>

        <button
            class="top-button"
            id="home-search"
            type="button">
            ⌕
        </button>

    </div>

    <div
        class="notebook"
        id="open-notebook">

        <b>مذاكرة النحو</b>

    </div>

</div>


<!-- =========================
     المحادثة
========================= -->

<div id="chat">

    <div class="topbar">

        <button
            class="top-button"
            id="back"
            type="button">
            ‹
        </button>

        <div class="topbar-title">
            مذاكرة النحو
        </div>

        <button
            class="top-button"
            id="search-button"
            type="button">
            ⌕
        </button>

    </div>


    <div id="search-box">

        <input
            id="search-input"
            type="search"
            placeholder="بحث في الرسائل">

    </div>


    <div id="messages"></div>


    <!-- =========================
         المحرر الموحد
    ========================== -->

    <div id="editor">

        <div class="editor-status">

            <span id="editor-status">
                ＋ رسالة جديدة
            </span>

            <!--
                هذا الزر لا يحذف خانة الكتابة.
                فقط يخرج من وضع التعديل.
            -->

            <button
                id="cancel-edit"
                type="button">
                ×
            </button>

        </div>


        <div class="toolbar">

            <!-- عريض -->

            <button
                class="tool"
                id="bold"
                type="button">
                <b>B</b>
            </button>


            <!-- مائل -->

            <button
                class="tool"
                id="italic"
                type="button">
                <i>I</i>
            </button>


            <!-- تسطير -->

            <button
                class="tool"
                id="underline"
                type="button">
                <u>U</u>
            </button>


            <!-- لون الخط -->

            <button
                class="tool"
                id="text-color"
                type="button">
                ●
            </button>


            <!-- تمييز -->

            <button
                class="tool"
                id="highlight"
                type="button">
                🖍
            </button>


            <!-- حجم -->

            <button
                class="tool"
                id="font-size"
                type="button">
                A↕
            </button>


            <!-- قائمة -->

            <button
                class="tool"
                id="lists"
                type="button">
                ☷
            </button>


            <!-- محاذاة -->

            <button
                class="tool"
                data-command="justifyRight"
                type="button">
                →
            </button>

            <button
                class="tool"
                data-command="justifyCenter"
                type="button">
                ↔
            </button>

            <button
                class="tool"
                data-command="justifyLeft"
                type="button">
                ←
            </button>


            <!-- جدول -->

            <button
                class="tool"
                id="table"
                type="button">
                ▦
            </button>


            <!-- خريطة ذهنية -->

            <button
                class="tool"
                id="mind-map"
                type="button">
                ⌘
            </button>


            <!-- صف -->

            <button
                class="tool"
                id="row-add"
                type="button">
                ⬇️
            </button>


            <!-- عمود -->

            <button
                class="tool"
                id="column-add"
                type="button">
                ⬅️
            </button>


            <!-- حذف صف -->

            <button
                class="tool"
                id="row-delete"
                type="button">
                ✕
            </button>


            <!-- حذف عمود -->

            <button
                class="tool"
                id="column-delete"
                type="button">
                ✕
            </button>

        </div>


        <div class="write-row">

            <div
                id="editor-text"
                contenteditable="true"
                spellcheck="true">
            </div>

            <button
                id="send"
                type="button">
                ➤
            </button>

        </div>

    </div>

</div>


<!-- =========================
     عجلة لون الخط
========================= -->

<div
    class="modal"
    id="text-color-modal">

    <div class="modal-title">
        لون الخط
    </div>

    <div class="color-wheel-area">

        <div
            class="color-wheel"
            id="text-wheel">
        </div>

        <div
            class="color-marker"
            id="text-marker"
            style="left:115px;top:115px;">
        </div>

    </div>

    <button
        class="size-item"
        id="close-text-color"
        type="button">
        ✓
    </button>

</div>


<!-- =========================
     عجلة التمييز
========================= -->

<div
    class="modal"
    id="highlight-modal">

    <div class="modal-title">
        لون التمييز
    </div>

    <div class="color-wheel-area">

        <div
            class="color-wheel"
            id="highlight-wheel">
        </div>

        <div
            class="color-marker"
            id="highlight-marker"
            style="left:115px;top:115px;">
        </div>

    </div>

    <button
        class="size-item"
        id="close-highlight"
        type="button">
        ✓
    </button>

</div>


<!-- =========================
     حجم الخط 1 - 20
========================= -->

<div
    class="modal"
    id="font-size-modal">

    <div class="modal-title">
        حجم الخط
    </div>

    <div
        class="size-list"
        id="size-list">
    </div>

    <button
        class="size-item"
        id="close-size"
        type="button">
        ✓
    </button>

</div>


<!-- =========================
     الترقيم والتنقيط
========================= -->

<div
    class="modal"
    id="list-modal">

    <div class="modal-title">
        القائمة
    </div>

    <div class="list-choice">

        <button
            id="bullet-list"
            type="button">
            •
        </button>

        <button
            id="number-list"
            type="button">
            ١.
        </button>

    </div>

</div>


<!-- =========================
     قائمة الرسالة
========================= -->

<div id="message-menu">

    <button
        id="edit-message"
        type="button">
        تعديل
    </button>

    <button
        id="note-message"
        type="button">
        ؟
    </button>

    <button
        id="delete-message"
        type="button">
        حذف
    </button>

</div>


<script>

/* =====================================================
   مفكرتي - نسخة نظيفة
===================================================== */


/* =========================
   العناصر
========================= */

const home =
    document.getElementById("home");

const chat =
    document.getElementById("chat");

const messagesBox =
    document.getElementById("messages");

const editorText =
    document.getElementById("editor-text");

const editorStatus =
    document.getElementById("editor-status");

const messageMenu =
    document.getElementById("message-menu");


/* =========================
   البيانات
========================= */

let messages =
    JSON.parse(
        localStorage.getItem(
            "mofakkarati_clean"
        ) || "[]"
    );


let editingIndex = -1;

let selectedMessage = -1;

let savedRange = null;


/* =========================
   الحفظ
========================= */

function saveMessages(){

    localStorage.setItem(
        "mofakkarati_clean",
        JSON.stringify(messages)
    );

}


/* =========================
   تحديد النص
========================= */

function rememberSelection(){

    const selection =
        window.getSelection();

    if(
        selection &&
        selection.rangeCount
    ){

        savedRange =
            selection
                .getRangeAt(0)
                .cloneRange();

    }

}


function restoreSelection(){

    if(!savedRange){
        return;
    }

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
        savedRange
    );

}


/* =========================
   تنسيق
========================= */

function command(command,value=null){

    editorText.focus();

    restoreSelection();

    document.execCommand(
        command,
        false,
        value
    );

    rememberSelection();

}


/* =========================
   فتح المفكرة
========================= */

document
.getElementById("open-notebook")
.onclick = function(){

    home.style.display =
        "none";

    chat.style.display =
        "flex";

    renderMessages();

    newMessage();

};


/* =========================
   الرجوع
========================= */

document
.getElementById("back")
.onclick = function(){

    chat.style.display =
        "none";

    home.style.display =
        "block";

};


/* =========================
   رسالة جديدة
========================= */

function newMessage(){

    editingIndex = -1;

    editorStatus.textContent =
        "＋ رسالة جديدة";

    editorText.innerHTML =
        "";

    editorText.focus();

}


/* =========================
   تعديل
========================= */

function editMessage(index){

    editingIndex =
        index;

    editorStatus.textContent =
        "✎ تعديل";

    editorText.innerHTML =
        messages[index].html;

    editorText.focus();

    messageMenu.style.display =
        "none";

}


/* =========================
   زر ×
   
   لا يخفي المحرر
========================= */

document
.getElementById("cancel-edit")
.onclick = function(){

    newMessage();

};


/* =========================
   إرسال
========================= */

document
.getElementById("send")
.onclick = function(){

    const html =
        editorText.innerHTML.trim();

    if(!html){
        return;
    }


    if(
        editingIndex >= 0
    ){

        messages[
            editingIndex
        ].html = html;

    }
    else{

        messages.push({

            html:html,

            note:""

        });

    }


    saveMessages();

    renderMessages();

    newMessage();

};


/* =========================
   عرض الرسائل
========================= */

function renderMessages(){

    messagesBox.innerHTML =
        "";


    if(messages.length === 0){

        messagesBox.innerHTML =
            '<div class="empty">المفكرة فارغة</div>';

        return;

    }


    messages.forEach(
        function(message,index){

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "message-row";


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "message";

            content.innerHTML =
                message.html;


            const menuButton =
                document.createElement(
                    "button"
                );

            menuButton.className =
                "message-menu-button";

            menuButton.textContent =
                "⋮";


            menuButton.onclick =
                function(event){

                    event.stopPropagation();

                    selectedMessage =
                        index;

                    messageMenu.style.display =
                        "block";


                    const menuWidth =
                        125;

                    let left =
                        event.clientX -
                        menuWidth;

                    if(left < 5){
                        left = 5;
                    }


                    let top =
