
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>ملاحظاتي</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#101218;
  color:#fff;
}

button{
  font-family:inherit;
  touch-action:manipulation;
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* الرأس */
.header{
  height:56px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  background:#191c24;
  border-bottom:1px solid #343944;
}

.title{
  flex:1;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.icon{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#292e39;
  color:#fff;
  font-size:20px;
}

/* الرسائل */
.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:10px;
  -webkit-overflow-scrolling:touch;
}

.empty{
  text-align:center;
  color:#777;
  margin-top:30vh;
}

.note{
  background:#20242d;
  border-radius:14px;
  padding:11px 13px;
  margin-bottom:9px;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.note-menu{
  float:left;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#aaa;
  font-size:20px;
}

/* المحرر */
.editor-area{
  flex-shrink:0;
  background:#191c24;
  border-top:1px solid #343944;
  padding:5px 7px calc(8px + env(safe-area-inset-bottom));
}

.edit-state{
  height:28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#aaa;
  font-size:12px;
}

.cancel{
  width:34px;
  height:28px;
  border:0;
  background:transparent;
  color:#aaa;
  font-size:21px;
}

/* الأدوات */
.toolbar{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:3px 0 7px;
  scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
  display:none;
}

.tool{
  flex:0 0 39px;
  width:39px;
  height:39px;
  border:1px solid #444955;
  border-radius:10px;
  background:#292e39;
  color:#fff;
  font-size:17px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.tool.active{
  background:#315fae;
}

.bold{
  font-weight:900;
}

.underline{
  text-decoration:underline;
  text-underline-offset:5px;
}

/* الكتابة */
.write-row{
  display:flex;
  align-items:flex-end;
  gap:6px;
}

.editor{
  flex:1;
  min-width:0;
  min-height:48px;
  max-height:170px;
  overflow-y:auto;
  padding:9px 11px;
  border:1px solid #464b57;
  border-radius:12px;
  outline:none;
  background:#0e1015;
  color:#fff;
  line-height:1.7;
  overflow-wrap:anywhere;
  user-select:text;
  -webkit-user-select:text;
}

.editor:empty::before{
  content:"اكتبي ملاحظتك هنا...";
  color:#666;
}

.send{
  flex:0 0 47px;
  width:47px;
  height:47px;
  border:0;
  border-radius:50%;
  background:#3471f6;
  color:#fff;
  font-size:21px;
}

/* النوافذ */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.58);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.panel{
  width:min(94vw,350px);
  max-height:86vh;
  overflow:auto;
  background:#20242d;
  border:1px solid #444955;
  border-radius:17px;
  padding:15px;
  box-shadow:0 15px 50px #000b;
}

.panel-title{
  text-align:center;
  font-weight:bold;
  margin-bottom:12px;
}

/* عجلة اللون */
.wheel-box{
  width:250px;
  height:250px;
  max-width:72vw;
  max-height:72vw;
  position:relative;
  margin:10px auto 15px;
  touch-action:none;
}

.wheel{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    conic-gradient(
      red,
      yellow,
      lime,
      cyan,
      blue,
      magenta,
      red
    );
}

.wheel::after{
  content:"";
  position:absolute;
  inset:20%;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      white 0%,
      rgba(255,255,255,.7) 35%,
      rgba(255,255,255,0) 75%
    );
}

.marker{
  position:absolute;
  width:23px;
  height:23px;
  border:3px solid white;
  border-radius:50%;
  box-shadow:0 0 0 2px #000;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.range-title{
  text-align:center;
  color:#ccc;
  margin-bottom:5px;
}

.range{
  width:100%;
  accent-color:#4c80ff;
}

.panel-button{
  width:100%;
  height:43px;
  border:0;
  border-radius:10px;
  background:#303642;
  color:#fff;
  margin-top:10px;
}

/* حجم الخط */
.size-list{
  max-height:55vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.size-item{
  min-height:40px;
  border:1px solid #444955;
  border-radius:9px;
  background:#2a2f39;
  color:#fff;
}

/* قائمة */
.list-choice{
  display:flex;
  gap:7px;
}

.list-choice button{
  flex:1;
  min-height:48px;
  border:1px solid #444955;
  border-radius:10px;
  background:#2a2f39;
  color:#fff;
}

/* القائمة المنبثقة */
.menu{
  display:none;
  position:fixed;
  z-index:1000;
  min-width:135px;
  padding:5px;
  background:#20242d;
  border:1px solid #444955;
  border-radius:11px;
  box-shadow:0 10px 35px #000b;
}

.menu button{
  display:block;
  width:100%;
  min-height:42px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#fff;
  text-align:right;
  padding:0 10px;
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <button
      class="icon"
      id="searchButton"
      type="button">⌕</button>

    <div class="title">ملاحظاتي</div>

    <button
      class="icon"
      id="newButton"
      type="button">＋</button>

  </header>


  <main
    class="messages"
    id="messages">
  </main>


  <section class="editor-area">

    <div class="edit-state">

      <span id="state">
        رسالة جديدة
      </span>

      <button
        class="cancel"
        id="cancelButton"
        type="button">×</button>

    </div>


    <div class="toolbar">

      <button
        class="tool bold"
        id="boldButton"
        type="button">B</button>

      <button
        class="tool"
        id="italicButton"
        type="button">
        <i>I</i>
      </button>

      <button
        class="tool underline"
        id="underlineButton"
        type="button">U</button>

      <button
        class="tool"
        id="colorButton"
        type="button">●</button>

      <button
        class="tool"
        id="highlightButton"
        type="button">▰</button>

      <button
        class="tool"
        id="sizeButton"
        type="button">A↕</button>

      <button
        class="tool"
        id="listButton"
        type="button">☷</button>

    </div>


    <div class="write-row">

      <div
        class="editor"
        id="editor"
        contenteditable="true"
        spellcheck="true">
      </div>

      <button
        class="send"
        id="sendButton"
        type="button">➤</button>

    </div>

  </section>

</div>


<!-- لون الخط -->
<div
  class="overlay"
  id="colorOverlay">

  <div class="panel">

    <div class="panel-title">
      لون الخط
    </div>

    <div class="wheel-box">

      <div
        class="wheel"
        id="colorWheel">
      </div>

      <div
        class="marker"
        id="colorMarker"
        style="left:125px;top:125px">
      </div>

    </div>

    <button
      class="panel-button"
      id="colorDone"
      type="button">
      تم
    </button>

  </div>

</div>


<!-- التمييز -->
<div
  class="overlay"
  id="highlightOverlay">

  <div class="panel">

    <div class="panel-title">
      تمييز النص
    </div>

    <div class="wheel-box">

      <div
        class="wheel"
        id="highlightWheel">
      </div>

      <div
        class="marker"
        id="highlightMarker"
        style="left:125px;top:125px">
      </div>

    </div>

    <div class="range-title">
      شدة التمييز
    </div>

    <input
      class="range"
      id="opacityRange"
      type="range"
      min="10"
      max="100"
      value="60">

    <button
      class="panel-button"
      id="highlightDone"
      type="button">
      تم
    </button>

  </div>

</div>


<!-- حجم الخط -->
<div
  class="overlay"
  id="sizeOverlay">

  <div class="panel">

    <div class="panel-title">
      حجم الخط
    </div>

    <div
      class="size-list"
      id="sizeList">
    </div>

    <button
      class="panel-button"
      id="sizeDone"
      type="button">
      تم
    </button>

  </div>

</div>


<!-- التنقيط والترقيم -->
<div
  class="overlay"
  id="listOverlay">

  <div class="panel">

    <div class="panel-title">
      اختيار القائمة
    </div>

    <div class="list-choice">

      <button
        id="bulletButton"
        type="button">
        • تنقيط
      </button>

      <button
        id="numberButton"
        type="button">
        ١. ترقيم
      </button>

    </div>

    <button
      class="panel-button"
      id="listDone"
      type="button">
      تم
    </button>

  </div>

</div>


<!-- قائمة تعديل الرسالة -->
<div
  class="menu"
  id="messageMenu">

  <button
    id="editButton"
    type="button">
    ✎ تعديل
  </button>

  <button
    id="deleteButton"
    type="button">
    🗑 حذف
  </button>

</div>


<script>
"use strict";

/* ==========================
   البيانات
========================== */

const STORAGE =
  "notes_clean_editor_v1";

let notes =
  JSON.parse(
    localStorage.getItem(STORAGE) || "[]"
  );

let editingIndex = -1;
let selectedIndex = -1;
let savedRange = null;


/* ==========================
   العناصر
========================== */

const editor =
  document.getElementById("editor");

const messages =
  document.getElementById("messages");

const state =
  document.getElementById("state");

const messageMenu =
  document.getElementById("messageMenu");


/* ==========================
   التخزين
========================== */

function saveNotes(){

  localStorage.setItem(
    STORAGE,
    JSON.stringify(notes)
  );

}


/* ==========================
   عرض الملاحظات
========================== */

function render(){

  messages.innerHTML = "";

  if(notes.length === 0){

    messages.innerHTML =
      '<div class="empty">لا توجد ملاحظات بعد</div>';

    return;
  }


  notes.forEach((note,index)=>{

    const box =
      document.createElement("div");

    box.className = "note";


    const menu =
      document.createElement("button");

    menu.className = "note-menu";
    menu.textContent = "⋮";


    menu.addEventListener(
      "click",
      function(event){

        event.stopPropagation();

        selectedIndex = index;

        openMessageMenu(
          event.clientX,
          event.clientY
        );

      }
    );


    box.appendChild(menu);

    const content =
      document.createElement("div");

    content.innerHTML =
      note.html;

    box.appendChild(content);

    messages.appendChild(box);

  });

}


/* ==========================
   قائمة الرسالة
========================== */

function openMessageMenu(x,y){

  messageMenu.style.display =
    "block";

  let left = x - 140;
  let top = y;


  if(left < 5){
    left = 5;
  }

  if(left + 140 > window.innerWidth){
    left = window.innerWidth - 145;
  }

  if(top + 100 > window.innerHeight){
    top = window.innerHeight - 110;
  }


  messageMenu.style.left =
    left + "px";

  messageMenu.style.top =
    top + "px";
}


document.addEventListener(
  "click",
  function(event){

    if(
      !event.target.closest(".menu") &&
      !event.target.closest(".note-menu")
    ){

      messageMenu.style.display =
        "none";
    }

  }
);


/* ==========================
   حفظ تحديد النص
========================== */

function saveSelection(){

  const selection =
    window.getSelection();

  if(
    selection &&
    selection.rangeCount > 0
  ){

    savedRange =
      selection
        .getRangeAt(0)
        .cloneRange();
  }

}


function restoreSelection(){

  if(!savedRange){
    return;
  }

  const selection =
    window.getSelection();

  selection.removeAllRanges();

  selection.addRange(
    savedRange
  );

}


/* ==========================
   التركيز على المحرر
========================== */

function focusEditor(){

  editor.focus();

  restoreSelection();

}


/* ==========================
   التنسيق
========================== */

function command(
  name,
  value = null
){

  focusEditor();

  document.execCommand(
    name,
    false,
    value
  );

  saveSelection();

}


/* ==========================
   B
========================== */

document
.getElementById("boldButton")
.addEventListener(
  "click",
  function(){

    command("bold");

  }
);


/* ==========================
   I
========================== */

document
.getElementById("italicButton")
.addEventListener(
  "click",
  function(){

    command("italic");

  }
);


/* ==========================
   التسطير
========================== */

document
.getElementById("underlineButton")
.addEventListener(
  "click",
  function(){

    command("underline");

  }
);


/* ==========================
   حفظ التحديد أثناء الكتابة
========================== */

editor.addEventListener(
  "mouseup",
  saveSelection
);

editor.addEventListener(
  "keyup",
  saveSelection
);

editor.addEventListener(
  "touchend",
  function(){

    setTimeout(
      saveSelection,
      50
    );

  }
);


/* ==========================
   عجلة الألوان
========================== */

function getWheelColor(
  wheel,
  marker,
  event
){

  const rect =
    wheel.getBoundingClientRect();

  const cx =
    rect.left +
    rect.width / 2;

  const cy =
    rect.top +
    rect.height / 2;

  let dx =
    event.clientX - cx;

  let dy =
    event.clientY - cy;

  const radius =
    rect.width / 2;

  let distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  if(distance > radius){

    dx =
      dx / distance *
      radius;

    dy =
      dy / distance *
      radius;

    distance =
      radius;
  }


  let angle =
    Math.atan2(dy,dx) *
    180 /
    Math.PI;

  angle =
    (angle + 360) % 360;


  const saturation =
    Math.max(
      45,
      Math.min(
        100,
        distance /
        radius *
        100
      )
    );


  const color =
    `hsl(${angle},${saturation}%,50%)`;


  marker.style.left =
    (radius + dx) + "px";

  marker.style.top =
    (radius + dy) + "px";


  return color;
}


/* ==========================
   لون الخط
========================== */

const colorOverlay =
  document.getElementById(
    "colorOverlay"
  );

const colorWheel =
  document.getElementById(
    "colorWheel"
  );

const colorMarker =
  document.getElementById(
    "colorMarker"
  );


let colorDragging = false;


function applyTextColor(event){

  const color =
    getWheelColor(
      colorWheel,
      colorMarker,
      event
    );

  focusEditor();

  document.execCommand(
    "foreColor",
    false,
    color
  );

  saveSelection();
}


colorWheel.addEventListener(
  "pointerdown",
  function(event){

    colorDragging = true;

    colorWheel.setPointerCapture(
      event.pointerId
    );

    applyTextColor(event);

    event.preventDefault();

  }
);


colorWheel.addEventListener(
  "pointermove",
  function(event){

    if(colorDragging){

      applyTextColor(event);

    }

  }
);


colorWheel.addEventListener(
  "pointerup",
  function(){

    colorDragging = false;

  }
);


colorWheel.addEventListener(
  "pointercancel",
  function(){

    colorDragging = false;

  }
);


document
.getElementById("colorButton")
.addEventListener(
  "click",
  function(){

    saveSelection();

    colorOverlay.style.display =
      "flex";

  }
);


document
.getElementById("colorDone")
.addEventListener(
  "click",
  function(){

    colorOverlay.style.display =
      "none";

  }
);


/* ==========================
   التمييز
========================== */

const highlightOverlay =
  document.getElementById(
    "highlightOverlay"
  );

const highlightWheel =
  document.getElementById(
    "highlightWheel"
  );

const highlightMarker =
  document.getElementById(
    "highlightMarker"
  );


let highlightDragging = false;


function applyHighlight(event){

  const color =
    getWheelColor(
      highlightWheel,
      highlightMarker,
      event
    );

  focusEditor();

  document.execCommand(
    "hiliteColor",
    false,
    color
  );

  saveSelection();
}


highlightWheel.addEventListener(
  "pointerdown",
  function(event){

    highlightDragging = true;

    highlightWheel.setPointerCapture(
      event.pointerId
    );

    applyHighlight(event);

    event.preventDefault();

  }
);


highlightWheel.addEventListener(
  "pointermove",
  function(event){

    if(highlightDragging){

      applyHighlight(event);

    }

  }
);


highlightWheel.addEventListener(
  "pointerup",
  function(){

    highlightDragging = false;

  }
);


highlightWheel.addEventListener(
  "pointercancel",
  function(){

    highlightDragging = false;

  }
);


document
.getElementById("highlightButton")
.addEventListener(
  "click",
  function(){

    saveSelection();

    highlightOverlay.style.display =
      "flex";

  }
);


/*
   شدة التمييز:
   تغيير شفافية الخلفية بعد الاختيار.
*/
document
.getElementById("opacityRange")
.addEventListener(
  "input",
  function(){

    /*
      لا نغلق النافذة ولا نفقد التحديد.
      التغيير سيطبق عند اختيار اللون التالي.
    */

  }
);


document
.getElementById("highlightDone")
.addEventListener(
  "click",
  function(){

    highlightOverlay.style.display =
      "none";

  }
);


/* ==========================
   حجم الخط 1 - 20
========================== */

const sizeList =
  document.getElementById(
    "sizeList"
  );


for(
  let size = 1;
  size <= 20;
  size++
){

  const button =
    document.createElement("button");

  button.className =
    "size-item";

  button.textContent =
    size;

  button.style.fontSize =
    Math.max(14,size) + "px";


  button.addEventListener(
    "click",
    function(){

      focusEditor();

      /*
        execCommand fontSize يستخدم
        قيمًا محدودة، لذلك نستخدم
        span مباشرة للنص المحدد.
      */

      const selection =
        window.getSelection();


      if(
        selection &&
        selection.rangeCount > 0 &&
        !selection.isCollapsed
      ){

        const range =
          selection.getRangeAt(0);

        const span =
          document.createElement("span");

        span.style.fontSize =
          size + "px";


        try{

          range.surroundContents(
            span
          );

        }catch(error){

          document.execCommand(
            "fontSize",
            false,
            "7"
          );

          const fonts =
            editor.querySelectorAll(
              'font[size="7"]'
            );

          fonts.forEach(
            font=>{

              font.removeAttribute(
                "size"
              );

              font.style.fontSize =
                size + "px";

            }
          );

        }

      }

      saveSelection();

      document
        .getElementById(
          "sizeOverlay"
        )
        .style.display =
        "none";

    }
  );


  sizeList.appendChild(
    button
  );

}


document
.getElementById("sizeButton")
.addEventListener(
  "click",
  function(){

    saveSelection();

    document
      .getElementById(
        "sizeOverlay"
      )
      .style.display =
      "flex";

  }
);


document
.getElementById("sizeDone")
.addEventListener(
  "click",
  function(){

    document
      .getElementById(
        "sizeOverlay"
      )
      .style.display =
      "none";

  }
);


/* ==========================
   التنقيط والترقيم
========================== */

const listOverlay =
  document.getElementById(
    "listOverlay"
  );


document
.getElementById("listButton")
.addEventListener(
  "click",
  function(){

    saveSelection();

    listOverlay.style.display =
      "flex";

  }
);


document
.getElementById("bulletButton")
.addEventListener(
  "click",
  function(){

    command(
      "insertUnorderedList"
    );

  }
);


document
.getElementById("numberButton")
.addEventListener(
  "click",
  function(){

    command(
      "insertOrderedList"
    );

  }
);


document
.getElementById("listDone")
.addEventListener(
  "click",
  function(){

    listOverlay.style.display =
      "none";

  }
);


/* ==========================
   حفظ الرسالة
========================== */

document
.getElementById("sendButton")
.addEventListener(
  "click",
  function(){

    const html =
      editor.innerHTML.trim();


    if(!html){
      return;
    }


    if(editingIndex >= 0){

      notes[editingIndex].html =
        html;

    }else{

      notes.push({
        html:html
      });

    }


    saveNotes();

    render();


    editingIndex =
      -1;

    editor.innerHTML =
      "";

    state.textContent =
      "رسالة جديدة";


    setTimeout(
      function(){

        messages.scrollTop =
          messages.scrollHeight;

      },
      50
    );

  }
);


/* ==========================
   تعديل
========================== */

document
.getElementById("editButton")
.addEventListener(
  "click",
  function(){

    if(selectedIndex < 0){
      return;
    }


    editingIndex =
      selectedIndex;


    editor.innerHTML =
      notes[selectedIndex].html;


    state.textContent =
      "✎ تعديل الملاحظة";


    messageMenu.style.display =
      "none";


    editor.focus();


    setTimeout(
      function(){

        editor.scrollIntoView({
          behavior:"smooth",
          block:"end"
        });

      },
      100
    );

  }
);


/* ==========================
   حذف
========================== */

document
.getElementById("deleteButton")
.addEventListener(
  "click",
  function(){

    if(selectedIndex < 0){
      return;
    }


    notes.splice(
      selectedIndex,
      1
    );


    selectedIndex =
      -1;


    saveNotes();

    render();

    messageMenu.style.display =
      "none";

  }
);


/* ==========================
   إلغاء التعديل
========================== */

document
.getElementById("cancelButton")
.addEventListener(
  "click",
  function(){

    editingIndex =
      -1;

    editor.innerHTML =
      "";

    state.textContent =
      "رسالة جديدة";

    /*
      مهم:
      الزر × لا يخفي المحرر.
      فقط يلغي وضع التعديل.
    */

  }
);


/* ==========================
   رسالة جديدة
========================== */

document
.getElementById("newButton")
.addEventListener(
  "click",
  function(){

    editingIndex =
      -1;

    editor.innerHTML =
      "";

    state.textContent =
      "رسالة جديدة";

    editor.focus();

  }
);


/* ==========================
   إغلاق النوافذ بالضغط
   خارجها
========================== */

document
.querySelectorAll(".overlay")
.forEach(
  function(overlay){

    overlay.addEventListener(
      "click",
      function(event){

        if(
          event.target === overlay
        ){

          overlay.style.display =
            "none";

        }

      }
    );

  }
);


/* ==========================
   التشغيل الأول
========================== */

render();
