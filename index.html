<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>ملاحظاتي</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --app-height:100dvh;
    --keyboard-height:0px;
    --underline-gap:0.08in;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#10131a;
    color:#fff;
    font-family:Arial,"Noto Sans Arabic",sans-serif;
}

body{
    display:flex;
    justify-content:center;
}

button,input,textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:900px;
    height:var(--app-height);
    display:flex;
    flex-direction:column;
    background:#10131a;
    overflow:hidden;
}

/* HEADER */
.header{
    flex:0 0 auto;
    min-height:56px;
    padding:8px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#171b24;
    border-bottom:1px solid #292e3a;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:6px;
}

.header button{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#252b36;
    color:#fff;
    font-size:20px;
}

/* MESSAGES */
.messages{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px;
    scroll-behavior:smooth;
}

.empty{
    text-align:center;
    color:#7f8795;
    padding:50px 20px;
}

.note{
    position:relative;
    margin:0 0 12px auto;
    max-width:92%;
    background:#202631;
    border:1px solid #2c3441;
    border-radius:16px;
    padding:14px 42px 14px 14px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.note.editing-note{
    border-color:#5b8cff;
}

.note-content{
    min-width:0;
    line-height:1.8;
    word-break:break-word;
    overflow-wrap:anywhere;
}

/* التسطير 0.08 بوصة */
.editor u,
.note-content u,
.editor .custom-underline,
.note-content .custom-underline{
    text-decoration-line:underline !important;
    text-decoration-thickness:1px;
    text-underline-offset:var(--underline-gap);
}

/* MENU */
.note-menu{
    position:absolute;
    top:8px;
    right:7px;
    width:32px;
    height:32px;
    border-radius:9px;
    background:#2b323e;
    color:#fff;
    font-size:21px;
}

.note-menu:active{
    transform:scale(.94);
}

.message-menu{
    position:fixed;
    z-index:2000;
    display:none;
    min-width:145px;
    padding:5px;
    background:#252b36;
    border:1px solid #3a4250;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.message-menu.open{
    display:block;
}

.message-menu button{
    display:block;
    width:100%;
    padding:11px;
    border-radius:8px;
    background:transparent;
    color:#fff;
    text-align:right;
}

.message-menu button:active{
    background:#343c4a;
}

/* EDITOR */
.editor-area{
    flex:0 0 auto;
    padding:8px 10px 10px;
    background:#151922;
    border-top:1px solid #292e3a;
}

.editor-state{
    font-size:12px;
    color:#8e98a8;
    margin:0 5px 6px;
}

.editor{
    min-height:95px;
    max-height:30vh;
    overflow-y:auto;
    padding:13px;
    border:1px solid #303745;
    border-radius:14px;
    background:#1c212b;
    color:#fff;
    outline:none;
    direction:rtl;
    text-align:right;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.8;
}

.editor:empty:before{
    content:"اكتبي ملاحظتك هنا…";
    color:#737d8e;
    pointer-events:none;
}

.editor:focus{
    border-color:#527df5;
}

.editor table,
.note-content table{
    width:100%;
    max-width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    margin:8px 0;
}

.editor td,
.editor th,
.note-content td,
.note-content th{
    border:1px solid #596273;
    padding:7px;
    min-width:35px;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:anywhere;
    vertical-align:top;
}

.editor td{
    min-height:35px;
}

/* TOOLBAR */
.toolbar{
    display:flex;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    padding:7px 0 2px;
    scrollbar-width:none;
}

.toolbar::-webkit-scrollbar,
.sub-toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#252c38;
    color:#fff;
    font-weight:bold;
    font-size:17px;
}

.tool.active,
.sub-toolbar button.active{
    background:#4169d8;
}

.tool:active,
.sub-toolbar button:active,
.toolbar button:active{
    transform:scale(.94);
}

/* SUB TOOLBAR */
.sub-toolbar{
    display:none;
    gap:5px;
    overflow-x:auto;
    padding:5px 0;
    scrollbar-width:none;
}

.sub-toolbar button{
    flex:0 0 auto;
    min-width:40px;
    height:36px;
    border-radius:9px;
    background:#292f3b;
    color:#fff;
}

/* ACTIONS */
.editor-actions{
    display:flex;
    gap:7px;
    margin-top:6px;
}

.send-button{
    flex:0 0 46px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#3867dc;
    color:#fff;
    font-size:21px;
}

.cancel-button{
    flex:1;
    height:42px;
    border-radius:11px;
    background:#303744;
    color:#fff;
    font-weight:bold;
}

/* OVERLAY */
.overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.62);
}

.overlay.open{
    display:flex;
}

.overlay-box{
    width:min(600px,100%);
    max-height:90dvh;
    overflow-y:auto;
    padding:18px;
    background:#191e27;
    border-radius:22px 22px 0 0;
    border:1px solid #343b48;
}

.overlay-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.overlay-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
}

.overlay-actions button{
    flex:1;
    min-height:42px;
    border-radius:11px;
    background:#303744;
    color:#fff;
}

.overlay-actions .primary{
    background:#3867dc;
}

/* COLOR */
.color-wheel{
    position:relative;
    width:min(300px,80vw);
    aspect-ratio:1;
    margin:10px auto;
    border-radius:50%;
    touch-action:none;
    background:
        radial-gradient(circle at center,#fff 0%,rgba(255,255,255,0) 58%),
        radial-gradient(circle at center,rgba(0,0,0,0) 35%,rgba(0,0,0,.9) 100%),
        conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
}

.color-marker{
    position:absolute;
    width:18px;
    height:18px;
    margin:-9px;
    border:2px solid #fff;
    border-radius:50%;
    box-shadow:0 1px 5px #000;
    pointer-events:none;
}

.color-presets{
    display:flex;
    justify-content:center;
    gap:10px;
}

.color-preset{
    width:36px;
    height:36px;
    border-radius:50%;
    border:2px solid #fff;
}

#blackText{background:#000}
#whiteText{background:#fff}

.range-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.range-row input{
    flex:1;
}

/* COUNTERS */
.counter-area{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:20px 0;
}

.counter-area button{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#303744;
    color:#fff;
    font-size:22px;
}

.counter-area strong{
    min-width:45px;
    text-align:center;
}

/* SEARCH */
.search-input{
    width:100%;
    height:44px;
    padding:8px 12px;
    border:1px solid #3a4250;
    border-radius:11px;
    background:#11151c;
    color:#fff;
    outline:none;
}

.search-result{
    margin-top:12px;
    color:#aeb7c5;
}

.search-highlight{
    outline:2px solid #ffc107;
    outline-offset:2px;
}

.search-word{
    background:#ffe600;
    color:#111;
    border-radius:3px;
    padding:0 2px;
}

.word-text-highlight{
    -webkit-box-decoration-break:clone;
    box-decoration-break:clone;
}

/* MIND MAP */
.mind-map,
.mind-tree{
    width:100%;
    max-width:100%;
    margin:12px 0;
    padding:12px;
    border:1px solid #46506a;
    border-radius:16px;
    background:#171d28;
    overflow:hidden;
}

.mind-map-title,
.mind-tree-title{
    text-align:center;
    font-weight:bold;
    margin-bottom:12px;
    overflow-wrap:anywhere;
}

.mind-map-main,
.mind-tree-main{
    width:fit-content;
    max-width:90%;
    margin:0 auto 18px;
    padding:10px 16px;
    border-radius:12px;
    background:#3867dc;
    text-align:center;
    overflow-wrap:anywhere;
}

.mind-map-branches,
.mind-tree-branches{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
    gap:8px;
}

.mind-map-branch,
.mind-tree-branch{
    min-width:0;
    padding:9px;
    border-radius:10px;
    background:#292f3b;
    text-align:center;
    overflow-wrap:anywhere;
}

/* MOBILE */
@media(max-width:600px){
    .note{
        max-width:96%;
    }

    .editor{
        max-height:35vh;
    }

    .mind-map-branches,
    .mind-tree-branches{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}

body.keyboard-open .editor{
    max-height:22dvh;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="title">ملاحظاتي</div>

    <div class="header-actions">
        <button id="newButton" type="button">＋</button>
        <button id="searchButton" type="button">⌕</button>
    </div>
</header>

<main id="messages" class="messages"></main>

<section class="editor-area">

    <div id="state" class="editor-state">رسالة جديدة</div>

    <div id="editor"
         class="editor"
         contenteditable="true"
         spellcheck="true"></div>

    <div class="toolbar">

        <button id="boldButton" class="tool" type="button"><b>B</b></button>
        <button id="italicButton" class="tool" type="button"><i>I</i></button>
        <button id="underlineButton" class="tool" type="button"><u>U</u></button>

        <button id="sizeButton" class="tool" type="button">A</button>
        <button id="listButton" class="tool" type="button">☷</button>
        <button id="alignmentButton" class="tool" type="button">≡</button>

        <button id="colorButton" class="tool" type="button">🎨</button>
        <button id="highlightButton" class="tool" type="button">🖍</button>

        <button id="tableButton" class="tool" type="button">▦</button>
        <button id="mindMapButton" class="tool" type="button">⌘</button>
        <button id="mindTreeButton" class="tool" type="button">🌳</button>

    </div>

    <div id="fontSizeBar" class="sub-toolbar"></div>
    <div id="listBar" class="sub-toolbar"></div>

    <div id="alignmentBar" class="sub-toolbar">
        <button type="button" data-align="right">يمين</button>
        <button type="button" data-align="center">وسط</button>
        <button type="button" data-align="left">يسار</button>
        <button type="button" data-align="justify">ضبط</button>
    </div>

    <div class="editor-actions">
        <button id="sendButton" class="send-button" type="button">➤</button>
        <button id="cancelButton" class="cancel-button" type="button">إلغاء</button>
    </div>

</section>
</div>

<!-- MESSAGE MENU -->
<div id="messageMenu" class="message-menu">
    <button id="editButton" type="button">✎ تعديل</button>
    <button id="deleteButton" type="button">🗑 حذف</button>
</div>

<!-- COLOR -->
<div id="colorOverlay" class="overlay">
    <div class="overlay-box">

        <div class="overlay-title">لون النص</div>

        <div id="textColorWheel" class="color-wheel">
            <span id="textColorMarker" class="color-marker"></span>
        </div>

        <div class="color-presets">
            <button id="blackText" class="color-preset" type="button"></button>
            <button id="whiteText" class="color-preset" type="button"></button>
        </div>

        <div class="overlay-actions">
            <button id="colorDone" class="primary" type="button">تطبيق</button>
            <button id="removeTextColor" type="button">إلغاء اللون</button>
        </div>

    </div>
</div>

<!-- HIGHLIGHT -->
<div id="highlightOverlay" class="overlay">
    <div class="overlay-box">

        <div class="overlay-title">تمييز النص</div>

        <div id="highlightColorWheel" class="color-wheel">
            <span id="highlightColorMarker" class="color-marker"></span>
        </div>

        <div class="range-row">
            <span>الشفافية</span>
            <input id="opacityRange" type="range" min="0" max="100" value="60">
        </div>

        <div class="overlay-actions">
            <button id="highlightDone" class="primary" type="button">تمييز</button>
            <button id="removeHighlight" type="button">إلغاء التمييز</button>

    </div>
</div>

<!-- TABLE -->
<div id="tableOverlay" class="overlay">

        <div class="overlay-title">إنشاء جدول</div>

        <div class="counter-area">

            <button id="tableRowsMinus" type="button">−</button>

            <strong id="tableInfo">3 × 3</strong>
            <span>أعمدة</span>

        </div>

        <div class="overlay-actions">
            <button id="tableDone" class="primary" type="button">
                إدراج الجدول
            </button>
        </div>

</div>

<!-- MIND MAP -->
<div id="mindMapOverlay" class="overlay">
    <div class="overlay-box">

        <div class="overlay-title">خريطة ذهنية</div>

        <input id="mindMainInput"
               class="search-input"
               placeholder="الفكرة الرئيسية">

        <div class="counter-area">
            <button id="mindBranchMinus" type="button">−</button>
            <strong id="mindBranchInfo">2</strong>
            <span>عدد الفروع</span>
            <button id="mindBranchPlus" type="button">＋</button>
        </div>

        <div id="mindBranchInputs"></div>

        <div class="overlay-actions">
            <button id="mindDone" class="primary" type="button">إدراج</button>
        </div>

</div>

<!-- TREE -->
<div id="mindTreeOverlay" class="overlay">
    <div class="overlay-box">

        <div class="overlay-title">شجرة ذهنية 🌳</div>

        <input id="treeMainInput"
               class="search-input"
               placeholder="العنوان الرئيسي">

        <div class="counter-area">
            <button id="treeBranchMinus" type="button">−</button>
            <strong id="treeBranchInfo">2</strong>
            <span>عدد الفروع</span>
            <button id="treeBranchPlus" type="button">＋</button>
        </div>

        <div id="treeBranchInputs"></div>

        <div class="overlay-actions">
            <button id="treeDone" class="primary" type="button">
                إدراج الشجرة
            </button>
        </div>

    </div>
</div>

<!-- SEARCH -->
<div id="searchOverlay" class="overlay">
    <div class="overlay-box">

        <div class="overlay-title">البحث</div>

        <input id="searchInput"
               class="search-input"
               type="search"
               autocomplete="off"
               placeholder="اكتب ما تريد البحث عنه">

        <div id="searchResult" class="search-result"></div>

        <div class="overlay-actions">
            <button id="searchDone" class="primary" type="button">
                إغلاق
            </button>
        </div>

    </div>
</div>

<script>
"use strict";

const STORAGE_KEY="notes_stable_v13";

const FONT_SIZES=[
    8,9,10,11,12,14,16,18,20,22,
    24,26,28,32,36,40,48,56,64,72
];

const AppState={
    notes:[],
    editingId:null,
    selectedNoteId:null,
    savedRange:null,

    fontSize:8,
    alignment:"right",

    bold:false,
    italic:false,
    underline:false,
    listType:null,

    textColor:null,
    highlightColor:"rgb(255,255,0)",
    highlightOpacity:.60,
    colorActive:false,
    highlightActive:false,

    tableRows:3,
    tableCols:3,

    mindBranches:2,
    treeBranches:2
};

const $=id=>document.getElementById(id);

let editor,messages,state,messageMenu;
let fontSizeBar,listBar,alignmentBar;
let colorOverlay,highlightOverlay,tableOverlay;
let mindMapOverlay,mindTreeOverlay,searchOverlay;
let searchInput,searchResult;


/* =====================================================
   DOM
===================================================== */

function initDOM(){

    editor=$("editor");
    messages=$("messages");
    state=$("state");
    messageMenu=$("messageMenu");

    fontSizeBar=$("fontSizeBar");
    listBar=$("listBar");
    alignmentBar=$("alignmentBar");

    colorOverlay=$("colorOverlay");
    highlightOverlay=$("highlightOverlay");
    tableOverlay=$("tableOverlay");
    mindMapOverlay=$("mindMapOverlay");
    mindTreeOverlay=$("mindTreeOverlay");
    searchOverlay=$("searchOverlay");

    searchInput=$("searchInput");
    searchResult=$("searchResult");
}

function on(id,event,fn,options){
    const el=$(id);
    if(el) el.addEventListener(event,fn,options);
}


/* =====================================================
   STORAGE
===================================================== */

function createNoteId(){
    if(window.crypto?.randomUUID){
        return crypto.randomUUID();
    }

    return "note_"+Date.now()+"_"+Math.random().toString(36).slice(2);
}

function loadNotes(){

    try{
        const data=JSON.parse(
            localStorage.getItem(STORAGE_KEY)||"[]"
        );

        AppState.notes=Array.isArray(data)
            ?data.filter(n=>n&&typeof n.html==="string")
            :[];

    }catch{
        AppState.notes=[];
    }
}

function saveNotes(){

    try{
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(AppState.notes)
        );
        return true;
    }catch{
        alert("تعذر حفظ الملاحظات في الجهاز.");
        return false;
    }
}


/* =====================================================
   SELECTION
===================================================== */

function isInsideEditor(node){
    return !!(
        node &&
        editor &&
        (node===editor||editor.contains(node))
    );
}

function getEditorRange(){

    const selection=window.getSelection();

    if(!selection?.rangeCount){
        return null;
    }

    const range=selection.getRangeAt(0);

    return isInsideEditor(range.startContainer) &&
           isInsideEditor(range.endContainer)
        ?range
        :null;
}

function saveSelection(){

    const range=getEditorRange();

    if(!range) return false;

    AppState.savedRange=range.cloneRange();
    return true;
}

function restoreSelection(){

    const range=AppState.savedRange;

    if(!range ||
       !isInsideEditor(range.startContainer) ||
       !isInsideEditor(range.endContainer)){
        return false;
    }

    try{
        const selection=window.getSelection();

        selection.removeAllRanges();
        selection.addRange(range);

        editor.focus({preventScroll:true});

        return true;
    }catch{
        return false;
    }
}

function focusEditorEnd(){

    editor.focus({preventScroll:true});

    const range=document.createRange();

    range.selectNodeContents(editor);
    range.collapse(false);

    const selection=window.getSelection();

    selection.removeAllRanges();
    selection.addRange(range);

    saveSelection();
}

function prepareSelection(){
    return restoreSelection()||focusEditorEnd();
}


/* =====================================================
   TRUE TOGGLE FORMATTING
===================================================== */

function execToggle(command,stateKey){

    if(!prepareSelection()) return;

    const range=getEditorRange();

    if(!range) return;

    const currentlyActive=queryState(command);

    document.execCommand(
        command,
        false,
        null
    );

    AppState[stateKey]=!currentlyActive;

    saveSelection();
    updateToolbar();
}

function queryState(command){

    try{
        return document.queryCommandState(command);
    }catch{
        return false;
    }
}


/* =====================================================
   B I U
===================================================== */

function setupBasicFormatting(){

    on("boldButton","click",e=>{
        e.preventDefault();
        execToggle("bold","bold");
    });

    on("italicButton","click",e=>{
        e.preventDefault();
        execToggle("italic","italic");
    });

    on("underlineButton","click",e=>{
        e.preventDefault();

        execToggle("underline","underline");

        /*
         * المسافة المطلوبة:
         * 0.08 بوصة
         */
        editor.querySelectorAll("u").forEach(el=>{
            el.classList.add("custom-underline");
        });
    });
}


/* =====================================================
   TOOLBAR STATE
===================================================== */

function updateToolbar(){

    $("boldButton")?.classList.toggle(
        "active",
        queryState("bold")
    );

    $("italicButton")?.classList.toggle(
        "active",
        queryState("italic")
    );

    $("underlineButton")?.classList.toggle(
        "active",
        queryState("underline")
    );

    $("colorButton")?.classList.toggle(
        "active",
        AppState.colorActive
    );

    $("highlightButton")?.classList.toggle(
        "active",
        AppState.highlightActive
    );

    $("listButton")?.classList.toggle(
        "active",
        !!AppState.listType
    );

    updateFontButtons();
    updateAlignmentButtons();
}


/* =====================================================
   EDITOR
===================================================== */

function setupEditor(){

    ["mouseup","keyup","touchend","input"].forEach(event=>{

        editor.addEventListener(event,()=>{

            setTimeout(()=>{
                if(getEditorRange()){
                    saveSelection();
                }

                updateToolbar();
            },0);

        });
    });

    editor.addEventListener("keydown",e=>{

        if(
            (e.ctrlKey||e.metaKey) &&
            ["b","i","u"].includes(e.key.toLowerCase())
        ){
            e.preventDefault();

            const key=e.key.toLowerCase();

            if(key==="b") execToggle("bold","bold");
            if(key==="i") execToggle("italic","italic");
            if(key==="u") execToggle("underline","underline");
        }

    });
}

        editor &&
        document.activeElement===editor &&
        getEditorRange()

        updateToolbar();

});

function applyFontSize(size){

    if(!prepareSelection()) return;

    const range=getEditorRange();

    if(!range) return;

    const span=document.createElement("span");

    span.style.fontSize=size+"px";

    if(range.collapsed){

        span.appendChild(
            document.createTextNode("\u200B")
        );

        range.insertNode(span);

        const r=document.createRange();

        r.setStart(span.firstChild,1);
        r.collapse(true);

        const selection=window.getSelection();

        selection.removeAllRanges();
        selection.addRange(r);

    }else{

        span.appendChild(
            range.extractContents()
        );

        range.insertNode(span);

        const r=document.createRange();

        r.selectNodeContents(span);

        const selection=window.getSelection();

        selection.removeAllRanges();
        selection.addRange(r);
    }

    saveSelection();
}

/* =====================================================
   COLOR WHEEL
===================================================== */

function hsvToRgb(h,s,v){

    s/=100;
    v/=100;

    const c=v*s;
    const x=c*(1-Math.abs((h/60)%2-1));
    const m=v-c;

    let r=0,g=0,b=0;

    if(h<60){r=c;g=x}
    else if(h<120){r=x;g=c}
    else if(h<180){g=c;b=x}
    else if(h<240){g=x;b=c}
    else if(h<300){r=x;b=c}
    else{r=c;b=x}

    return{
        r:Math.round((r+m)*255),
        g:Math.round((g+m)*255),
        b:Math.round((b+m)*255)
    };
}

function setupColorWheel(wheel,marker,callback){

    if(!wheel) return;

    let hue=0;

    function update(e){

        const rect=wheel.getBoundingClientRect();

        const cx=rect.left+rect.width/2;
        const cy=rect.top+rect.height/2;

        const dx=e.clientX-cx;
        const dy=e.clientY-cy;

        let angle=Math.atan2(dx,-dy)*180/Math.PI;

        if(angle<0) angle+=360;

        hue=angle;

        const distance=Math.min(
            Math.hypot(dx,dy),
            rect.width/2-12
        );

        const saturation=
            distance/(rect.width/2-12)*100;

        const rgb=hsvToRgb(
            hue,
            saturation,
            100
        );

        const color=
            `rgb(${rgb.r},${rgb.g},${rgb.b})`;

        marker.style.background=color;

        marker.style.left=
            (50+Math.sin(angle*Math.PI/180)*
            saturation/2)+"%";

        marker.style.top=
            (50-Math.cos(angle*Math.PI/180)*
            saturation/2)+"%";

        callback(color);
    }

    let down=false;

    wheel.addEventListener("pointerdown",e=>{
        down=true;
        wheel.setPointerCapture?.(e.pointerId);
        update(e);
    });

    wheel.addEventListener("pointermove",e=>{
        if(down) update(e);
    });

    wheel.addEventListener("pointerup",()=>{
        down=false;
    });

    wheel.addEventListener("pointercancel",()=>{
        down=false;
    });
}

function createTable(rows,cols){

    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            const td=document.createElement("td");

            td.contentEditable="true";

    selection.addRange(r);

    saveSelection();
}

/* =====================================================
   SEARCH
===================================================== */

function clearSearch(){

    messages.querySelectorAll(
        ".search-word"
    ).forEach(mark=>{

        const parent=mark.parentNode;

        while(mark.firstChild){
            parent.insertBefore(
                mark.firstChild,
                mark
            );
        }

        mark.remove();
    });

    messages.querySelectorAll(
        ".search-highlight"
    ).forEach(el=>{
        el.classList.remove("search-highlight");
    });
}

function performSearch(){

    clearSearch();

    const query=searchInput.value.trim();

    if(!query){
        searchResult.textContent="";
        return;
    }

    const notes=[
        ...messages.querySelectorAll(".note")
    ];

    let noteCount=0;
    let resultCount=0;
    let first=null;

    notes.forEach(note=>{

        const content=
            note.querySelector(".note-content");

        if(!content) return;

        if(
            content.textContent
                .toLocaleLowerCase()
                .includes(query.toLocaleLowerCase())
        ){

            noteCount++;

            if(!first) first=note;

            const walker=
                document.createTreeWalker(
                    content,
                    NodeFilter.SHOW_TEXT
                );

            const nodes=[];

            let node;

            while(node=walker.nextNode()){
                if(
                    node.parentElement?.closest(
                        ".search-word"
                    )
                ) continue;

                if(
                    node.nodeValue
                        .toLocaleLowerCase()
                        .includes(
                            query.toLocaleLowerCase()
                        )
                ){
                    nodes.push(node);
                }
            }

            nodes.forEach(textNode=>{

                const text=textNode.nodeValue;
                const lower=text.toLocaleLowerCase();
                const q=query.toLocaleLowerCase();

                let index=lower.indexOf(q);

                if(index<0) return;

                const fragment=
                    document.createDocumentFragment();

                let last=0;

                while(index>=0){

                    fragment.appendChild(
                        document.createTextNode(
                            text.slice(last,index)
                        )
                    );

                    const mark=
                        document.createElement("span");

                    mark.className="search-word";

                    mark.textContent=
                        text.slice(
                            index,
                            index+query.length
                        );

                    fragment.appendChild(mark);

                    resultCount++;

                    last=index+query.length;

                    index=lower.indexOf(q,last);
                }

                fragment.appendChild(
                    document.createTextNode(
                        text.slice(last)
                    )
                );

                textNode.parentNode.replaceChild(
                    fragment,
                    textNode
                );
            });
        }
    });

    if(!first){

        searchResult.textContent=
            "لم يتم العثور على النص";

        return;
    }

    first.classList.add("search-highlight");

    first.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

    searchResult.textContent=
        `تم العثور على ${resultCount} نتيجة في ${noteCount} ملاحظة`;
}

function setupSearch(){

    on("searchButton","click",()=>{

        clearSearch();

        searchInput.value="";
        searchResult.textContent="";

        openOverlay(searchOverlay);

        setTimeout(
            ()=>searchInput.focus(),
            80
        );
    });

    searchInput.addEventListener(
        "input",
        performSearch
    );

    on("searchDone","click",()=>{

        clearSearch();
        closeOverlay(searchOverlay);
    });
}

    const height=messageMenu.offsetHeight||95;

        )
    );

        ){

    });

        const index=
            AppState.notes.findIndex(

        if(index<0) return;

        const old=AppState.notes[index];

        AppState.notes.splice(index,1);

        if(!saveNotes()){
            AppState.notes.splice(index,0,old);
            return;
        }

        if(AppState.editingId===id){
            resetEditor();
        }else{
            renderNotes();
        }

        closeMessageMenu();
    });
}


/* =====================================================
   SAVE
===================================================== */

function hasRealContent(){

    const clone=editor.cloneNode(true);

    clone.querySelectorAll("br")
        .forEach(br=>br.replaceWith(" "));

    const text=
        clone.textContent
            .replace(/\u200B/g,"")
            .replace(/\u00a0/g," ")
            .trim();

    return !!(
        text ||
        clone.querySelector(
            "table,.mind-map,.mind-tree"
        )
    );
}

function setupSave(){

    on("sendButton","click",()=>{

        if(!hasRealContent()) return;

        const html=
            editor.innerHTML
                .replace(/\u200B/g,"")
                .trim();

        if(AppState.editingId){

            const index=
                AppState.notes.findIndex(
                    n=>n.id===AppState.editingId
                );

            if(index<0) return;

            const old=AppState.notes[index].html;

            AppState.notes[index].html=html;

            if(!saveNotes()){
                AppState.notes[index].html=old;
                return;
            }

        }else{

            AppState.notes.push({
                id:createNoteId(),
                html
            });

            if(!saveNotes()){
                AppState.notes.pop();
                return;
            }
        }

        renderNotes();
        resetEditor();

        setTimeout(()=>{
            messages.scrollTop=
                messages.scrollHeight;
        },30);
    });
}


/* =====================================================
   RESET
===================================================== */

function resetEditor(){

    AppState.editingId=null;
    AppState.selectedNoteId=null;
    AppState.savedRange=null;

    AppState.fontSize=8;
    AppState.alignment="right";

    AppState.bold=false;
    AppState.italic=false;
    AppState.underline=false;

    AppState.listType=null;

    AppState.textColor=null;
    AppState.colorActive=false;
    AppState.highlightActive=false;

    editor.innerHTML="";
    state.textContent="رسالة جديدة";

    closeSubToolbars();

    updateToolbar();
    renderNotes();
}

on("cancelButton","click",resetEditor);

on("newButton","click",()=>{
    resetEditor();
    editor.focus();
});


/* =====================================================
   PASTE
===================================================== */

editor.addEventListener("paste",e=>{

    e.preventDefault();

    const text=
        e.clipboardData?.getData("text/plain")||"";

    prepareSelection();

    const range=getEditorRange();

    if(!range) return;

    const fragment=
        document.createDocumentFragment();

    text.split(/\r?\n/)
        .forEach((line,i)=>{

            if(i){
                fragment.appendChild(
                    document.createElement("br")
                );
            }

            fragment.appendChild(
                document.createTextNode(line)
            );
        });

    range.deleteContents();
    range.insertNode(fragment);
    range.collapse(false);

    saveSelection();
});


/* =====================================================
   TABLE TAB
===================================================== */

editor.addEventListener("keydown",e=>{

    if(e.key!=="Tab") return;

    const cell=e.target.closest?.("td,th");

    if(!cell) return;

    e.preventDefault();

    const cells=[
        ...editor.querySelectorAll("td,th")
    ];

    const index=cells.indexOf(cell);

    if(index<0) return;

    const next=
        cells[
            (index+(e.shiftKey?-1:1)+cells.length)
            %cells.length
        ];

    next.focus();

    const range=document.createRange();

    range.selectNodeContents(next);
    range.collapse(false);

    const selection=window.getSelection();

    selection.removeAllRanges();
    selection.addRange(range);

    saveSelection();
});


/* =====================================================
   OVERLAY / ESC
===================================================== */

document.querySelectorAll(".overlay")
    .forEach(overlay=>{

        overlay.addEventListener("click",e=>{

            if(e.target===overlay){
                closeOverlay(overlay);
            }

        });
    });

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){

        document.querySelectorAll(
            ".overlay.open"
        ).forEach(closeOverlay);

        closeMessageMenu();
        closeSubToolbars();
    }
});


/* =====================================================
   COLOR WHEELS
===================================================== */

setupColorWheel(
    $("textColorWheel"),
    $("textColorMarker"),
    color=>{
        AppState.textColor=color;
    }
);

setupColorWheel(
    $("highlightColorWheel"),
    $("highlightColorMarker"),
    color=>{
        AppState.highlightColor=color;
    }
);


/* =====================================================
   KEYBOARD / VISUAL VIEWPORT
===================================================== */

(function(){

    const vv=window.visualViewport;

    if(!vv) return;

    const root=document.documentElement;
    const composer=document.querySelector(".editor-area");

    function update(){

        const keyboard=Math.max(
            0,
            window.innerHeight-vv.height-vv.offsetTop
        );

        const open=keyboard>80;

        root.style.setProperty(
            "--keyboard-height",
            Math.round(keyboard)+"px"
        );

        root.style.setProperty(
            "--app-height",
            Math.round(vv.height)+"px"
        );

        document.body.classList.toggle(
            "keyboard-open",
            open
        );

        if(open){

            composer.style.position="fixed";
            composer.style.left="0";
            composer.style.right="0";
            composer.style.bottom=
                keyboard+"px";
            composer.style.zIndex="900";

        }else{

            composer.style.position="";
            composer.style.left="";
            composer.style.right="";
            composer.style.bottom="";
            composer.style.zIndex="";
        }
    }

    vv.addEventListener(
        "resize",
        update,
        {passive:true}
    );

    vv.addEventListener(
        "scroll",
        update,
        {passive:true}
    );

    window.addEventListener(
        "resize",
        update,
        {passive:true}
    );

    update();

})();


/* =====================================================
   INIT
===================================================== */

function init(){

    initDOM();
    loadNotes();

    setupEditor();
    setupBasicFormatting();

    buildFontSizeBar();
    setupFontSize();

    setupLists();
    setupAlignment();

    setupColor();
    setupHighlight();

    setupTable();
    setupMindMap();
    setupTree();
    setupSearch();

    setupMessageMenu();
    setupSave();

    renderNotes();
    updateTableInfo();
    updateToolbar();
}

if(document.readyState==="loading"){

    document.addEventListener(
        "DOMContentLoaded",
        init,
        {once:true}
    );

}else{
    init();
}
