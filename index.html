
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>ملاحظاتي</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#101218;
  color:#fff;
}

button{
  font-family:inherit;
  touch-action:manipulation;
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.header{
  height:56px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  background:#191c24;
  border-bottom:1px solid #343944;
}

.title{
  flex:1;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

.icon{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#292e39;
  color:#fff;
  font-size:20px;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:10px;
  -webkit-overflow-scrolling:touch;
}

.empty{
  text-align:center;
  color:#777;
  margin-top:30vh;
}

.note{
  background:#20242d;
  border-radius:14px;
  padding:11px 13px;
  margin-bottom:9px;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.note-menu{
  float:left;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#aaa;
  font-size:20px;
}

.editor-area{
  flex-shrink:0;
  background:#191c24;
  border-top:1px solid #343944;
  padding:5px 7px calc(8px + env(safe-area-inset-bottom));
}

.edit-state{
  height:28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#aaa;
  font-size:12px;
}

.cancel{
  width:34px;
  height:28px;
  border:0;
  background:transparent;
  color:#aaa;
  font-size:21px;
}

.toolbar{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:3px 0 7px;
  scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
  display:none;
}

.tool{
  flex:0 0 39px;
  width:39px;
  height:39px;
  border:1px solid #444955;
  border-radius:10px;
  background:#292e39;
  color:#fff;
  font-size:17px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.tool.active{
  background:#315fae;
}

.bold{
  font-weight:900;
}

.underline{
  text-decoration:underline;
  text-decoration-thickness:2px;
  text-underline-offset:7px;
}

/* ==========================
   شريط المحاذاة
========================== */

.align-bar{
  display:none;
  align-items:center;
  gap:5px;
  overflow-x:auto;
  padding:2px 0 6px;
  scrollbar-width:none;
}

.align-bar::-webkit-scrollbar{
  display:none;
}

/* ==========================
   شريط حجم الخط
========================== */

.size-bar{
  display:none;
  align-items:center;
  gap:5px;
  overflow-x:auto;
  padding:2px 0 6px;
  scrollbar-width:none;
  direction:ltr;
}

.size-bar::-webkit-scrollbar{
  display:none;
}

.size-item{
  flex:0 0 34px;
  width:34px;
  height:32px;
  border:1px solid #444955;
  border-radius:8px;
  background:#2a2f39;
  color:#fff;
  font-size:13px;
  padding:0;
}

.size-item.active{
  background:#315fae;
  border-color:#5d8fff;
}

/* ==========================
   شريط القوائم
========================== */

.list-bar{
  display:none;
  align-items:center;
  gap:5px;
  padding:2px 0 6px;
}

.mini-tool{
  flex:0 0 39px;
  width:39px;
  height:34px;
  border:1px solid #444955;
  border-radius:9px;
  background:#292e39;
  color:#fff;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mini-tool:active{
  background:#315fae;
}

/* ==========================
   رموز المحاذاة
========================== */

.align-button{
  position:relative;
}

.align-icon{
  width:22px;
  height:17px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.align-icon span{
  display:block;
  height:2px;
  background:#fff;
  border-radius:2px;
}

.align-icon.right span:nth-child(1){
  width:22px;
  margin-left:auto;
}

.align-icon.right span:nth-child(2){
  width:15px;
  margin-left:auto;
}

.align-icon.right span:nth-child(3){
  width:19px;
  margin-left:auto;
}

.align-icon.center span:nth-child(1){
  width:22px;
  margin:auto;
}

.align-icon.center span:nth-child(2){
  width:15px;
  margin:auto;
}

.align-icon.center span:nth-child(3){
  width:19px;
  margin:auto;
}

.align-icon.left span:nth-child(1){
  width:22px;
  margin-right:auto;
}

.align-icon.left span:nth-child(2){
  width:15px;
  margin-right:auto;
}

.align-icon.left span:nth-child(3){
  width:19px;
  margin-right:auto;
}

.write-row{
  display:flex;
  align-items:flex-end;
  gap:6px;
}

.editor{
  flex:1;
  min-width:0;
  min-height:48px;
  max-height:170px;
  overflow-y:auto;
  padding:9px 11px;
  border:1px solid #464b57;
  border-radius:12px;
  outline:none;
  background:#0e1015;
  color:#fff;
  line-height:1.7;
  font-size:18px;
  overflow-wrap:anywhere;
  user-select:text;
  -webkit-user-select:text;
}

.editor:empty::before{
  content:"اكتبي ملاحظتك هنا...";
  color:#666;
}

.editor u{
  text-underline-offset:7px;
  text-decoration-thickness:2px;
}

.send{
  flex:0 0 47px;
  width:47px;
  height:47px;
  border:0;
  border-radius:50%;
  background:#3471f6;
  color:#fff;
  font-size:21px;
}

/* ==========================
   النوافذ
========================== */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.58);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.panel{
  width:min(94vw,350px);
  max-height:86vh;
  overflow:auto;
  background:#20242d;
  border:1px solid #444955;
  border-radius:17px;
  padding:15px;
  box-shadow:0 15px 50px #000b;
}

.panel-title{
  text-align:center;
  font-weight:bold;
  margin-bottom:12px;
}

/* ==========================
   عجلة اللون
========================== */

.wheel-box{
  width:250px;
  height:250px;
  max-width:72vw;
  max-height:72vw;
  position:relative;
  margin:10px auto 15px;
  touch-action:none;
}

.wheel{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    conic-gradient(
      red,
      yellow,
      lime,
      cyan,
      blue,
      magenta,
      red
    );
}

.wheel::after{
  content:"";
  position:absolute;
  inset:20%;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      white 0%,
      rgba(255,255,255,.7) 35%,
      rgba(255,255,255,0) 75%
    );
}

.marker{
  position:absolute;
  width:23px;
  height:23px;
  border:3px solid white;
  border-radius:50%;
  box-shadow:0 0 0 2px #000;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.range-title{
  text-align:center;
  color:#ccc;
  margin-bottom:5px;
}

.range{
  width:100%;
  accent-color:#4c80ff;
}

.panel-button{
  width:100%;
  height:43px;
  border:0;
  border-radius:10px;
  background:#303642;
  color:#fff;
  margin-top:10px;
}

/* ==========================
   الجدول
========================== */

.editor table,
.note table{
  width:100%;
  max-width:100%;
  border-collapse:collapse;
  table-layout:auto;
  margin:8px 0;
}

.editor td,
.editor th,
.note td,
.note th{
  border:1px solid #666d7b;
  padding:7px 9px;
  min-width:45px;
  min-height:34px;
  vertical-align:top;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.editor td:focus,
.editor th:focus{
  outline:1px solid #3471f6;
}

/* ==========================
   الخريطة الذهنية
========================== */

.mind-map{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  margin:10px 0;
}

.mind-center{
  width:fit-content;
  max-width:100%;
  padding:9px 15px;
  border:1px solid #5579bd;
  border-radius:12px;
  background:#263657;
  text-align:center;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.mind-branches{
  width:100%;
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(120px,1fr));
  gap:9px;
}

.mind-branch{
  min-width:0;
  padding:8px 10px;
  border:1px solid #555d6d;
  border-radius:10px;
  background:#292e39;
  text-align:center;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.mind-input{
  width:100%;
  height:43px;
  border:1px solid #464b57;
  border-radius:10px;
  background:#0e1015;
  color:#fff;
  padding:8px 10px;
  outline:none;
  margin-bottom:7px;
}

.mind-input:focus{
  border-color:#3471f6;
}

/* ==========================
   قائمة الرسالة
========================== */

.menu{
  display:none;
  position:fixed;
  z-index:1000;
  min-width:135px;
  padding:5px;
  background:#20242d;
  border:1px solid #444955;
  border-radius:11px;
  box-shadow:0 10px 35px #000b;
}

.menu button{
  display:block;
  width:100%;
  min-height:42px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#fff;
  text-align:right;
  padding:0 10px;
}

/* ==========================
   البحث
========================== */

.search-input{
  width:100%;
  height:45px;
  border:1px solid #464b57;
  border-radius:10px;
  background:#0e1015;
  color:#fff;
  padding:8px 10px;
  outline:none;
  font-size:16px;
}

.search-result{
  margin-top:10px;
  color:#aaa;
  text-align:center;
  font-size:13px;
}

.search-highlight{
  outline:2px solid #3471f6;
  outline-offset:2px;
}

@media(max-width:420px){

  .panel{
    width:94vw;
  }

  .wheel-box{
    width:220px;
    height:220px;
  }

  .mind-branches{
    grid-template-columns:
      repeat(auto-fit,minmax(105px,1fr));
  }

}
</style>
</head>

<body>

<script>
"use strict";

/* ==========================
   البيانات
========================== */

const STORAGE =
"notes_clean_editor_v2";

let notes =
JSON.parse(
localStorage.getItem(STORAGE) || "[]"
);

let editingIndex = -1;
let selectedIndex = -1;
let savedRange = null;


/* ==========================
   العناصر
========================== */

const editor =
document.getElementById("editor");

const messages =
document.getElementById("messages");

const state =
document.getElementById("state");

const messageMenu =
document.getElementById("messageMenu");

const sizeBar =
document.getElementById("sizeBar");

const listBar =
document.getElementById("listBar");

const alignBar =
document.getElementById("alignBar");


/* ==========================
   حجم الكتابة الحالي
========================== */

let currentFontSize = 18;


/* ==========================
   التخزين
========================== */

function saveNotes(){

localStorage.setItem(
STORAGE,
JSON.stringify(notes)
);

}


/* ==========================
   عرض الملاحظات
========================== */

function render(){

messages.innerHTML = "";

if(notes.length === 0){

messages.innerHTML =
'<div class="empty">لا توجد ملاحظات بعد</div>';

return;

}

notes.forEach((note,index)=>{

const box =
document.createElement("div");

box.className = "note";

const menu =
document.createElement("button");

menu.className = "note-menu";
menu.textContent = "⋮";

menu.addEventListener(
"click",
function(event){

event.stopPropagation();

selectedIndex = index;

openMessageMenu(
event.clientX,
event.clientY
);

});

box.appendChild(menu);

const content =
document.createElement("div");

content.innerHTML =
note.html;

box.appendChild(content);

messages.appendChild(box);

});

}


/* ==========================
   قائمة الرسالة
========================== */

function openMessageMenu(x,y){

messageMenu.style.display =
"block";

let left = x - 140;
let top = y;

if(left < 5){
left = 5;
}

if(left + 140 > window.innerWidth){
left = window.innerWidth - 145;
}

if(top + 100 > window.innerHeight){
top = window.innerHeight - 110;
}

messageMenu.style.left =
left + "px";

messageMenu.style.top =
top + "px";

}


document.addEventListener(
"click",
function(event){

if(
!event.target.closest(".menu") &&
!event.target.closest(".note-menu")
){

messageMenu.style.display =
"none";

}

});


/* ==========================
   حفظ واسترجاع التحديد
========================== */

function selectionIsInsideEditor(range){

if(!range){
return false;
}

return (
editor.contains(range.startContainer) &&
editor.contains(range.endContainer)
);

}


function saveSelection(){

const selection =
window.getSelection();

if(
selection &&
selection.rangeCount > 0
){

const range =
selection.getRangeAt(0);

if(selectionIsInsideEditor(range)){

savedRange =
range.cloneRange();

}

}

}


function restoreSelection(){

if(
!savedRange ||
!selectionIsInsideEditor(savedRange)
){

return false;

}

const selection =
window.getSelection();

selection.removeAllRanges();

selection.addRange(
savedRange
);

return true;

}


/* ==========================
   التركيز
========================== */

function focusEditor(){

editor.focus();

restoreSelection();

}


/* ==========================
   تنفيذ أمر
========================== */

function command(
name,
value = null
){

focusEditor();

document.execCommand(
name,
false,
value
);

saveSelection();

}


/* ==========================
   إغلاق أشرطة الاختيار
========================== */

function closeChoiceBars(){

sizeBar.style.display =
"none";

listBar.style.display =
"none";

alignBar.style.display =
"none";

}


/* ==========================
   B
========================== */

document
.getElementById("boldButton")
.addEventListener(
"click",
function(){

saveSelection();

command("bold");

});


/* ==========================
   I
========================== */

document
.getElementById("italicButton")
.addEventListener(
"click",
function(){

saveSelection();

command("italic");

});


/* ==========================
   التسطير
========================== */

document
.getElementById("underlineButton")
.addEventListener(
"click",
function(){

saveSelection();

command("underline");

});


/* ==========================
   حفظ التحديد
========================== */

editor.addEventListener(
"mouseup",
saveSelection
);

editor.addEventListener(
"keyup",
saveSelection

function getWheelColor(
wheel,
marker,
event
){

const rect =
wheel.getBoundingClientRect();

const cx =
rect.left + rect.width / 2;

const cy =
rect.top + rect.height / 2;

let dx =
event.clientX - cx;

let dy =
event.clientY - cy;

const radius =
rect.width / 2;

let distance =
Math.sqrt(
dx * dx + dy * dy
);

if(distance > radius){

dx =
dx / distance * radius;

dy =
dy / distance * radius;

}

let angle =
Math.atan2(dy,dx) *
180 /
Math.PI;

angle =
(angle + 360) % 360;

const saturation =
Math.max(
45,
Math.min(
100,
distance / radius * 100
)
);

const color =
`hsl(${angle},${saturation}%,50%)`;

marker.style.left =
(radius + dx) + "px";

marker.style.top =
(radius + dy) + "px";

return color;

}

function hexWithOpacity(
color,
opacity
){

const temp =
document.createElement("span");

temp.style.color =
color;

document.body.appendChild(temp);

getComputedStyle(temp).color;

const match =

}

return `rgba(

${match[1]},
${match[2]},
${opacity}
)`;

}

function createTable(
rows,
cols
){

const table =
document.createElement("table");

const tbody =
document.createElement("tbody");

for(
let r = 0;
r < rows;
r++
){

const tr =
document.createElement("tr");

for(
let c = 0;
c < cols;
c++
){

const td =
document.createElement("td");

td.contentEditable =
"true";

td.innerHTML =
"<br>";

tr.appendChild(td);

}

tbody.appendChild(tr);

}

table.appendChild(tbody);

return table;

}
