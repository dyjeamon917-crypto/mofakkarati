<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">

<title>ملاحظاتي</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#101218;
    color:#fff;
}

body{
    -webkit-text-size-adjust:100%;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    touch-action:manipulation;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:default;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.header{
    height:56px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    background:#191c24;
    border-bottom:1px solid #343944;
}

.title{
    flex:1;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.icon{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#292e39;
    color:#fff;
    font-size:20px;
}

.icon:active,
.tool:active,
.send:active,
.panel-button:active,
.list-choice button:active,
.align-item:active,
.font-size-item:active,
.note-menu:active{
    transform:scale(.96);
}

button:focus-visible{
    outline:2px solid #5f8fe8;
    outline-offset:2px;
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
}

.empty{
    text-align:center;
    color:#777;
    margin-top:30vh;
}

.note{
    background:#20242d;
    border-radius:14px;
    padding:11px 13px;
    margin-bottom:9px;
    line-height:1.7;
    overflow-wrap:anywhere;
    word-break:break-word;
    position:relative;
}

.note-menu{
    float:left;
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#aaa;
    font-size:20px;
}

.note-menu:hover{
    background:#292e39;
}

.note-content{
    min-width:0;
}

.note:after{
    content:"";
    display:block;
    clear:both;
}

.note table{
    display:block;
    max-width:100%;
    overflow-x:auto;
}

.note img{
    max-width:100%;
    height:auto;
}

.note table{
    width:max-content;
    max-width:100%;
    border-collapse:collapse;
    table-layout:auto;
    margin:8px 0;
}

.note td,
.note th{
    border:1px solid #666d7b;
    padding:7px 9px;
    min-width:45px;
    height:34px;
    vertical-align:top;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.editor-area{
    flex-shrink:0;
    background:#191c24;
    border-top:1px solid #343944;
    padding:5px 7px calc(8px + env(safe-area-inset-bottom));
}

.edit-state{
    height:28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#aaa;
    font-size:12px;
}

.cancel{
    width:34px;
    height:28px;
    border:0;
    background:transparent;
    color:#aaa;
    font-size:21px;
}

.toolbar{
    display:flex;
    gap:5px;
    overflow-x:auto;
    padding:3px 0 7px;
    scrollbar-width:none;
    overscroll-behavior:contain;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 39px;
    width:39px;
    height:39px;
    border:1px solid #444955;
    border-radius:10px;
    background:#292e39;
    color:#fff;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.tool.active{
    background:#315fae;
    border-color:#5f8fe8;
    box-shadow:0 0 0 2px rgba(52,113,246,.25);
}

.bold{
    font-weight:900;
}

.underline{
    text-decoration:underline;
    text-decoration-thickness:2px;
    text-underline-offset:7px;
}

.write-row{
    display:flex;
    align-items:flex-end;
    gap:6px;
}

.editor{
    flex:1;
    min-width:0;
    min-height:48px;
    max-height:170px;
    overflow-y:auto;
    padding:9px 11px;
    border:1px solid #464b57;
    border-radius:12px;
    outline:none;
    background:#0e1015;
    color:#fff;
    line-height:1.7;
    overflow-wrap:anywhere;
    word-break:break-word;
    white-space:pre-wrap;
    user-select:text;
    -webkit-user-select:text;
    direction:rtl;
    text-align:right;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    caret-color:#fff;
}

.editor:empty::before{
    content:"اكتبي ملاحظتك هنا...";
    color:#666;
}

.editor img{
    max-width:100%;
    height:auto;
}

.editor u{
    text-underline-offset:7px;
    text-decoration-thickness:2px;
}

.editor table{
    width:max-content;
    max-width:100%;
    border-collapse:collapse;
    table-layout:auto;
    margin:8px 0;
}

.editor td,
.editor th{
    border:1px solid #666d7b;
    padding:7px 9px;
    min-width:45px;
    height:34px;
    vertical-align:top;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.editor td:focus,
.editor th:focus{
    outline:1px solid #3471f6;
}

.editor td,
.editor th{
    direction:rtl;
    text-align:right;
}

.send{
    flex:0 0 47px;
    width:47px;
    height:47px;
    border:0;
    border-radius:50%;
    background:#3471f6;
    color:#fff;
    font-size:21px;
}

.font-size-bar,
.alignment-bar{
    display:none;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    scrollbar-width:none;
    padding:3px 0 7px;
    overscroll-behavior:contain;
}

.font-size-bar{
    direction:ltr;
}

.font-size-bar::-webkit-scrollbar,
.alignment-bar::-webkit-scrollbar{
    display:none;
}

.font-size-item{
    flex:0 0 34px;
    width:34px;
    height:32px;
    border:1px solid #444955;
    border-radius:8px;
    background:#292e39;
    color:#fff;
    font-size:13px;
    padding:0;
}

.font-size-item.active{
    background:#315fae;
    border-color:#6b98ef;
}

.alignment-bar{
    direction:rtl;
}

.align-item{
    flex:0 0 36px;
    width:36px;
    height:32px;
    border:1px solid #444955;
    border-radius:8px;
    background:#292e39;
    color:#fff;
    font-size:16px;
    padding:0;
}

.align-item.active{
    background:#315fae;
    border-color:#6b98ef;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.58);
    align-items:center;
    justify-content:center;
    padding:15px;
    overscroll-behavior:contain;
}

.panel{
    width:min(94vw,350px);
    max-height:86vh;
    overflow:auto;
    background:#20242d;
    border:1px solid #444955;
    border-radius:17px;
    padding:15px;
    box-shadow:0 15px 50px #000b;
    overscroll-behavior:contain;
}

.panel-title{
    text-align:center;
    font-weight:bold;
    margin-bottom:12px;
}

.color-picker{
    width:270px;
    max-width:78vw;
    margin:10px auto 15px;
}

.color-wheel{
    position:relative;
    width:250px;
    height:250px;
    max-width:72vw;
    max-height:72vw;
    margin:auto;
    touch-action:none;
    border-radius:50%;
    overflow:hidden;
}

.hue-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(
        red,
        yellow,
        lime,
        cyan,
        blue,
        magenta,
        red
    );
}

.sv-area{
    position:absolute;
    inset:13%;
    border-radius:50%;
    overflow:hidden;
    background:
        linear-gradient(
            to right,
            #fff,
            hsl(var(--hue),100%,50%)
        );
}

.sv-white{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to right,
            rgba(255,255,255,1),
            rgba(255,255,255,0)
        );
}

.sv-black{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0),
            rgba(0,0,0,1)
        );
}

.color-marker{
    position:absolute;
    width:21px;
    height:21px;
    border:3px solid white;
    border-radius:50%;
    box-shadow:0 0 0 2px #000,0 0 4px #000;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:10;
}

.hue-marker{
    position:absolute;
    width:19px;
    height:19px;
    border:3px solid white;
    border-radius:50%;
    box-shadow:0 0 0 2px #000;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:11;
}

.color-presets{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:10px;
}

.color-preset{
    width:36px;
    height:36px;
    border:2px solid #666;
    border-radius:50%;
}

.black-preset{
    background:#000;
}

.white-preset{
    background:#fff;
}

.range-title{
    text-align:center;
    color:#ccc;
    margin-bottom:5px;
}

.range{
    width:100%;
    accent-color:#4c80ff;
}

.panel-button{
    width:100%;
    height:43px;
    border:0;
    border-radius:10px;
    background:#303642;
    color:#fff;
    margin-top:10px;
}

.highlight-actions{
    display:flex;
    gap:7px;
}

.highlight-actions button{
    flex:1;
}

.list-choice{
    display:flex;
    gap:7px;
}

.list-choice button{
    flex:1;
    min-height:48px;
    border:1px solid #444955;
    border-radius:10px;
    background:#2a2f39;
    color:#fff;
}

.mind-map{
    width:100%;
    max-width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin:10px 0;
}

.mind-center{
    width:fit-content;
    max-width:90%;
    padding:9px 15px;
    border:1px solid #5579bd;
    border-radius:12px;
    background:#263657;
    text-align:center;
    overflow-wrap:anywhere;
    word-break:break-word;
    white-space:pre-wrap;
}

.mind-branches{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
}

.mind-branch{
    width:auto;
    max-width:45%;
    min-width:80px;
    padding:8px 10px;
    border:1px solid #555d6d;
    border-radius:10px;
    background:#292e39;
    text-align:center;
    overflow-wrap:anywhere;
    word-break:break-word;
    white-space:pre-wrap;
    line-height:1.6;
}

.mind-input{
    width:100%;
    min-height:43px;
    max-height:130px;
    border:1px solid #464b57;
    border-radius:10px;
    background:#0e1015;
    color:#fff;
    padding:8px 10px;
    outline:none;
    margin-bottom:7px;
    font-family:inherit;
    font-size:16px;
    line-height:1.6;
    resize:vertical;
    direction:rtl;
    text-align:right;
    white-space:pre-wrap;
    overflow-y:auto;
}

.mind-input:focus{
    border-color:#3471f6;
}

.menu{
    display:none;
    position:fixed;
    z-index:1000;
    min-width:135px;
    padding:5px;
    background:#20242d;
    border:1px solid #444955;
    border-radius:11px;
    box-shadow:0 10px 35px #000b;
}

.menu button{
    display:block;
    width:100%;
    min-height:42px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:#fff;
    text-align:right;
    padding:0 10px;
}

.menu button:hover{
    background:#292e39;
}

.search-input{
    width:100%;
    height:45px;
    border:1px solid #464b57;
    border-radius:10px;
    background:#0e1015;
    color:#fff;
    padding:8px 10px;
    outline:none;
    font-size:16px;
}

.search-result{
    margin-top:10px;
    color:#aaa;
    text-align:center;
    font-size:13px;
}

.search-highlight{
    outline:2px solid #3471f6;
    outline-offset:2px;
}

.search-word{
    background:rgba(255,214,0,.45);
    border-radius:3px;
    padding:0 2px;
}

@media(max-width:420px){

    .panel{
        width:94vw;
    }

    .color-wheel{
        width:220px;
        height:220px;
    }

    .mind-branch{
        min-width:70px;
        max-width:45%;
    }

    .editor{
        max-height:155px;
    }
}

@media(max-height:650px){

    .panel{
        max-height:92vh;
    }

    .editor{
        max-height:125px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

<button
    class="icon"
    id="searchButton"
    type="button"
    aria-label="بحث"
>⌕</button>

<div class="title">ملاحظاتي</div>

<button
    class="icon"
    id="newButton"
    type="button"
    aria-label="ملاحظة جديدة"
>＋</button>

</header>

<main
    class="messages"
    id="messages"
></main>

<section class="editor-area">

<div class="edit-state">

<span id="state">رسالة جديدة</span>

<button
    class="cancel"
    id="cancelButton"
    type="button"
    aria-label="إلغاء"
>×</button>

</div>

<div class="toolbar">

<button
    class="tool bold"
    id="boldButton"
    type="button"
    title="عريض"
>B</button>

<button
    class="tool"
    id="italicButton"
    type="button"
    title="مائل"
><i>I</i></button>

<button
    class="tool underline"
    id="underlineButton"
    type="button"
    title="تحته خط"
>U</button>

<button
    class="tool"
    id="colorButton"
    type="button"
    title="لون الخط"
>●</button>

<button
    class="tool"
    id="highlightButton"
    type="button"
    title="تمييز"
>▰</button>

<button
    class="tool"
    id="sizeButton"
    type="button"
    title="حجم الخط"
>A↕</button>

<button
    class="tool"
    id="listButton"
    type="button"
    title="قائمة"
>☷</button>

<button
    class="tool"
    id="alignmentButton"
    type="button"
    title="المحاذاة"
>☰</button>

<button
    class="tool"
    id="tableButton"
    type="button"
    title="جدول"
>▦</button>

<button
    class="tool"
    id="mindMapButton"
    type="button"
    title="خريطة ذهنية"
>🧠</button>

</div>

<div
    class="font-size-bar"
    id="fontSizeBar"
></div>

<div
    class="font-size-bar"
    id="listBar"
></div>

<div
    class="alignment-bar"
    id="alignmentBar"
>

<button
    class="align-item"
    data-align="right"
    type="button"
    title="محاذاة لليمين"
>≡</button>

<button
    class="align-item"
    data-align="center"
    type="button"
    title="توسيط"
>≣</button>

<button
    class="align-item"
    data-align="left"
    type="button"
    title="محاذاة لليسار"
>≡</button>

</div>

<div class="write-row">

<div
    class="editor"
    id="editor"
    contenteditable="true"
    spellcheck="true"
    role="textbox"
    aria-multiline="true"
></div>

<button
    class="send"
    id="sendButton"
    type="button"
    aria-label="حفظ"
>➤</button>

</div>

</section>
</div>


<!-- لون الخط -->

<div
    class="overlay"
    id="colorOverlay"
>

<div class="panel">

<div class="panel-title">
    لون الخط
</div>

<div class="color-picker">

<div
    class="color-wheel"
    id="textColorWheel"
    style="--hue:0"
>

<div class="hue-ring"></div>

<div class="sv-area">
<div class="sv-white"></div>
<div class="sv-black"></div>
</div>

<div
    class="hue-marker"
    id="textHueMarker"
></div>

<div
    class="color-marker"
    id="textColorMarker"
></div>

</div>

<div class="color-presets">

<button
    class="color-preset black-preset"
    id="blackText"
    type="button"
    title="أسود"
    aria-label="أسود"
></button>

<button
    class="color-preset white-preset"
    id="whiteText"
    type="button"
    title="أبيض"
    aria-label="أبيض"
></button>

</div>
</div>

<button
    class="panel-button"
    id="colorDone"
    type="button"
>تم</button>

</div>
</div>


<!-- التمييز -->

<div
    class="overlay"
    id="highlightOverlay"
>

<div class="panel">

<div class="panel-title">
    تمييز النص
</div>

<div class="color-picker">

<div
    class="color-wheel"
    id="highlightColorWheel"
    style="--hue:60"
>

<div class="hue-ring"></div>

<div class="sv-area">
<div class="sv-white"></div>
<div class="sv-black"></div>
</div>

<div
    class="hue-marker"
    id="highlightHueMarker"
></div>

<div
    class="color-marker"
    id="highlightColorMarker"
></div>

</div>
</div>

<div class="range-title">
    شدة التمييز
</div>

<input
    class="range"
    id="opacityRange"
    type="range"
    min="10"
    max="100"
    value="60"
>

<div class="highlight-actions">

<button
    class="panel-button"
    id="removeHighlight"
    type="button"
>بدون تمييز</button>

<button
    class="panel-button"
    id="highlightDone"
    type="button"
>تم</button>

</div>
</div>
</div>


<!-- الجدول -->

<div
    class="overlay"
    id="tableOverlay"
>

<div class="panel">

<div class="panel-title">
    إدراج جدول
</div>

<div class="list-choice">

<button
    id="tableRowsMinus"
    type="button"
>− الصفوف</button>

<button
    id="tableRowsPlus"
    type="button"
>＋ الصفوف</button>

</div>

<div
    class="list-choice"
    style="margin-top:7px"
>

<button
    id="tableColsMinus"
    type="button"
>− الأعمدة</button>

<button
    id="tableColsPlus"
    type="button"
>＋ الأعمدة</button>

</div>

<div
    id="tableInfo"
    style="text-align:center;margin-top:10px;color:#ccc"
>
3 × 3
</div>

<button
    class="panel-button"
    id="tableDone"
    type="button"
>إدراج</button>

</div>
</div>


<!-- الخريطة الذهنية -->

<div
    class="overlay"
    id="mindMapOverlay"
>

<div class="panel">

<div class="panel-title">
    خريطة ذهنية
</div>

<textarea
    class="mind-input"
    id="mindCenterInput"
    placeholder="الفكرة الرئيسية"
    rows="2"
></textarea>

<div id="mindBranches"></div>

<button
    class="panel-button"
    id="mindAdd"
    type="button"
>＋ إضافة فرع</button>

<button
    class="panel-button"
    id="mindDone"
    type="button"
>إدراج</button>

</div>
</div>


<!-- البحث -->

<div
    class="overlay"
    id="searchOverlay"
>

<div class="panel">

<div class="panel-title">
    بحث
</div>

<input
    class="search-input"
    id="searchInput"
    type="search"
    placeholder="اكتبي النص الذي تريدين البحث عنه"
    autocomplete="off"
>

<div
    class="search-result"
    id="searchResult"
></div>

<button
    class="panel-button"
    id="searchDone"
    type="button"
>تم</button>

</div>
</div>


<!-- قائمة الملاحظة -->

<div
    class="menu"
    id="messageMenu"
>

<button
    id="editButton"
    type="button"
>✎ تعديل</button>

<button
    id="deleteButton"
    type="button"
>🗑 حذف</button>

</div>


<script>
"use strict";

/* =========================================================
   التخزين والحالة
========================================================= */

const STORAGE = "notes_clean_editor_v5";

let notes = [];

try {

    const stored =
        localStorage.getItem(STORAGE);

    const parsed =
        stored
            ? JSON.parse(stored)
            : [];

    if (Array.isArray(parsed)) {

        notes = parsed.filter(function(note){

            return (
                note &&
                typeof note === "object" &&
                typeof note.html === "string"
            );

        });

    }

} catch(error){

    console.error(

/* =========================================================
   Selection / Range
========================================================= */

/*
    هذه الدوال هي أهم جزء تم إصلاحه.
    الهدف هو الاحتفاظ بالتحديد الحقيقي داخل المحرر
    حتى بعد فتح نافذة لون / تمييز / جدول / حجم.
*/

function nodeIsInsideEditor(node){

    if(!node){
        return false;
    }

    if(node === editor){
        return true;
    }

    return editor.contains(node);
}


function rangeBelongsToEditor(range){

    if(!range){
        return false;
    }

    return (
        nodeIsInsideEditor(
            range.startContainer
        ) &&
        nodeIsInsideEditor(
            range.endContainer
        )
    );
}


function saveSelection(){

    const selection =
        window.getSelection();

    if(
        !selection ||
        selection.rangeCount === 0
    ){
        return false;
    }


    const range =
        selection.getRangeAt(0);


    if(
        !rangeBelongsToEditor(range)
    ){

        return false;
    }


    savedRange =
        range.cloneRange();

    return true;
}


function restoreSelection(){

    if(!savedRange){

        return false;
    }


    if(
        !rangeBelongsToEditor(
            savedRange
        )
    ){

        savedRange = null;

        return false;
    }


    try{

        const selection =
            window.getSelection();

        selection.removeAllRanges();

        selection.addRange(
            savedRange
        );

        return true;

    }catch(error){

        console.error(
            "تعذر استعادة التحديد:",
            error
        );

        savedRange = null;

        return false;
    }
}


function focusEditor(){

    editor.focus();

    restoreSelection();
}


/*
    إذا لم يكن هناك تحديد محفوظ،
    نضع المؤشر في نهاية المحرر.
*/

function focusEditorAtEnd(){

    editor.focus();

    const range =
        document.createRange();

    range.selectNodeContents(editor);
    range.collapse(false);

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(range);

    savedRange =
        range.cloneRange();
}

/* =========================================================
   معرفة العنصر عند المؤشر
========================================================= */

function getSelectionElement(){

    const selection =
        window.getSelection();

    if(
        !selection ||
        selection.rangeCount === 0
    ){

        return null;
    }


    let node =
        selection.anchorNode;


    if(
        node &&
        node.nodeType === Node.TEXT_NODE
    ){

        node =
            node.parentElement;
    }


    if(
        !node ||
        !nodeIsInsideEditor(node)
    ){

        return null;
    }


    return node;
}


/* =========================================================
   حجم الخط الحالي
========================================================= */

function detectCurrentFontSize(){

    const element =
        getSelectionElement();

    if(!element){

        return currentFontSize;
    }


    let node =
        element;


    while(
        node &&
        node !== editor
    ){

        const size =
            parseFloat(
                getComputedStyle(node).fontSize
            );


        if(
            Number.isFinite(size) &&
            size > 0
        ){

            currentFontSize =
                Math.round(size);

            return currentFontSize;
        }


        node =
            node.parentElement;
    }


    const editorSize =
        parseFloat(
            getComputedStyle(editor).fontSize
        );


    if(
        Number.isFinite(editorSize)
    ){

        currentFontSize =
            Math.round(editorSize);
    }


    return currentFontSize;
}


/* =========================================================
   المحاذاة الحالية
========================================================= */

function detectCurrentAlignment(){

    const element =
        getSelectionElement();

    if(!element){

        return currentAlignment;
    }


    let node =
        element;


    while(
        node &&
        node !== editor
    ){

        const align =
            getComputedStyle(node).textAlign;


        if(
            align === "right" ||
            align === "center" ||
            align === "left"
        ){

            currentAlignment =
                align;

            return currentAlignment;
        }


        node =
            node.parentElement;
    }


    currentAlignment =
        getComputedStyle(editor).textAlign ||
        "right";


    return currentAlignment;
}

editor.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Enter"){

            return;
        }


        /*
            داخل خلايا الجدول نترك المتصفح
            يتعامل مع Enter بصورة طبيعية.
        */

        if(
            event.target &&
            event.target.closest &&
            event.target.closest("td,th")
        ){

            return;
        }


        event.preventDefault();


        const selection =
            window.getSelection();


        if(
            !selection ||
            selection.rangeCount === 0
        ){

            return;
        }


        const range =
            selection.getRangeAt(0);


        if(
            !rangeBelongsToEditor(range)
        ){

            return;
        }


        if(!range.collapsed){

            range.deleteContents();
        }


        const br =
            document.createElement("br");


        range.insertNode(br);


        const marker =
            document.createTextNode("\u200B");


        br.parentNode.insertBefore(
            marker,
            br.nextSibling
        );


        const newRange =
            document.createRange();


        newRange.setStart(
            marker,
            marker.length
        );


        newRange.collapse(true);


        selection.removeAllRanges();

        selection.addRange(
            newRange
        );


        savedRange =
            newRange.cloneRange();


        updateToolbarState();
    }
);

/* =========================================================
   HSV → RGB
========================================================= */

function hsvToRgb(h,s,v){

    s /= 100;
    v /= 100;

    const c =
        v * s;

    const x =
        c *
        (
            1 -
            Math.abs(
                (h / 60) % 2 - 1
            )
        );

    const m =
        v - c;

    let r = 0;
    let g = 0;
    let b = 0;


    if(h < 60){

        r = c;
        g = x;

    }else if(h < 120){

        r = x;
        g = c;

    }else if(h < 180){

        g = c;
        b = x;

    }else if(h < 240){

        g = x;
        b = c;

    }else if(h < 300){

        r = x;
        b = c;

    }else{

        r = c;
        b = x;
    }


    return {

        r:Math.round((r+m)*255),
        g:Math.round((g+m)*255),
        b:Math.round((b+m)*255)

    };
}


function rgbString(rgb){

    return (
        "rgb(" +
        rgb.r + "," +
        rgb.g + "," +
        rgb.b +
        ")"
    );
}


/* =========================================================
   عجلة الألوان
========================================================= */

function setupAdvancedColorWheel(
    wheel,
    hueMarker,
    colorMarker,
    initialHue,
    callback
){

    let hue =
        initialHue;

    let saturation =
        100;

    let value =
        100;


    function updateHueMarker(){

        const rect =
            wheel.getBoundingClientRect();


        const cx =
            rect.width / 2;

        const cy =
            rect.height / 2;


        const radius =
            Math.min(
                rect.width,
                rect.height
            ) / 2;


        const ringRadius =
            radius * .89;


        const x =
            cx +
            Math.sin(
                hue *
                Math.PI /
                180
            ) *
            ringRadius;


        const y =
            cy -
            Math.cos(
                hue *
                Math.PI /
                180
            ) *
            ringRadius;


        hueMarker.style.left =
            (
                x /
                rect.width *
                100
            ) + "%";


        hueMarker.style.top =
            (
                y /
                rect.height *
                100
            ) + "%";
    }


    function updateColorMarker(){

        const rect =
            wheel.getBoundingClientRect();


        const innerLeft =
            rect.width * .13;

        const innerTop =
            rect.height * .13;

        const innerWidth =
            rect.width * .74;

        const innerHeight =
            rect.height * .74;


        const x =
            innerLeft +
            (
                saturation /
                100
            ) *
            innerWidth;


        const y =
            innerTop +
            (
                1 -
                value /
                100
            ) *
            innerHeight;


        colorMarker.style.left =
            (
                x /
                rect.width *
                100
            ) + "%";


        colorMarker.style.top =
            (
                y /
                rect.height *
                100
            ) + "%";
    }


    function setColor(){

        wheel.style.setProperty(
            "--hue",
            hue
        );


        const rgb =
            hsvToRgb(
                hue,
                saturation,
                value
            );


        colorMarker.style.background =
            rgbString(rgb);


        updateHueMarker();
        updateColorMarker();


        callback(
            rgbString(rgb)
        );
    }


    function setHue(event){

        const rect =
            wheel.getBoundingClientRect();


        const cx =
            rect.left +
            rect.width / 2;

        const cy =
            rect.top +
            rect.height / 2;


        const dx =
            event.clientX -
            cx;

        const dy =
            event.clientY -
            cy;


        let angle =
            Math.atan2(
                dy,
                dx
            ) *
            180 /
            Math.PI;


        angle =
            (
                angle +
                90 +
                360
            ) % 360;


        hue =
            angle;


        setColor();
    }


    function setSV(event){

        const rect =
            wheel.getBoundingClientRect();


        const innerLeft =
            rect.width * .13;

        const innerTop =
            rect.height * .13;

        const innerWidth =
            rect.width * .74;

        const innerHeight =
            rect.height * .74;


        let x =
            event.clientX -
            rect.left -
            innerLeft;


        let y =
            event.clientY -
            rect.top -
            innerTop;


        x =
            Math.max(
                0,
                Math.min(
                    innerWidth,
                    x
                )
            );


        y =
            Math.max(
                0,
                Math.min(
                    innerHeight,
                    y
                )
            );


        saturation =
            x /
            innerWidth *
            100;


        value =
            100 -
            y /
            innerHeight *
            100;


        setColor();
    }


    let hueDragging = false;
    let svDragging = false;


    wheel.addEventListener(
        "pointerdown",
        function(event){

            const rect =
                wheel.getBoundingClientRect();


            const cx =
                rect.left +
                rect.width / 2;

            const cy =
                rect.top +
                rect.height / 2;


            const distance =
                Math.sqrt(
                    Math.pow(
                        event.clientX -
                        cx,
                        2
                    ) +
                    Math.pow(
                        event.clientY -
                        cy,
                        2
                    )
                );


            const radius =
                Math.min(
                    rect.width,
                    rect.height
                ) / 2;


            if(
                distance >
                radius * .78
            ){

                hueDragging = true;

            }else{

                svDragging = true;
            }


            try{

                wheel.setPointerCapture(
                    event.pointerId
                );

            }catch(error){}


            if(hueDragging){

                setHue(event);

            }else{

                setSV(event);
            }


            event.preventDefault();
        }
    );


    wheel.addEventListener(
        "pointermove",
        function(event){

            if(hueDragging){

                setHue(event);
            }


            if(svDragging){

                setSV(event);
            }


            event.preventDefault();
        }
    );


    function stopDragging(event){

        hueDragging = false;
        svDragging = false;


        try{

            wheel.releasePointerCapture(
                event.pointerId
            );

        }catch(error){}
    }


    wheel.addEventListener(
        "pointerup",
        stopDragging
    );


    wheel.addEventListener(
        "pointercancel",
        function(){

            hueDragging = false;
            svDragging = false;

        }
    );


    setColor();
}

function colorToRgba(
    color,
    opacity
){

    const temp =
        document.createElement("span");


    temp.style.color =
        color;


    document.body.appendChild(
        temp
    );


    const rgb =
        getComputedStyle(
            temp
        ).color;


    temp.remove();


    const match =
        rgb.match(/\d+/g);


    if(
        !match ||
        match.length < 3
    ){

        return color;
    }


    return (
        "rgba(" +
        match[0] + "," +
        match[1] + "," +
        match[2] + "," +
        opacity +
        ")"
    );
}

/* =========================================================
   تطبيق حجم الخط
========================================================= */

function applyFontSize(size){

    currentFontSize =
        size;


    if(
        !restoreSelection()
    ){

        focusEditorAtEnd();
    }


    const selection =
        window.getSelection();


    if(
        !selection ||
        selection.rangeCount === 0
    ){

        return;
    }


    const range =
        selection.getRangeAt(0);


    if(
        !rangeBelongsToEditor(range)
    ){

        return;
    }


    /*
        إذا لم يوجد تحديد:
        ننشئ span يحتوي على marker
        حتى تستمر الكتابة بالحجم المختار.
    */

    if(range.collapsed){

        const span =
            document.createElement("span");


        span.style.fontSize =
            size + "px";


        const textNode =
            document.createTextNode(
                "\u200B"
            );


        span.appendChild(
            textNode
        );


        range.insertNode(
            span
        );


        const newRange =
            document.createRange();


        newRange.setStart(
            textNode,
            textNode.length
        );


        newRange.collapse(true);


        selection.removeAllRanges();

        selection.addRange(
            newRange
        );


        savedRange =
            newRange.cloneRange();

    }else{

        try{

            const fragment =
                range.extractContents();


            const wrapper =
                document.createElement(
                    "span"
                );


            wrapper.style.fontSize =
                size + "px";


            wrapper.appendChild(
                fragment
            );


            range.insertNode(
                wrapper
            );


            const newRange =
                document.createRange();


            newRange.selectNodeContents(
                wrapper
            );


            selection.removeAllRanges();

            selection.addRange(
                newRange
            );


            savedRange =
                newRange.cloneRange();

        }catch(error){

            console.error(
                "تعذر تطبيق حجم الخط:",
                error
            );
        }
    }


    fontSizeBar.style.display =
        "none";


    editor.focus();

    updateToolbarState();

    updateFontSizeButtons();
}

function createTable(

){

    const table =

            "tbody"
        );


    for(
        let r = 0;
        r < rows;

            );


        for(
            let c = 0;
            c < cols;

}


/*
    إدراج عنصر في المكان المحفوظ.
*/

function insertElementAtSelection(
    element
){

    if(
        !restoreSelection()
    ){

        focusEditorAtEnd();
    }


    const selection =
        window.getSelection();


    if(
        !selection ||
        selection.rangeCount === 0
    ){

        editor.appendChild(
            element
        );

        focusEditorAtEnd();

        return;
    }


    const range =
        selection
            .getRangeAt(0)
            .cloneRange();


    if(
        !rangeBelongsToEditor(range)
    ){

        editor.appendChild(
            element
        );

        focusEditorAtEnd();

        return;
    }


    range.deleteContents();

    range.collapse(true);

    range.insertNode(
        element
    );


    /*
        نضع فاصلاً بعد العنصر
        حتى يستطيع المستخدم الاستمرار
        في الكتابة بعد الجدول/الخريطة.
    */

    const after =
        document.createTextNode(
            "\u200B"
        );


    if(element.parentNode){

        element.parentNode.insertBefore(
            after,
            element.nextSibling
        );
    }


    const newRange =
        document.createRange();


    newRange.setStart(
        after,
        after.length
    );


    newRange.collapse(true);


    selection.removeAllRanges();

    selection.addRange(
        newRange
    );


    savedRange =
        newRange.cloneRange();
}

/* =========================================================
   إبراز نص البحث
========================================================= */

function highlightTextNode(
    textNode,
    query
){

    const text =
        textNode.nodeValue;


    if(
        !text ||
        !query
    ){

        return 0;
    }


    const lowerText =
        text.toLocaleLowerCase();


    const lowerQuery =
        query.toLocaleLowerCase();


    let index =
        lowerText.indexOf(
            lowerQuery
        );


    if(index === -1){

        return 0;
    }


    const fragment =
        document.createDocumentFragment();


    let lastIndex = 0;
    let count = 0;


    while(index !== -1){

        fragment.appendChild(
            document.createTextNode(
                text.slice(
                    lastIndex,
                    index
                )
            )
        );


        const span =
            document.createElement(
                "span"
            );


        span.className =
            "search-word";


        span.textContent =
            text.slice(
                index,
                index + query.length
            );


        fragment.appendChild(
            span
        );


        count++;


        lastIndex =
            index +
            query.length;


        index =
            lowerText.indexOf(
                lowerQuery,
                lastIndex
            );
    }


    fragment.appendChild(
        document.createTextNode(
            text.slice(lastIndex)
        )
    );


    if(textNode.parentNode){

        textNode.parentNode.replaceChild(
            fragment,
            textNode
        );
    }


    return count;
}


/* =========================================================
   البحث داخل الملاحظة
========================================================= */

function highlightWordsInNote(
    note,
    query
){

    let count = 0;


    const walker =
        document.createTreeWalker(
            note,
            NodeFilter.SHOW_TEXT,
            {
                acceptNode:
                    function(node){

                        if(
                            !node.nodeValue ||
                            !node.nodeValue
                                .toLocaleLowerCase()
                                .includes(
                                    query.toLocaleLowerCase()
                                )
                        ){

                            return NodeFilter.FILTER_REJECT;
                        }


                        if(
                            node.parentElement &&
                            (
                                node.parentElement.closest(
                                    ".note-menu"
                                ) ||
                                node.parentElement.closest(
                                    ".search-word"
                                )
                            )
                        ){

                            return NodeFilter.FILTER_REJECT;
                        }


                        return NodeFilter.FILTER_ACCEPT;
                    }
            }
        );


    const nodes = [];


    let current;


    while(
        (current = walker.nextNode())
    ){

        nodes.push(
            current
        );
    }


    nodes.forEach(
        function(node){

            count +=
                highlightTextNode(
                    node,
                    query
                );
        }
    );


    return count;
}


/* =========================================================
   تنفيذ البحث
========================================================= */

function performSearch(){

    const query =
        searchInput.value.trim();


    clearSearchHighlights();


    if(!query){

        searchResult.textContent =
            "";

        return;
    }


    let noteCount = 0;
    let matchCount = 0;
    let first = null;


    document
        .querySelectorAll(
            ".note"
        )
        .forEach(
            function(note){

                const content =
                    note.querySelector(
                        ".note-content"
                    );


                const text =
                    (
                        content ||
                        note
                    )
                    .textContent
                    .toLocaleLowerCase();


                if(
                    text.includes(
                        query.toLocaleLowerCase()
                    )
                ){

                    noteCount++;


                    if(!first){

                        first = note;
                    }
                }
            }
        );


    if(!first){

        searchResult.textContent =
            "لم يتم العثور على النص";

        return;
    }


    document
        .querySelectorAll(
            ".note"
        )
        .forEach(
            function(note){

                const content =
                    note.querySelector(
                        ".note-content"
                    );


                if(content){

                    matchCount +=
                        highlightWordsInNote(
                            content,
                            query
                        );
                }
            }
        );


    first.classList.add(
        "search-highlight"
    );


    first.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });


    searchResult.textContent =
        "تم العثور على " +
        matchCount +
        " نتيجة في " +
        noteCount +
        " ملاحظة";
}

                100
            );
        }
    );


/* =========================================================
   حذف الملاحظة
========================================================= */

document
    .getElementById("deleteButton")
    .addEventListener(
        "click",
        function(){

            if(
                selectedIndex < 0 ||
                selectedIndex >= notes.length
            ){

                return;
            }


            const confirmed =
                window.confirm(
                    "هل تريدين حذف هذه الملاحظة؟"
                );


            if(!confirmed){

                messageMenu.style.display =
                    "none";

                return;
            }


            const deletedIndex =
                selectedIndex;


            notes.splice(
                deletedIndex,
                1
            );


            if(
                editingIndex ===
                deletedIndex
            ){

                resetEditor();

            }else if(
                editingIndex >
                deletedIndex
            ){

                editingIndex--;
            }


            selectedIndex =
                -1;


            saveNotes();

            render();


            messageMenu.style.display =
                "none";
        }
    );


/* =========================================================
   إلغاء
========================================================= */

document
    .getElementById("cancelButton")
    .addEventListener(
        "click",
        function(){

            resetEditor();

            editor.focus();
        }
    );


/* =========================================================
   ملاحظة جديدة
========================================================= */

document
    .getElementById("newButton")
    .addEventListener(
        "click",
        function(){

            resetEditor();

            editor.focus();
        }
    );


/* =========================================================
   إغلاق النوافذ عند الضغط خارجها
========================================================= */

document
    .querySelectorAll(
        ".overlay"
    )
    .forEach(
        function(overlay){

            overlay.addEventListener(
                "click",
                function(event){

                    if(
                        event.target === overlay
                    ){

                        overlay.style.display =
                            "none";

                        editor.focus();
                    }
                }
            );
        }
    );


/* =========================================================
   Escape
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key !== "Escape"
        ){

            return;
        }


        document
            .querySelectorAll(
                ".overlay"
            )
            .forEach(
                function(overlay){

                    overlay.style.display =
                        "none";
                }
            );


        messageMenu.style.display =
            "none";
    }
);


/* =========================================================
   معالجة اللصق
========================================================= */

editor.addEventListener(
    "paste",
    function(event){

        event.preventDefault();


        const clipboard =
            event.clipboardData ||
            window.clipboardData;


        if(!clipboard){

            return;
        }


        /*
            إذا كان هناك نص فقط:
            نحافظ على الأسطر.
        */

        const text =
            clipboard.getData(
                "text/plain"
            );


        if(!text){

            return;
        }


        const selection =
            window.getSelection();


        if(
            !selection ||
            selection.rangeCount === 0
        ){

            return;
        }


        const range =
            selection.getRangeAt(0);


        if(
            !rangeBelongsToEditor(range)
        ){

            return;
        }


        range.deleteContents();


        const fragment =
            document.createDocumentFragment();


        const lines =
            text
                .replace(
                    /\r\n/g,
                    "\n"
                )
                .replace(
                    /\r/g,
                    "\n"
                )
                .split("\n");


        lines.forEach(
            function(line,index){

                if(index > 0){

                    fragment.appendChild(
                        document.createElement(
                            "br"
                        )
                    );
                }


                fragment.appendChild(
                    document.createTextNode(
                        line
                    )
                );
            }
        );


        range.insertNode(
            fragment
        );


        range.collapse(
            false
        );


        selection.removeAllRanges();

        selection.addRange(
            range
        );


        savedRange =
            range.cloneRange();


        setTimeout(
            function(){

                saveSelection();

                updateToolbarState();

            },
            0
        );
    }
);


/* =========================================================
   منع سحب الصور
========================================================= */

editor.addEventListener(
    "dragstart",
    function(event){

        if(
            event.target &&
            event.target.tagName ===
            "IMG"
        ){

            event.preventDefault();
        }
    }
);


/* =========================================================
   منع سحب الملفات
========================================================= */

editor.addEventListener(
    "drop",
    function(event){

        if(
            event.dataTransfer &&
            event.dataTransfer.files &&
            event.dataTransfer.files.length
        ){

            event.preventDefault();
        }
    }
);


/* =========================================================
   تغيير حجم النافذة
========================================================= */

window.addEventListener(
    "resize",
    function(){

        if(
            messageMenu.style.display ===
            "block"
        ){

            messageMenu.style.display =
                "none";
        }
    }
);


/* =========================================================
   بدء التطبيق
========================================================= */

render();

updateFontSizeButtons();

updateAlignmentButtons();

</script>
