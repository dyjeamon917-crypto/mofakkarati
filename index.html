<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>اختبار</title>

<style>
body{
    margin:0;
    padding:30px;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

button{
    display:block;
    width:100%;
    height:60px;
    margin:20px 0;
    border:0;
    border-radius:15px;
    background:#246bff;
    color:white;
    font-size:20px;
}

#box{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:#222;
}
</style>
</head>

<body>

<h2>اختبار Acode</h2>

<button id="test">
اضغطي هنا
</button>

<button id="write">
اختبار الكتابة
</button>

<div id="box">
لم يتم الضغط بعد
</div>

<script>
const test =
document.getElementById("test");

const write =
document.getElementById("write");

const box =
document.getElementById("box");

test.onclick = function(){

    box.textContent =
    "اشتغل الزر بنجاح ✅";

};

write.onclick = function(){

    box.textContent =
    "JavaScript شغال على الموبايل ✅";

};

console.log("JavaScript يعمل");
</script>

</body>
</html>
