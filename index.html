<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>ملاحظاتي</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#101218;color:#fff}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.app{width:100%;height:100%;display:flex;flex-direction:column}
.header{height:56px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#191c24;border-bottom:1px solid #343944}
.title{flex:1;text-align:center;font-size:18px;font-weight:bold}
.icon{width:40px;height:40px;border:0;border-radius:50%;background:#292e39;color:#fff;font-size:20px}
.messages{flex:1;min-height:0;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
.empty{text-align:center;color:#777;margin-top:30vh}
.note{background:#20242d;border-radius:14px;padding:11px 13px;margin-bottom:9px;line-height:1.7;overflow-wrap:anywhere}
.note-menu{float:left;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:#aaa;font-size:20px}
.editor-area{flex-shrink:0;background:#191c24;border-top:1px solid #343944;padding:5px 7px calc(8px + env(safe-area-inset-bottom))}
.edit-state{height:28px;display:flex;align-items:center;justify-content:space-between;color:#aaa;font-size:12px}
.cancel{width:34px;height:28px;border:0;background:transparent;color:#aaa;font-size:21px}
.toolbar{display:flex;gap:5px;overflow-x:auto;padding:3px 0 7px;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool{flex:0 0 39px;width:39px;height:39px;border:1px solid #444955;border-radius:10px;background:#292e39;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
.tool.active{background:#315fae;border-color:#5f8fe8;box-shadow:0 0 0 2px rgba(52,113,246,.25)}
.bold{font-weight:900}
.underline{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px}
.write-row{display:flex;align-items:flex-end;gap:6px}
.editor{flex:1;min-width:0;min-height:48px;max-height:170px;overflow-y:auto;padding:9px 11px;border:1px solid #464b57;border-radius:12px;outline:none;background:#0e1015;color:#fff;line-height:1.7;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;user-select:text;-webkit-user-select:text;direction:rtl;text-align:right}
.editor:empty::before{content:"اكتبي ملاحظتك هنا...";color:#666}
.editor u{ text-underline-offset:7px;text-decoration-thickness:2px}
.send{flex:0 0 47px;width:47px;height:47px;border:0;border-radius:50%;background:#3471f6;color:#fff;font-size:21px}
.font-size-bar{display:none;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;padding:3px 0 7px;direction:ltr}
.font-size-bar::-webkit-scrollbar{display:none}
.font-size-item{flex:0 0 34px;width:34px;height:32px;border:1px solid #444955;border-radius:8px;background:#292e39;color:#fff;font-size:13px;padding:0}
.font-size-item.active{background:#315fae;border-color:#6b98ef}
.alignment-bar{display:none;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;padding:3px 0 7px}
.alignment-bar::-webkit-scrollbar{display:none}
.align-item{flex:0 0 36px;width:36px;height:32px;border:1px solid #444955;border-radius:8px;background:#292e39;color:#fff;font-size:16px;padding:0}
.align-item.active{background:#315fae;border-color:#6b98ef}
.overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.58);align-items:center;justify-content:center;padding:15px}
.panel{width:min(94vw,350px);max-height:86vh;overflow:auto;background:#20242d;border:1px solid #444955;border-radius:17px;padding:15px;box-shadow:0 15px 50px #000b}
.panel-title{text-align:center;font-weight:bold;margin-bottom:12px}
.color-picker{width:270px;max-width:78vw;margin:10px auto 15px}
.color-wheel{position:relative;width:250px;height:250px;max-width:72vw;max-height:72vw;margin:auto;touch-action:none;border-radius:50%;overflow:hidden}
.hue-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sv-area{position:absolute;inset:13%;border-radius:50%;overflow:hidden;background:linear-gradient(to right,#fff,hsl(var(--hue),100%,50%)),linear-gradient(to bottom,transparent,#000)}
.sv-white{position:absolute;inset:0;background:linear-gradient(to right,rgba(255,255,255,1),rgba(255,255,255,0))}
.sv-black{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,1))}
.color-marker{position:absolute;width:21px;height:21px;border:3px solid white;border-radius:50%;box-shadow:0 0 0 2px #000,0 0 4px #000;transform:translate(-50%,-50%);pointer-events:none;z-index:10}
.hue-marker{position:absolute;width:19px;height:19px;border:3px solid white;border-radius:50%;box-shadow:0 0 0 2px #000;transform:translate(-50%,-50%);pointer-events:none;z-index:11}
.color-presets{display:flex;justify-content:center;gap:8px;margin-top:10px}
.color-preset{width:36px;height:36px;border:2px solid #666;border-radius:50%}
.black-preset{background:#000}.white-preset{background:#fff}
.range-title{text-align:center;color:#ccc;margin-bottom:5px}
.range{width:100%;accent-color:#4c80ff}
.panel-button{width:100%;height:43px;border:0;border-radius:10px;background:#303642;color:#fff;margin-top:10px}
.highlight-actions{display:flex;gap:7px}.highlight-actions button{flex:1}
.list-choice{display:flex;gap:7px}.list-choice button{flex:1;min-height:48px;border:1px solid #444955;border-radius:10px;background:#2a2f39;color:#fff}
.editor table,.note table{width:max-content;max-width:100%;border-collapse:collapse;table-layout:auto;margin:8px 0}
.editor td,.editor th,.note td,.note th{border:1px solid #666d7b;padding:7px 9px;min-width:45px;height:34px;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.editor td:focus,.editor th:focus{outline:1px solid #3471f6}
.mind-map{width:100%;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;margin:10px 0}
.mind-center{width:fit-content;max-width:90%;padding:9px 15px;border:1px solid #5579bd;border-radius:12px;background:#263657;text-align:center;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
.mind-branches{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:9px}
.mind-branch{width:auto;max-width:45%;min-width:80px;padding:8px 10px;border:1px solid #555d6d;border-radius:10px;background:#292e39;text-align:center;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;line-height:1.6}
.mind-input{width:100%;min-height:43px;max-height:130px;border:1px solid #464b57;border-radius:10px;background:#0e1015;color:#fff;padding:8px 10px;outline:none;margin-bottom:7px;font-family:inherit;font-size:16px;line-height:1.6;resize:vertical;direction:rtl;text-align:right;white-space:pre-wrap;overflow-y:auto}
.mind-input:focus{border-color:#3471f6}
.menu{display:none;position:fixed;z-index:1000;min-width:135px;padding:5px;background:#20242d;border:1px solid #444955;border-radius:11px;box-shadow:0 10px 35px #000b}
.menu button{display:block;width:100%;min-height:42px;border:0;border-radius:7px;background:transparent;color:#fff;text-align:right;padding:0 10px}
.search-input{width:100%;height:45px;border:1px solid #464b57;border-radius:10px;background:#0e1015;color:#fff;padding:8px 10px;outline:none;font-size:16px}
.search-result{margin-top:10px;color:#aaa;text-align:center;font-size:13px}
.search-highlight{outline:2px solid #3471f6;outline-offset:2px}
@media(max-width:420px){.panel{width:94vw}.color-wheel{width:220px;height:220px}.mind-branch{min-width:70px;max-width:45%}}
</style>
</head>

<body>
<div class="app">
<header class="header">
<button class="icon" id="searchButton" type="button">⌕</button>
<div class="title">ملاحظاتي</div>
<button class="icon" id="newButton" type="button">＋</button>
</header>

<main class="messages" id="messages"></main>

<section class="editor-area">
<div class="edit-state">
<span id="state">رسالة جديدة</span>
<button class="cancel" id="cancelButton" type="button">×</button>
</div>

<div class="toolbar">
<button class="tool bold" id="boldButton" type="button">B</button>
<button class="tool" id="italicButton" type="button"><i>I</i></button>
<button class="tool underline" id="underlineButton" type="button">U</button>
<button class="tool" id="colorButton" type="button">●</button>
<button class="tool" id="highlightButton" type="button">▰</button>
<button class="tool" id="sizeButton" type="button">A↕</button>
<button class="tool" id="listButton" type="button">☷</button>
<button class="tool" id="alignmentButton" type="button">☰</button>
<button class="tool" id="tableButton" type="button">▦</button>
<button class="tool" id="mindMapButton" type="button">🧠</button>
</div>

<div class="font-size-bar" id="fontSizeBar"></div>

<div class="alignment-bar" id="alignmentBar">
<button class="align-item" data-align="right" type="button">≡</button>
<button class="align-item" data-align="center" type="button">≣</button>
<button class="align-item" data-align="left" type="button">≡</button>
</div>

<div class="write-row">
<div class="editor" id="editor" contenteditable="true" spellcheck="true"></div>
<button class="send" id="sendButton" type="button">➤</button>
</div>
</section>
</div>

<div class="overlay" id="colorOverlay">
<div class="panel">
<div class="panel-title">لون الخط</div>
<div class="color-picker">
<div class="color-wheel" id="textColorWheel" style="--hue:0">
<div class="hue-ring"></div>
<div class="sv-area"><div class="sv-white"></div><div class="sv-black"></div></div>
<div class="hue-marker" id="textHueMarker"></div>
<div class="color-marker" id="textColorMarker"></div>
</div>
<div class="color-presets">
<button class="color-preset black-preset" id="blackText" type="button" title="أسود"></button>
<button class="color-preset white-preset" id="whiteText" type="button" title="أبيض"></button>

</div>
<button class="panel-button" id="colorDone" type="button">تم</button>
</div>
</div>

<div class="overlay" id="highlightOverlay">
<div class="panel">
<div class="panel-title">تمييز النص</div>
<div class="color-picker">
<div class="color-wheel" id="highlightColorWheel" style="--hue:60">
<div class="hue-ring"></div>
<div class="sv-area"><div class="sv-white"></div><div class="sv-black"></div></div>
<div class="hue-marker" id="highlightHueMarker"></div>
<div class="color-marker" id="highlightColorMarker"></div>
</div>
</div>

<div class="menu" id="messageMenu">
<button id="editButton" type="button">✎ تعديل</button>
<button id="deleteButton" type="button">🗑 حذف</button>
</div>

<script>
"use strict";

const STORAGE="notes_clean_editor_v2";
let notes=JSON.parse(localStorage.getItem(STORAGE)||"[]");
let editingIndex=-1;
let selectedIndex=-1;
let savedRange=null;
let currentFontSize=8;
let currentAlignment="right";

/* حالة التمييز */
let highlightEnabled=false;
let highlightColorForTyping="rgba(255,255,0,.60)";

const editor=document.getElementById("editor");
const messages=document.getElementById("messages");
const state=document.getElementById("state");
const messageMenu=document.getElementById("messageMenu");
const fontSizeBar=document.getElementById("fontSizeBar");
const alignmentBar=document.getElementById("alignmentBar");

function saveNotes(){
localStorage.setItem(STORAGE,JSON.stringify(notes));
}

function render(){
messages.innerHTML="";
if(notes.length===0){
messages.innerHTML='<div class="empty">لا توجد ملاحظات بعد</div>';
return;
}
notes.forEach((note,index)=>{
const box=document.createElement("div");
box.className="note";
const menu=document.createElement("button");
menu.className="note-menu";
menu.textContent="⋮";
menu.addEventListener("click",function(event){
event.stopPropagation();
selectedIndex=index;
openMessageMenu(event.clientX,event.clientY);
});
box.appendChild(menu);
const content=document.createElement("div");
content.innerHTML=note.html;
box.appendChild(content);
messages.appendChild(box);
});
}

function openMessageMenu(x,y){
messageMenu.style.display="block";
let left=x-140;
let top=y;
if(left<5)left=5;
if(left+140>window.innerWidth)left=window.innerWidth-145;
if(top+100>window.innerHeight)top=window.innerHeight-110;
messageMenu.style.left=left+"px";
messageMenu.style.top=top+"px";
}

document.addEventListener("click",function(event){
if(!event.target.closest(".menu")&&!event.target.closest(".note-menu")){
messageMenu.style.display="none";
}
});

function selectionIsInsideEditor(range){
if(!range)return false;
return editor.contains(range.startContainer)&&editor.contains(range.endContainer);
}

function saveSelection(){
const selection=window.getSelection();
if(selection&&selection.rangeCount>0){
const range=selection.getRangeAt(0);
if(selectionIsInsideEditor(range))savedRange=range.cloneRange();
}
}

function restoreSelection(){
if(!savedRange||!selectionIsInsideEditor(savedRange))return false;
const selection=window.getSelection();
selection.removeAllRanges();
selection.addRange(savedRange);
return true;
}

function focusEditor(){
editor.focus();
restoreSelection();
}

function updateToolbarState(){
if(document.activeElement!==editor)return;
document.getElementById("boldButton").classList.toggle("active",document.queryCommandState("bold"));
document.getElementById("italicButton").classList.toggle("active",document.queryCommandState("italic"));
document.getElementById("underlineButton").classList.toggle("active",document.queryCommandState("underline"));
}

function command(name,value=null){
focusEditor();
document.execCommand(name,false,value);
saveSelection();
updateToolbarState();
}

document.getElementById("boldButton").addEventListener("click",function(){
saveSelection();
command("bold");
editor.focus();
updateToolbarState();
});

document.getElementById("italicButton").addEventListener("click",function(){
saveSelection();
command("italic");
editor.focus();
updateToolbarState();
});

document.getElementById("underlineButton").addEventListener("click",function(){
saveSelection();
command("underline");
editor.focus();
updateToolbarState();
});

/* ==========================
   Enter = سطر جديد داخل نفس الرسالة
========================== */

editor.addEventListener("keydown",function(event){

if(event.key!=="Enter")return;

event.preventDefault();

const selection=window.getSelection();

if(!selection||selection.rangeCount===0)return;

const range=selection.getRangeAt(0);

if(!selectionIsInsideEditor(range))return;

if(!range.collapsed){
range.deleteContents();
}

const br=document.createElement("br");
range.insertNode(br);

const space=document.createTextNode("\u200B");

br.parentNode.insertBefore(space,br.nextSibling);

const newRange=document.createRange();

newRange.setStart(space,1);
newRange.collapse(true);

selection.removeAllRanges();
selection.addRange(newRange);

savedRange=newRange.cloneRange();

updateToolbarState();

});

editor.addEventListener("mouseup",function(){
saveSelection();
updateToolbarState();
});

editor.addEventListener("keyup",function(){
saveSelection();
updateToolbarState();
});

editor.addEventListener("touchend",function(){
setTimeout(function(){
saveSelection();
updateToolbarState();
},120);
});

editor.addEventListener("input",function(){
setTimeout(function(){
saveSelection();
updateToolbarState();
},0);
});

document.addEventListener("selectionchange",function(){
const selection=window.getSelection();
if(selection&&selection.rangeCount>0){
const range=selection.getRangeAt(0);
if(selectionIsInsideEditor(range)){
saveSelection();
updateToolbarState();
}
}
});

function hsvToRgb(h,s,v){
s/=100;
v/=100;
const c=v*s;
const x=c*(1-Math.abs((h/60)%2-1));
const m=v-c;
let r=0,g=0,b=0;

if(h<60){r=c;g=x}
else if(h<120){r=x;g=c}
else if(h<180){g=c;b=x}
else if(h<240){g=x;b=c}
else if(h<300){r=x;b=c}
else{r=c;b=x}

return{
r:Math.round((r+m)*255),
g:Math.round((g+m)*255),
b:Math.round((b+m)*255)
};
}

function rgbString(rgb){
return `rgb(${rgb.r},${rgb.g},${rgb.b})`;
}

function setupAdvancedColorWheel(wheel,hueMarker,colorMarker,initialHue,callback){

let hue=initialHue,saturation=100,value=100;

function setColor(){

wheel.style.setProperty("--hue",hue);

const rgb=hsvToRgb(hue,saturation,value);

colorMarker.style.background=rgbString(rgb);

callback(rgbString(rgb));

}

function setHue(event){

const rect=wheel.getBoundingClientRect();

const cx=rect.left+rect.width/2;
const cy=rect.top+rect.height/2;

let dx=event.clientX-cx;
let dy=event.clientY-cy;

let angle=Math.atan2(dy,dx)*180/Math.PI;

angle=(angle+90+360)%360;

hue=angle;

const radius=Math.min(rect.width,rect.height)/2;
const ringRadius=radius*.89;

const x=cx+Math.sin(hue*Math.PI/180)*ringRadius;
const y=cy-Math.cos(hue*Math.PI/180)*ringRadius;

hueMarker.style.left=((x-rect.left)/rect.width*100)+"%";
hueMarker.style.top=((y-rect.top)/rect.height*100)+"%";

setColor();

}

function setSV(event){

const rect=wheel.getBoundingClientRect();

const innerLeft=rect.width*.13;
const innerTop=rect.height*.13;
const innerWidth=rect.width*.74;
const innerHeight=rect.height*.74;

let x=event.clientX-rect.left-innerLeft;
let y=event.clientY-rect.top-innerTop;

x=Math.max(0,Math.min(innerWidth,x));
y=Math.max(0,Math.min(innerHeight,y));

saturation=x/innerWidth*100;
value=100-y/innerHeight*100;

const markerX=innerLeft+x;
const markerY=innerTop+y;

colorMarker.style.left=(markerX/rect.width*100)+"%";
colorMarker.style.top=(markerY/rect.height*100)+"%";

setColor();

}

let hueDragging=false,svDragging=false;

wheel.addEventListener("pointerdown",function(event){

const rect=wheel.getBoundingClientRect();

const cx=rect.left+rect.width/2;
const cy=rect.top+rect.height/2;

const distance=Math.sqrt(
Math.pow(event.clientX-cx,2)+
Math.pow(event.clientY-cy,2)
);

const radius=Math.min(rect.width,rect.height)/2;

if(distance>radius*.78){
hueDragging=true;
}else{
svDragging=true;
}

wheel.setPointerCapture(event.pointerId);

if(hueDragging)setHue(event);
else setSV(event);

event.preventDefault();

});

wheel.addEventListener("pointermove",function(event){

if(hueDragging)setHue(event);
if(svDragging)setSV(event);

event.preventDefault();

});

wheel.addEventListener("pointerup",function(event){

hueDragging=false;
svDragging=false;

try{
wheel.releasePointerCapture(event.pointerId);
}catch(e){}

});

wheel.addEventListener("pointercancel",function(){

hueDragging=false;
svDragging=false;

});

setColor();

}

const colorOverlay=document.getElementById("colorOverlay");
const textColorWheel=document.getElementById("textColorWheel");
const textHueMarker=document.getElementById("textHueMarker");
const textColorMarker=document.getElementById("textColorMarker");

let chosenTextColor="rgb(255,255,255)";

setupAdvancedColorWheel(
textColorWheel,
textHueMarker,
textColorMarker,
0,
function(color){
chosenTextColor=color;
}
);

document.getElementById("blackText").addEventListener("click",function(){

chosenTextColor="rgb(0,0,0)";
textColorMarker.style.background="#000";

});

document.getElementById("whiteText").addEventListener("click",function(){

chosenTextColor="rgb(255,255,255)";
textColorMarker.style.background="#fff";

});

document.getElementById("colorButton").addEventListener("click",function(){

saveSelection();
colorOverlay.style.display="flex";

});

document.getElementById("colorDone").addEventListener("click",function(){

restoreSelection();

if(savedRange){

const selection=window.getSelection();

selection.removeAllRanges();
selection.addRange(savedRange);

document.execCommand(
"foreColor",
false,
chosenTextColor
);

saveSelection();

}

colorOverlay.style.display="none";
editor.focus();

});

/* ==========================
   تمييز النص
========================== */

const highlightOverlay=document.getElementById("highlightOverlay");
const highlightColorWheel=document.getElementById("highlightColorWheel");
const highlightHueMarker=document.getElementById("highlightHueMarker");
const highlightColorMarker=document.getElementById("highlightColorMarker");
const opacityRange=document.getElementById("opacityRange");

let chosenHighlightColor="rgb(255,255,0)";
let highlightOpacity=.60;

function hexWithOpacity(color,opacity){

const temp=document.createElement("span");

temp.style.color=color;

document.body.appendChild(temp);

const rgb=getComputedStyle(temp).color;

temp.remove();

const match=rgb.match(/\d+/g);

if(!match)return color;

return `rgba(${match[0]},${match[1]},${match[2]},${opacity})`;

}

setupAdvancedColorWheel(
highlightColorWheel,
highlightHueMarker,
highlightColorMarker,
60,
function(color){

chosenHighlightColor=color;

}
);

opacityRange.addEventListener("input",function(event){

highlightOpacity=Number(event.target.value)/100;

});

document.getElementById("highlightButton").addEventListener("click",function(){

saveSelection();

highlightOverlay.style.display="flex";

});



/* ==========================
   أحجام الخط
========================== */

const fontSizes=[
8,9,10,11,12,14,16,18,20,22,24,26,28,32,36,40,48,56,64,72
];

fontSizes.forEach(function(size){

const button=document.createElement("button");

button.className="font-size-item";
button.textContent=size;

button.addEventListener("click",function(){
applyFontSize(size);
});

fontSizeBar.appendChild(button);

});

function updateFontSizeButtons(){

fontSizeBar.querySelectorAll(".font-size-item").forEach(button=>{

button.classList.toggle(
"active",
Number(button.textContent)===currentFontSize
);

});

}

function applyFontSize(size){

currentFontSize=size;

const range=savedRange;

if(range&&!range.collapsed&&selectionIsInsideEditor(range)){

const selection=window.getSelection();

selection.removeAllRanges();
selection.addRange(range.cloneRange());

document.execCommand("fontSize",false,"7");

const fonts=editor.querySelectorAll('font[size="7"]');

fonts.forEach(function(font){

font.removeAttribute("size");
font.style.fontSize=size+"px";

});

saveSelection();

}else{

editor.focus();
restoreSelection();

const selection=window.getSelection();

if(selection&&selection.rangeCount>0){

const range=selection.getRangeAt(0);

if(selectionIsInsideEditor(range)&&range.collapsed){

const span=document.createElement("span");

span.style.fontSize=size+"px";

const textNode=document.createTextNode("\u200B");

span.appendChild(textNode);

range.insertNode(span);

const newRange=document.createRange();

newRange.setStart(textNode,textNode.length);
newRange.collapse(true);

selection.removeAllRanges();
selection.addRange(newRange);

savedRange=newRange.cloneRange();

}

}

}

fontSizeBar.style.display="none";
editor.focus();

updateToolbarState();
updateFontSizeButtons();

}

document.getElementById("sizeButton").addEventListener("click",function(){

saveSelection();

updateFontSizeButtons();

fontSizeBar.style.display="flex";
alignmentBar.style.display="none";

setTimeout(function(){

const active=fontSizeBar.querySelector(
".font-size-item.active"
);

if(active){

active.scrollIntoView({
behavior:"smooth",
block:"nearest",
inline:"center"
});

}

},20);

});

   القوائم

listBar.style.direction="rtl";

   المحاذاة

alignmentBar.style.display="flex";

});

alignmentBar.querySelectorAll(".align-item").forEach(button=>{

"justify"+

/* ==========================
   الجدول
========================== */

const tableOverlay=document.getElementById("tableOverlay");
const tableInfo=document.getElementById("tableInfo");

let tableRows=3;
let tableCols=3;

function updateTableInfo(){

tableInfo.textContent=
tableRows+" × "+tableCols;

}

function createTable(rows,cols){

const table=document.createElement("table");
const tbody=document.createElement("tbody");

for(let r=0;r<rows;r++){

const tr=document.createElement("tr");

for(let c=0;c<cols;c++){

const td=document.createElement("td");

td.contentEditable="true";
td.innerHTML="<br>";

tr.appendChild(td);

}

tbody.appendChild(tr);

}

table.appendChild(tbody);

return table;

}

document.getElementById("tableButton").addEventListener("click",function(){

saveSelection();

tableRows=3;
tableCols=3;

updateTableInfo();

tableOverlay.style.display="flex";

});

document.getElementById("tableRowsPlus").addEventListener("click",function(){

tableRows=Math.min(20,tableRows+1);

updateTableInfo();

});

document.getElementById("tableRowsMinus").addEventListener("click",function(){

tableRows=Math.max(1,tableRows-1);

updateTableInfo();

});

document.getElementById("tableColsPlus").addEventListener("click",function(){

tableCols=Math.min(10,tableCols+1);

updateTableInfo();

});

document.getElementById("tableColsMinus").addEventListener("click",function(){

tableCols=Math.max(1,tableCols-1);

updateTableInfo();

});

document.getElementById("tableDone").addEventListener("click",function(){

restoreSelection();

const table=createTable(
tableRows,
tableCols
);

if(savedRange){

const range=savedRange.cloneRange();

range.collapse(false);

range.insertNode(table);

range.setStartAfter(table);

range.collapse(true);

const selection=window.getSelection();

selection.removeAllRanges();
selection.addRange(range);

savedRange=range.cloneRange();

}else{

editor.appendChild(table);

}

tableOverlay.style.display="none";

editor.focus();

});

   الخريطة الذهنية

const mindMapOverlay=document.getElementById("mindMapOverlay");
const mindCenterInput=document.getElementById("mindCenterInput");
const mindBranches=document.getElementById("mindBranches");

function addMindBranch(){

const input=document.createElement("textarea");

input.className="mind-input";
input.placeholder="فرع";
input.rows=2;

mindBranches.appendChild(input);

}

document.getElementById("mindMapButton").addEventListener("click",function(){

saveSelection();

mindCenterInput.value="";
mindBranches.innerHTML="";

addMindBranch();
addMindBranch();

mindMapOverlay.style.display="flex";

setTimeout(function(){
mindCenterInput.focus();
},50);

});

document.getElementById("mindAdd").addEventListener("click",function(){

if(mindBranches.children.length<12){
addMindBranch();
}

});

document.getElementById("mindDone").addEventListener("click",function(){

const center=
mindCenterInput.value.trim()||
"الفكرة الرئيسية";

const values=[
...mindBranches.querySelectorAll(".mind-input")
]
.map(input=>input.value.trim())
.filter(Boolean);

const wrap=document.createElement("div");

wrap.className="mind-map";

const centerBox=document.createElement("div");

centerBox.className="mind-center";
centerBox.textContent=center;

wrap.appendChild(centerBox);

if(values.length){

const branches=document.createElement("div");

branches.className="mind-branches";

values.forEach(value=>{

const branch=document.createElement("div");

branch.className="mind-branch";
branch.textContent=value;

branches.appendChild(branch);

});

wrap.appendChild(branches);

}

restoreSelection();

if(savedRange){

const range=savedRange.cloneRange();

range.collapse(false);
range.insertNode(wrap);

range.setStartAfter(wrap);
range.collapse(true);

const selection=window.getSelection();

selection.removeAllRanges();
selection.addRange(range);

savedRange=range.cloneRange();

}else{

editor.appendChild(wrap);

}

mindMapOverlay.style.display="none";

editor.focus();

});

/* ==========================
   البحث
========================== */

const searchOverlay=document.getElementById("searchOverlay");
const searchInput=document.getElementById("searchInput");
const searchResult=document.getElementById("searchResult");

document.getElementById("searchButton").addEventListener("click",function(){

searchInput.value="";
searchResult.textContent="";

searchOverlay.style.display="flex";

setTimeout(function(){
searchInput.focus();
},50);

});

function performSearch(){

const query=
searchInput.value.trim().toLowerCase();

document.querySelectorAll(".search-highlight")
.forEach(element=>{
element.classList.remove("search-highlight");
});

if(!query){

searchResult.textContent="";
return;

}

let count=0;
let first=null;

document.querySelectorAll(".note").forEach(note=>{

if(note.textContent.toLowerCase().includes(query)){

count++;

if(!first)first=note;

}

});

if(first){

first.classList.add("search-highlight");

first.scrollIntoView({
behavior:"smooth",
block:"center"
});

searchResult.textContent=
"تم العثور على "+count+" ملاحظة";

}else{

searchResult.textContent=
"لم يتم العثور على النص";

}

}

searchInput.addEventListener(
"input",
performSearch
);

document.getElementById("searchDone").addEventListener("click",function(){

searchOverlay.style.display="none";

document.querySelectorAll(".search-highlight")
.forEach(element=>{
element.classList.remove("search-highlight");
});

});

   حفظ الرسالة

const html=editor.innerHTML.trim();

if(!html)return;

if(editingIndex>=0){

notes[editingIndex].html=html;

}else{

notes.push({
html:html
});

}

saveNotes();
render();

editingIndex=-1;

editor.innerHTML="";

state.textContent="رسالة جديدة";

savedRange=null;

currentFontSize=8;
currentAlignment="right";

/*
   بعد إرسال الرسالة،
   نبدأ رسالة جديدة بدون تمييز.
*/

listBar.style.display="none";

.classList.remove("active");

document.getElementById("italicButton")
.classList.remove("active");

document.getElementById("underlineButton")
.classList.remove("active");

setTimeout(function(){

messages.scrollTop=
messages.scrollHeight;

},50);

});
