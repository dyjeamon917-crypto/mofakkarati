````html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover"
>

<meta name="theme-color" content="#10131a">

<title>ملاحظاتي</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

html{
    color-scheme:dark;
}

body{
    overflow:hidden;
    background:#0f1117;
    color:#f5f7fb;
    font-family:Arial,"Segoe UI",Tahoma,sans-serif;
    -webkit-text-size-adjust:100%;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    touch-action:manipulation;
}

button:disabled{
    opacity:.45;
}

button:active{
    transform:scale(.96);
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
[contenteditable="true"]:focus-visible{
    outline:2px solid #6d9dff;
    outline-offset:2px;
}


/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(64,100,170,.12),
            transparent 45%
        ),
        #10131a;
}


/* =========================
   HEADER
========================= */

.header{
    flex:0 0 58px;
    height:58px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:7px 10px;

    background:rgba(25,29,38,.98);

    border-bottom:1px solid rgba(255,255,255,.08);

    position:relative;
    z-index:20;
}

.title{
    flex:1;
    text-align:center;

    font-size:18px;
    font-weight:800;
}

.icon{
    width:42px;
    height:42px;
    flex:0 0 42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#292e39;
    color:#fff;

    font-size:20px;
}


/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:12px 10px 14px;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior:contain;
}

.empty{
    margin-top:30vh;

    text-align:center;

    color:#707783;

    font-size:14px;
}

.note{
    position:relative;

    margin-bottom:10px;
    padding:12px 14px;

    border:1px solid rgba(255,255,255,.055);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #222731,
            #1e222b
        );

    box-shadow:0 4px 18px rgba(0,0,0,.12);

    line-height:1.75;

    overflow:hidden;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.note-content{
    min-width:0;

    overflow-wrap:anywhere;
    word-break:break-word;
}

.note img{
    display:block;
    max-width:100%;
    height:auto;
    margin:6px 0;
    border-radius:8px;
}

.note-menu{
    float:left;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:-3px -5px 2px 7px;

    border-radius:50%;

    background:transparent;
    color:#aab0bb;

    font-size:21px;
}

.note ul,
.note ol{
    margin:7px 0;
    padding-right:27px;
}

.note table{
    display:block;

    width:max-content;
    max-width:100%;

    overflow-x:auto;

    margin:10px 0;

    border-collapse:collapse;
}

.note td,
.note th{
    min-width:48px;

    padding:7px 9px;

    border:1px solid #687080;

    vertical-align:top;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
    word-break:break-word;

    line-height:1.55;
}


/* =========================
   EDITOR AREA
========================= */

.editor-area{
    flex-shrink:0;

    padding:
        5px
        8px
        calc(8px + env(safe-area-inset-bottom));

    background:rgba(25,29,38,.99);

    border-top:1px solid rgba(255,255,255,.08);

    position:relative;
    z-index:30;

    /*
       مهم للموبايل:
       السماح للـvisual viewport بتحديد
       المساحة الظاهرة عند ظهور الكيبورد.
    */
    transition:transform .18s ease;
}

.edit-state{
    height:27px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    color:#9299a5;

    font-size:12px;
}

.cancel{
    width:34px;
    height:27px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:transparent;

    color:#9da4af;

    font-size:21px;

    border-radius:7px;
}


/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;

    gap:5px;

    padding:3px 0 7px;

    overflow-x:auto;

    scrollbar-width:none;

    touch-action:pan-x;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    width:40px;
    height:40px;

    flex:0 0 40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #444b58;

    border-radius:11px;

    background:#292e39;

    color:#fff;

    font-size:17px;

    user-select:none;
}

.tool.active{
    background:#315fae;
    border-color:#6b9bf0;
}

.bold{
    font-weight:900;
}

.underline{
    text-decoration:underline;
    text-decoration-thickness:2px;
    text-underline-offset:0.08in;
}


/* =========================
   SUB TOOLBAR
========================= */

.sub-toolbar{
    display:none;

    align-items:center;

    gap:5px;

    padding:2px 0 7px;

    overflow-x:auto;

    scrollbar-width:none;

    position:relative;
    z-index:40;
}

.sub-toolbar::-webkit-scrollbar{
    display:none;
}

.font-size-bar{
    direction:ltr;
}

.list-bar{
    direction:rtl;
}

.alignment-bar{
    direction:rtl;
}

.font-size-item,
.align-item{
    flex:0 0 auto;

    height:36px;

    border:1px solid #444b58;

    border-radius:9px;

    background:#292e39;

    color:#fff;
}

.font-size-item{
    width:38px;
    font-size:13px;
}

.align-item{
    width:40px;
    font-size:17px;
}

.font-size-item.active,
.align-item.active{
    background:#315fae;
    border-color:#6b9bf0;
}


/* =========================
   WRITE ROW
========================= */

.write-row{
    display:flex;

    align-items:flex-end;

    gap:7px;
}

.editor{
    flex:1;
    min-width:0;

    min-height:49px;
    max-height:175px;

    overflow-y:auto;

    padding:9px 11px;

    border:1px solid #484f5c;

    border-radius:13px;

    background:#0c0f14;

    color:#fff;

    line-height:1.7;

    direction:rtl;
    text-align:right;

    overflow-wrap:anywhere;
    word-break:break-word;

    white-space:pre-wrap;

    caret-color:#fff;

    user-select:text;
    -webkit-user-select:text;

    overscroll-behavior:contain;

    -webkit-overflow-scrolling:touch;

    /*
       مهم مع كيبورد الهاتف حتى لا يختفي
       آخر سطر أثناء الكتابة.
    */
    scroll-padding-bottom:20px;
}

.editor:focus{
    border-color:#4d7fd8;

    box-shadow:
        0 0 0 2px
        rgba(66,120,220,.12);
}

.editor:empty::before{
    content:"اكتبي ملاحظتك هنا...";

    color:#606774;
}

.editor img{
    max-width:100%;
    height:auto;
}

.editor ul,
.editor ol{
    margin:7px 0;
    padding-right:27px;
}

.editor table{
    width:max-content;
    max-width:100%;

    border-collapse:collapse;

    margin:8px 0;
}

.editor td,
.editor th{
    min-width:48px;

    padding:7px 9px;

    border:1px solid #687080;

    vertical-align:top;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
    word-break:break-word;

    direction:rtl;
    text-align:right;

    line-height:1.55;
}

.send{
    width:48px;
    height:48px;

    flex:0 0 48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #4280fa,
            #2c65d8
        );

    color:#fff;

    font-size:21px;
}


/* =========================
   OVERLAYS
========================= */

.overlay{
    display:none;

    position:fixed;

    inset:0;

    z-index:500;

    align-items:center;
    justify-content:center;

    padding:14px;

    background:rgba(0,0,0,.62);

    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
}

.overlay.open{
    display:flex;
}

.panel{
    width:min(94vw,360px);

    max-height:90vh;

    overflow:auto;

    padding:16px;

    border:1px solid #454c59;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #222731,
            #1d2129
        );

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55);
}

.panel-title{
    text-align:center;

    font-size:16px;
    font-weight:800;

    margin-bottom:13px;
}

.panel-button{
    width:100%;

    min-height:43px;

    margin-top:10px;

    border-radius:11px;

    background:#303642;

    color:#fff;
}


/* =========================
   COLOR
========================= */

.color-picker{
    width:270px;
    max-width:78vw;

    margin:10px auto 15px;
}

.color-wheel{
    position:relative;

    width:250px;
    height:250px;

    max-width:72vw;
    max-height:72vw;

    margin:auto;

    border-radius:50%;

    overflow:hidden;

    touch-action:none;
}

.hue-ring{
    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        conic-gradient(
            #ff0000,
            #ffff00,
            #00ff00,
            #00ffff,
            #0000ff,
            #ff00ff,
            #ff0000
        );
}

.sv-area{
    position:absolute;

    inset:13%;

    border-radius:50%;

    overflow:hidden;

    background:
        hsl(
            var(--hue),
            100%,
            50%
        );
}

.sv-white{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to right,
            #fff,
            rgba(255,255,255,0)
        );
}

.sv-black{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0),
            #000
        );
}

.color-marker,
.hue-marker{
    position:absolute;

    pointer-events:none;

    transform:
        translate(-50%,-50%);

    border-radius:50%;
}

.color-marker{
    width:21px;
    height:21px;

    border:3px solid #fff;

    box-shadow:
        0 0 0 2px #000,
        0 0 5px #000;
}

.hue-marker{
    width:19px;
    height:19px;

    border:3px solid #fff;

    box-shadow:
        0 0 0 2px #000;
}

.color-presets{
    display:flex;
    justify-content:center;
    gap:9px;
    margin-top:10px;
}

.color-preset{
    width:37px;
    height:37px;

    border:2px solid #6a7180;
    border-radius:50%;
}

.black-preset{
    background:#000;
}

.white-preset{
    background:#fff;
}


/* =========================
   OTHER PANELS
========================= */

.range-title{
    text-align:center;

    margin-bottom:5px;

    color:#c8cdd6;

    font-size:13px;
}

.range{
    width:100%;
    accent-color:#4c80ff;
}

.highlight-actions{
    display:flex;
    gap:7px;
}

.highlight-actions .panel-button{
    flex:1;
}

.list-choice{
    display:flex;
    gap:7px;
}

.list-choice button{
    flex:1;

    min-height:47px;

    border:1px solid #454c59;

    border-radius:11px;

    background:#292f3a;

    color:#fff;
}

.mind-input,
.search-input{
    width:100%;

    padding:8px 11px;

    border:1px solid #464d5a;

    border-radius:11px;

    background:#0d1015;

    color:#fff;

    outline:none;

    font-size:16px;
}

.mind-input{
    min-height:43px;

    max-height:130px;

    margin-bottom:7px;

    line-height:1.6;

    direction:rtl;
    text-align:right;

    resize:vertical;
}

.search-input{
    height:46px;
}

.search-result{
    min-height:20px;

    margin-top:10px;

    color:#aab0ba;

    text-align:center;

    font-size:13px;
}

.search-highlight{
    outline:2px solid #3471f6;
    outline-offset:2px;
}

.search-word{
    padding:0 2px;
    border-radius:3px;
    background:rgba(255,214,0,.45);
}


/* =========================
   MIND MAP
========================= */

.mind-map{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:12px;

    margin:10px 0;
}

.mind-center{
    width:fit-content;
    max-width:90%;

    padding:9px 15px;

    border:1px solid #5579bd;

    border-radius:12px;

    background:#263657;

    text-align:center;

    line-height:1.6;

    overflow-wrap:anywhere;

    white-space:pre-wrap;
}

.mind-branches{
    width:100%;

    display:flex;
    flex-wrap:wrap;

    justify-content:center;

    gap:9px;
}

.mind-branch{
    width:auto;
    max-width:45%;
    min-width:80px;

    padding:8px 10px;

    border:1px solid #555d6d;

    border-radius:10px;

    background:#292e39;

    text-align:center;

    line-height:1.6;

    overflow-wrap:anywhere;

    white-space:pre-wrap;
}


/* =========================
   MENU
========================= */

.menu{
    display:none;

    position:fixed;

    z-index:1000;

    min-width:145px;

    padding:5px;

    border:1px solid #454c59;

    border-radius:12px;

    background:#20242d;

    box-shadow:
        0 12px 40px
        rgba(0,0,0,.55);
}

.menu.open{
    display:block;
}

.menu button{
    display:block;

    width:100%;

    min-height:42px;

    padding:0 10px;

    border-radius:8px;

    background:transparent;

    color:#fff;

    text-align:right;
}

.menu button:hover{
    background:#303642;
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .header{
        height:55px;
        flex-basis:55px;
    }

    .icon{
        width:40px;
        height:40px;
        flex-basis:40px;
    }

    .messages{
        padding:9px 8px 12px;
    }

    .note{
        padding:11px 12px;
        border-radius:14px;
    }

    .color-wheel{
        width:220px;
        height:220px;
    }

    .editor{
        max-height:155px;
    }

    .tool{
        width:38px;
        height:38px;
        flex-basis:38px;
    }

    .send{
        width:46px;
        height:46px;
        flex-basis:46px;
    }
}

@media(max-height:650px){

    .panel{
        max-height:93vh;
    }

    .editor{
        max-height:125px;
    }

    .messages{
        padding-top:7px;
    }
}


/* =====================================================
   SINGLE COLOR PICKER INDICATOR
===================================================== */

#textColorWheel #textHueMarker,
#highlightColorWheel #highlightHueMarker{
    display:none !important;
}

#textColorWheel #textColorMarker,
#highlightColorWheel #highlightColorMarker{
    display:block !important;
    pointer-events:none;
    z-index:20;
}


#textColorMarker,
#highlightColorMarker{
    width:18px !important;
    height:18px !important;
    border:2px solid #fff !important;
    border-radius:50% !important;
    box-shadow:0 1px 4px rgba(0,0,0,.45) !important;
    transform:translate(-50%,-50%) !important;
    box-sizing:border-box !important;
}


/* =====================================================
   UNDERLINE
===================================================== */

#editor u,
#editor [style*="text-decoration: underline"],
#editor [style*="text-decoration-line: underline"]{
    text-underline-offset:0.08in !important;
}


/* =====================================================
   KEYBOARD / VISUAL VIEWPORT
===================================================== */

html.keyboard-open,
html.keyboard-open body{
    height:100%;
}

body.keyboard-open{
    overflow:hidden;
}

.app.keyboard-open{
    height:100dvh;
}

.editor-area.keyboard-open{
    padding-bottom:
        calc(
            8px +
            env(safe-area-inset-bottom)
        );
}

@supports (height:100svh){

    .app{
        min-height:100svh;
    }
}


/* =====================================================
   EDITING NOTE
===================================================== */

.note.editing-note{
    border-color:#4d7fd8;

    box-shadow:
        0 0 0 1px rgba(77,127,216,.25),
        0 4px 18px rgba(0,0,0,.18);
}

</style>
</head>

<!-- =========================
     HIGHLIGHT

<div
    class="overlay"
    id="highlightOverlay"
>

    <div class="panel">

        <div class="panel-title">تمييز النص</div>

        <div class="color-picker">

            <div
                class="color-wheel"
                id="highlightColorWheel"
                style="--hue:60"
            >

                <div class="hue-ring"></div>

                <div class="sv-area">
                    <div class="sv-white"></div>
                    <div class="sv-black"></div>
                </div>

                <div
                    class="hue-marker"
                    id="highlightHueMarker"
                ></div>

                <div

        const data =
            JSON.parse(raw);

        }else{

    }
}

/* =====================================================
   SELECTION
===================================================== */

function selectionIsInsideEditor(){

    const selection =
        window.getSelection();

    if(
        !selection ||
        selection.rangeCount === 0
    ){

        return false;
    }

    const range =
        selection.getRangeAt(0);

    return (
        editor.contains(
            range.startContainer
        ) &&
        editor.contains(
            range.endContainer
        )
    );
}


function saveSelection(){

    const selection =
        window.getSelection();

    if(
        !selection ||
        selection.rangeCount === 0
    ){

        return false;
    }

    const range =
        selection.getRangeAt(0);

    if(
        !editor.contains(
            range.startContainer
        ) ||
        !editor.contains(
            range.endContainer
        )
    ){

        return false;
    }

    AppState.savedRange =
        range.cloneRange();

    return true;
}


function restoreSelection(){

    const range =
        AppState.savedRange;

    if(!range){

        return false;
    }

    try{

        if(
            !editor.contains(
                range.startContainer
            ) ||
            !editor.contains(
                range.endContainer
            )
        ){

            return false;
        }

        const selection =
            window.getSelection();

        selection.removeAllRanges();

        selection.addRange(range);

        return true;

    }catch(error){

        console.error(
            "restoreSelection:",
            error
        );

        return false;
    }
}


function focusEditorEnd(){

    editor.focus();

    const range =
        document.createRange();

    range.selectNodeContents(
        editor
    );

    range.collapse(false);

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(range);

    AppState.savedRange =
        range.cloneRange();
}


/* =====================================================
   COMMAND
===================================================== */

function runCommand(
    command,
    value=null
){

    editor.focus();

    if(!restoreSelection()){

        focusEditorEnd();
    }

    try{

        document.execCommand(
            command,
            false,
            value
        );

    }catch(error){

        console.error(
            "execCommand:",
            command,
            error
        );
    }

    saveSelection();

    updateToolbar();
}

function applyFontSize(size){

    if(!restoreSelection()){

        focusEditorEnd();
    }

    const selection =
        window.getSelection();

    if(
        !selection ||
        selection.rangeCount === 0
    ){

        return;
    }

    const range =
        selection.getRangeAt(0);

    if(
        !editor.contains(
            range.startContainer
        ) ||
        !editor.contains(
            range.endContainer
        )
    ){

        return;
    }

    try{

        if(range.collapsed){

            const span =
                document.createElement(
                    "span"
                );

            span.style.fontSize =
                size + "px";

            const marker =
                document.createTextNode(
                    "\u200B"
                );

            span.appendChild(
                marker
            );

            range.insertNode(
                span
            );

            const newRange =
                document.createRange();

            newRange.setStart(
                marker,
                marker.length
            );

            newRange.collapse(true);

            selection.removeAllRanges();

            selection.addRange(
                newRange
            );

        }else{

            const startMarker =
                document.createSpan
                ? document.createElement("span")
                : document.createElement("span");

            const endMarker =
                document.createElement(
                    "span"
                );

            startMarker.dataset.fontSizeMarker =
                "start";

            endMarker.dataset.fontSizeMarker =
                "end";

            startMarker.appendChild(
                document.createTextNode(
                    "\u200B"
                )
            );

            endMarker.appendChild(
                document.createTextNode(
                    "\u200B"
                )
            );


            const endRange =
                range.cloneRange();

            endRange.collapse(false);

            endRange.insertNode(
                endMarker
            );


            const startRange =
                range.cloneRange();

            startRange.collapse(true);

            startRange.insertNode(
                startMarker
            );


            const workRange =
                document.createRange();

            workRange.setStartAfter(
                startMarker
            );

            workRange.setEndBefore(
                endMarker
            );


            selection.removeAllRanges();

            selection.addRange(
                workRange
            );


            document.execCommand(
                "fontSize",
                false,
                "7"
            );


            const walker =
                document.createTreeWalker(
                    editor,
                    NodeFilter.SHOW_ELEMENT
                );

            const fonts = [];

            let el;

            while(
                el = walker.nextNode()
            ){

                if(
                    el.tagName === "FONT" &&
                    el.getAttribute("size") === "7"
                ){

                    const r =
                        document.createRange();

                    r.selectNode(el);

                    const beforeStart =
                        r.compareBoundaryPoints(
                            Range.END_TO_START,
                            workRange
                        ) < 0;

                    const afterEnd =
                        r.compareBoundaryPoints(
                            Range.START_TO_END,
                            workRange
                        ) > 0;

                    if(
                        !beforeStart &&
                        !afterEnd
                    ){

                        fonts.push(el);
                    }
                }
            }


            fonts.forEach(
                font => {

                    const span =
                        document.createElement(
                            "span"
                        );

                    span.style.fontSize =
                        size + "px";

                    while(
                        font.firstChild
                    ){

                        span.appendChild(
                            font.firstChild
                        );
                    }

                    font.replaceWith(
                        span
                    );

                }
            );


            startMarker.remove();

            endMarker.remove();

            selection.removeAllRanges();

            try{

                selection.addRange(
                    workRange
                );

            }catch(error){

                focusEditorEnd();
            }

        }

        AppState.fontSize =
            size;

        saveSelection();

        closeSubToolbars();

        updateToolbar();

        editor.focus();

    }catch(error){

        console.error(
            "fontSize:",
            error
        );

        focusEditorEnd();
    }
}

/* =====================================================
   COLOR HELPERS
===================================================== */

function hsvToRgb(
    h,
    s,
    v
){

    s /= 100;

    v /= 100;

    const c =
        v * s;

    const x =
        c *
        (
            1 -
            Math.abs(
                ((h / 60) % 2) - 1
            )
        );

    const m =
        v - c;

    let r = 0;
    let g = 0;
    let b = 0;


    if(h < 60){

        r = c;
        g = x;

    }else if(h < 120){

        r = x;
        g = c;

    }else if(h < 180){

        g = c;
        b = x;

    }else if(h < 240){

        g = x;
        b = c;

    }else if(h < 300){

        r = x;
        b = c;

    }else{

        r = c;
        b = x;
    }


    return {

        r:
            Math.round(
                (r + m) * 255
            ),

        g:
            Math.round(
                (g + m) * 255
            ),

        b:
            Math.round(
                (b + m) * 255
            )
    };
}


function rgbString(rgb){

    return (
        `rgb(${rgb.r},${rgb.g},${rgb.b})`
    );
}


function rgbToHsv(
    r,
    g,
    b
){

    r /= 255;
    g /= 255;
    b /= 255;


    const max =
        Math.max(
            r,
            g,
            b
        );

    const min =
        Math.min(
            r,
            g,
            b
        );

    const d =
        max - min;

    let h = 0;


    if(d !== 0){

        if(max === r){

            h =
                60 *
                (
                    ((g - b) / d) % 6
                );

        }else if(max === g){

            h =
                60 *
                (
                    (b - r) / d + 2
                );

        }else{

            h =
                60 *
                (
                    (r - g) / d + 4
                );
        }
    }


    if(h < 0){

        h += 360;
    }


    const s =
        max === 0
            ? 0
            : d / max * 100;

    const v =
        max * 100;


    return {
        h,
        s,
        v
    };
}


function setupColorWheel(
    wheel,
    hueMarker,
    colorMarker,
    initialHue,
    callback
){

    let hue =
        initialHue;

    let saturation =
        100;

    let value =
        100;

    let mode =
        null;


    function clamp(
        v,
        min,
        max
    ){

        return Math.max(
            min,
            Math.min(
                max,
                v
            )
        );
    }


    function update(){

        wheel.style.setProperty(
            "--hue",
            hue
        );


        const color =
            rgbString(
                hsvToRgb(
                    hue,
                    saturation,
                    value
                )
            );


        colorMarker.style.background =
            color;


        const rect =
            wheel.getBoundingClientRect();

        const width =
            rect.width;

        const height =
            rect.height;


        if(
            !width ||
            !height
        ){

            return;
        }


        const cx =
            width / 2;

        const cy =
            height / 2;

        const radius =
            Math.min(
                width,
                height
            ) / 2;


        const ringRadius =
            radius * .86;

        const angle =
            hue *
            Math.PI /
            180;


        hueMarker.style.left =
            (
                (
                    cx +
                    Math.sin(angle) *
                    ringRadius
                ) /
                width *
                100
            ) +
            "%";


        hueMarker.style.top =
            (
                (
                    cy -
                    Math.cos(angle) *
                    ringRadius
                ) /
                height *
                100
            ) +
            "%";


        const inset =
            .13;

        const left =
            width * inset;

        const top =
            height * inset;

        const innerWidth =
            width *
            (
                1 -
                inset * 2
            );

        const innerHeight =
            height *
            (
                1 -
                inset * 2
            );


        colorMarker.style.left =
            (
                (
                    left +
                    saturation / 100 *
                    innerWidth
                ) /
                width *
                100
            ) +
            "%";


        colorMarker.style.top =
            (
                (
                    top +
                    (
                        1 -
                        value / 100
                    ) *
                    innerHeight
                ) /
                height *
                100
            ) +
            "%";


        callback(
            color
        );
    }


    function hueFromEvent(
        event
    ){

        const rect =
            wheel.getBoundingClientRect();


        const cx =
            rect.left +
            rect.width / 2;

        const cy =
            rect.top +
            rect.height / 2;


        let angle =
            Math.atan2(
                event.clientX - cx,
                -(event.clientY - cy)
            ) *
            180 /
            Math.PI;


        if(angle < 0){

            angle += 360;
        }


        hue =
            angle;

        update();
    }


    function svFromEvent(
        event
    ){

        const rect =
            wheel.getBoundingClientRect();

        const inset =
            .13;


        const left =
            rect.width * inset;

        const top =
            rect.height * inset;

        const width =
            rect.width *
            (
                1 -
                inset * 2
            );

        const height =
            rect.height *
            (
                1 -
                inset * 2
            );


        let x =
            event.clientX -
            rect.left -
            left;

        let y =
            event.clientY -
            rect.top -
            top;


        x =
            clamp(
                x,
                0,
                width
            );

        y =
            clamp(
                y,
                0,
                height
            );


        saturation =
            x /
            width *
            100;

        value =
            100 -
            y /
            height *
            100;


        update();
    }


    function isInsideSV(
        event
    ){

        const rect =
            wheel.getBoundingClientRect();


        const cx =
            rect.left +
            rect.width / 2;

        const cy =
            rect.top +
            rect.height / 2;


        const rx =
            rect.width * .37;

        const ry =
            rect.height * .37;


        const dx =
            (
                event.clientX -
                cx
            ) /
            rx;

        const dy =
            (
                event.clientY -
                cy
            ) /
            ry;


        return (
            dx * dx +
            dy * dy
        ) <= 1;
    }


    wheel.addEventListener(
        "pointerdown",
        event => {

            mode =
                isInsideSV(event)
                    ? "sv"
                    : "hue";


            if(
                mode === "sv"
            ){

                svFromEvent(
                    event
                );

            }else{

                hueFromEvent(
                    event
                );
            }


            try{

                wheel.setPointerCapture(
                    event.pointerId
                );

            }catch(error){}


            event.preventDefault();

        }
    );


    wheel.addEventListener(
        "pointermove",
        event => {

            if(
                mode === "hue"
            ){

                hueFromEvent(
                    event
                );

            }else if(
                mode === "sv"
            ){

                svFromEvent(
                    event
                );
            }

        }
    );


    wheel.addEventListener(
        "pointerup",
        event => {

            mode =
                null;


            try{

                wheel.releasePointerCapture(
                    event.pointerId
                );

            }catch(error){}

        }
    );


    wheel.addEventListener(
        "pointercancel",
        () => {

            mode =
                null;

        }
    );


    window.addEventListener(
        "resize",
        update
    );


    update();


    return {

        setHSV(
            h,
            s,
            v
        ){

            hue =
                h;

            saturation =
                s;

            value =
                v;

            update();
        },


        setRGB(
            r,
            g,
            b
        ){

            const hsv =
                rgbToHsv(
                    r,
                    g,
                    b
                );


            hue =
                hsv.h;

            saturation =
                hsv.s;

            value =
                hsv.v;


            update();
        }

    };
}

function colorToRgb(
    color
){

    const temp =
        document.createElement(
            "span"
        );


    temp.style.color =
        color;


    document.body.appendChild(
        temp
    );


    const computed =
        getComputedStyle(
            temp
        ).color;


    temp.remove();


    const values =
        computed.match(
            /\d+/g
        );


    if(
        !values ||
        values.length < 3
    ){

        return {
            r:255,
            g:255,
            b:0
        };
    }


    return {

        r:
            Number(
                values[0]
            ),

        g:
            Number(
                values[1]
            ),

        b:
            Number(
                values[2]
            )
    };
}

        `${rgb.b},` +
        `${AppState.highlightOpacity}` +
        `)`
    );
}

function applyWordHighlight(){

    if(
        !restoreSelection()
    ){

        return;
    }


    const selection =
        window.getSelection();


    if(
        !selection ||
        selection.rangeCount === 0 ||
        selection.isCollapsed
    ){

        return;
    }


    const range =
        selection.getRangeAt(0);


    if(
        !editor.contains(
            range.commonAncestorContainer
        )
    ){

        return;
    }


    const color =
        getHighlightColor();


    const fragment =
        range.extractContents();


    const highlight =
        document.createElement(
            "span"
        );


    highlight.className =
        "word-text-highlight";


    highlight.style.backgroundColor =
        color;


    highlight.style.padding =
        "0";

    highlight.style.margin =
        "0";

    highlight.style.borderRadius =
        "0";


    highlight.appendChild(
        fragment
    );


    range.insertNode(
        highlight
    );


    const newRange =
        document.createRange();


    newRange.selectNodeContents(
        highlight
    );


    selection.removeAllRanges();

    selection.addRange(
        newRange
    );


    saveSelection();
}


function removeWordHighlight(){

    if(
        !restoreSelection()
    ){

        return;
    }


    const selection =
        window.getSelection();


    if(
        !selection ||
        selection.rangeCount === 0 ||
        selection.isCollapsed
    ){

        return;
    }


    const range =
        selection.getRangeAt(0);


    if(
        !editor.contains(
            range.commonAncestorContainer
        )
    ){

        return;
    }


    const highlights =
        Array.from(
            editor.querySelectorAll(
                ".word-text-highlight"
            )
        );


    highlights.forEach(
        highlight => {

            try{

                if(
                    !range.intersectsNode(
                        highlight
                    )
                ){

                    return;
                }


                const full =
                    document.createRange();


                full.selectNodeContents(
                    highlight
                );


                const coversAll =
                    range.compareBoundaryPoints(
                        Range.START_TO_START,
                        full
                    ) <= 0 &&
                    range.compareBoundaryPoints(
                        Range.END_TO_END,
                        full
                    ) >= 0;


                if(coversAll){

                    const parent =
                        highlight.parentNode;


                    while(
                        highlight.firstChild
                    ){

                        parent.insertBefore(
                            highlight.firstChild,
                            highlight
                        );
                    }


                    parent.removeChild(
                        highlight
                    );


                    return;
                }


                const intersection =
                    document.createRange();


                const startCmp =
                    range.compareBoundaryPoints(
                        Range.START_TO_START,
                        full
                    );


                const endCmp =
                    range.compareBoundaryPoints(
                        Range.END_TO_END,
                        full
                    );


                if(
                    startCmp <= 0
                ){

                    intersection.setStart(
                        full.startContainer,
                        full.startOffset
                    );

                }else{

                    intersection.setStart(
                        range.startContainer,
                        range.startOffset
                    );
                }


                if(
                    endCmp >= 0
                ){

                    intersection.setEnd(
                        full.endContainer,
                        full.endOffset
                    );

                }else{

                    intersection.setEnd(
                        range.endContainer,
                        range.endOffset
                    );
                }


                if(
                    intersection.collapsed
                ){

                    return;
                }


                const fragment =
                    intersection.extractContents();


                const plain =
                    document.createElement(
                        "span"
                    );


                plain.className =
                    "word-text-no-highlight";


                plain.style.backgroundColor =
                    "transparent";


                plain.appendChild(
                    fragment
                );


                intersection.insertNode(
                    plain
                );


            }catch(error){

                console.error(
                    "removeWordHighlight:",
                    error
                );
            }

        }
    );


    saveSelection();
}

function updateTableInfo(){

function createTable(rows,cols){

    const table = document.createElement("table");

    const tbody = document.createElement("tbody");

    for(let r = 0; r < rows; r++){

        const tr = document.createElement("tr");

        for(let c = 0; c < cols; c++){

            const td = document.createElement("td");

            td.contentEditable = "true";
            td.innerHTML = "<br>";

            tr.appendChild(td);
        }

        tbody.appendChild(tr);
    }

    table.appendChild(tbody);

    return table;
}


function insertElement(element){

    editor.focus();

    if(!restoreSelection()){
        focusEditorEnd();
    }

    const selection = window.getSelection();

    if(
        !selection ||
        selection.rangeCount === 0
    ){

        editor.appendChild(element);

        focusEditorEnd();

        return;
    }

    const range = selection.getRangeAt(0);

    if(
        !editor.contains(range.startContainer) ||
        !editor.contains(range.endContainer)
    ){

        editor.appendChild(element);

        focusEditorEnd();

        return;
    }

    range.deleteContents();

    range.insertNode(element);

    const marker = document.createTextNode("\u200B");

    if(element.parentNode){

        element.parentNode.insertBefore(
            marker,
            element.nextSibling
        );
    }

    const newRange = document.createRange();

    newRange.setStart(
        marker,
        marker.length
    );

    newRange.collapse(true);

    selection.removeAllRanges();
    selection.addRange(newRange);

    AppState.savedRange = newRange.cloneRange();
}

function clearSearchHighlights(){

    document
        .querySelectorAll(".search-word")
        .forEach(span => {

            const parent = span.parentNode;

            if(!parent){
                return;
            }

            while(span.firstChild){

                parent.insertBefore(
                    span.firstChild,
                    span
                );
            }

            span.remove();
        });

    document
        .querySelectorAll(".search-highlight")
        .forEach(element => {

            element.classList.remove(
                "search-highlight"
            );
        });
}


function highlightTextNode(node,query){

    const text = node.nodeValue;

    if(!text || !query){
        return 0;
    }

    const lower = text.toLocaleLowerCase();
    const q = query.toLocaleLowerCase();

    let index = lower.indexOf(q);

    if(index === -1){
        return 0;
    }

    const fragment =
        document.createDocumentFragment();

    let last = 0;
    let count = 0;

    while(index !== -1){

        fragment.appendChild(
            document.createTextNode(
                text.slice(last,index)
            )
        );

        const mark =
            document.createElement("span");

        mark.className = "search-word";

        mark.textContent =
            text.slice(
                index,
                index + query.length
            );

        fragment.appendChild(mark);

        count++;

        last = index + query.length;

        index = lower.indexOf(q,last);
    }

    fragment.appendChild(
        document.createTextNode(
            text.slice(last)
        )
    );

    node.parentNode.replaceChild(
        fragment,
        node
    );

    return count;
}


function highlightNote(content,query){

    let count = 0;

    const walker =
        document.createTreeWalker(
            content,
            NodeFilter.SHOW_TEXT
        );

    const nodes = [];

    let node;

    while(node = walker.nextNode()){

        if(
            node.parentElement &&
            node.parentElement.closest(".search-word")
        ){
            continue;
        }

        if(
            node.nodeValue
                .toLocaleLowerCase()
                .includes(query.toLocaleLowerCase())
        ){

            nodes.push(node);
        }
    }

    nodes.forEach(textNode => {

        count += highlightTextNode(
            textNode,
            query
        );
    });

    return count;
}


function performSearch(){

    clearSearchHighlights();

    const query =
        searchInput.value.trim();

    if(!query){

        searchResult.textContent = "";

        return;
    }

    const notes =
        messages.querySelectorAll(".note");

    let noteCount = 0;
    let matchCount = 0;
    let first = null;

    notes.forEach(note => {

        const content =
            note.querySelector(".note-content");

        if(!content){
            return;
        }

        if(
            content.textContent
                .toLocaleLowerCase()
                .includes(query.toLocaleLowerCase())
        ){

            noteCount++;

            if(!first){
                first = note;
            }
        }
    });


    if(!first){

        searchResult.textContent =
            "لم يتم العثور على النص";

        return;
    }


    notes.forEach(note => {

        const content =
            note.querySelector(".note-content");

        if(content){

            matchCount += highlightNote(
                content,
                query
            );
        }
    });


    first.classList.add(
        "search-highlight"
    );

    first.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

    searchResult.textContent =
        `تم العثور على ${matchCount} نتيجة في ${noteCount} ملاحظة`;
}

                updateToolbar();

            },
            50
        );
    }
);


/* =====================================================
   DELETE
===================================================== */

$("deleteButton").addEventListener(
    "click",
    event => {

        event.preventDefault();
        event.stopPropagation();

        const noteId =
            messageMenu.dataset.noteId || "";

        const index =
            AppState.notes.findIndex(
                note => note.id === noteId
            );

        if(index < 0){

            closeMessageMenu();

            return;
        }

        AppState.selectedIndex = index;

        const confirmed =
            window.confirm(
                "هل تريدين حذف هذه الملاحظة؟"
            );

        if(!confirmed){

            closeMessageMenu();

            return;
        }

        const removed =
            AppState.notes.splice(index,1)[0];

        if(!saveNotes()){

            AppState.notes.splice(
                index,
                0,
                removed
            );

            renderNotes();
            closeMessageMenu();

            return;
        }


        if(AppState.editingId === noteId){

            resetEditor();

        }else if(
            AppState.editingIndex > index
        ){

            AppState.editingIndex--;
        }


        AppState.selectedIndex = -1;

        renderNotes();

        closeMessageMenu();
    }
);

/* =====================================================
   PASTE
===================================================== */

editor.addEventListener(
    "paste",
    event => {

        event.preventDefault();

        const clipboard =
            event.clipboardData ||
            window.clipboardData;

        if(!clipboard){
            return;
        }

        const text =
            clipboard.getData("text/plain");

        if(!text){
            return;
        }

        if(!restoreSelection()){
            focusEditorEnd();
        }

        const selection =
            window.getSelection();

        if(
            !selection ||
            selection.rangeCount === 0
        ){
            return;
        }

        const range =
            selection.getRangeAt(0);

        if(
            !editor.contains(range.startContainer) ||
            !editor.contains(range.endContainer)
        ){
            return;
        }

        range.deleteContents();

        const fragment =
            document.createDocumentFragment();

        const lines =
            text
                .replace(/\r\n/g,"\n")
                .replace(/\r/g,"\n")
                .split("\n");


        lines.forEach(
            (line,index) => {

                if(index > 0){

                    fragment.appendChild(
                        document.createElement("br")
                    );
                }

                fragment.appendChild(
                    document.createTextNode(line)
                );
            }
        );


        range.insertNode(fragment);

        range.collapse(false);

        selection.removeAllRanges();
        selection.addRange(range);

        AppState.savedRange =
            range.cloneRange();
    }
);


/* =====================================================
   TABLE TAB
===================================================== */

editor.addEventListener(
    "keydown",
    event => {

        const cell =
            event.target &&
            event.target.closest
                ? event.target.closest("td,th")
                : null;

        if(!cell){
            return;
        }

        if(event.key !== "Tab"){
            return;
        }

        event.preventDefault();

        const cells =
            Array.from(
                editor.querySelectorAll(
                    "table td, table th"
                )
            );

        const index =
            cells.indexOf(cell);

        const next =
            cells[
                event.shiftKey
                    ? index - 1
                    : index + 1
            ];

        if(!next){
            return;
        }

        next.focus();

        const range =
            document.createRange();

        range.selectNodeContents(next);
        range.collapse(false);

        const selection =
            window.getSelection();

        selection.removeAllRanges();
        selection.addRange(range);

        AppState.savedRange =
            range.cloneRange();
    }
);
