<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover">

<meta name="theme-color" content="#10131a">

<title>ملاحظاتي</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#10131a;
    color:#fff;
    font-family:Arial,"Noto Sans Arabic",sans-serif;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    touch-action:manipulation;
}

:root{
    --app-height:100dvh;
}

.app{
    width:100%;
    max-width:900px;
    height:var(--app-height);
    margin:auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#10131a;
}

.header{
    flex:0 0 auto;
    min-height:56px;
    padding:8px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#171b24;
    border-bottom:1px solid #292e3a;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:6px;
}

.header-actions button{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#252b36;
    color:#fff;
    font-size:21px;
}

.header-actions button:active{
    transform:scale(.94);
}

.messages{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px;
    scroll-behavior:smooth;
}

.empty{
    padding:50px 20px;
    text-align:center;
    color:#7f8795;
}

.note{
    position:relative;
    max-width:92%;
    margin:0 0 12px auto;
    padding:14px 44px 14px 14px;
    background:#202631;
    border:1px solid #2c3441;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.note.editing{
    border-color:#527df5;
}

.note-content{
    min-width:0;
    font-size:17px;
    line-height:1.8;
    word-break:break-word;
    overflow-wrap:anywhere;
}

.note-menu{
    position:absolute;
    top:8px;
    left:7px;
    width:32px;
    height:32px;
    border-radius:9px;
    background:#2b323e;
    color:#fff;
    font-size:21px;
}

.note-menu:active{
    transform:scale(.94);
}

.editor-area{
    position:relative;
    flex:0 0 auto;
    padding:8px 10px 10px;
    background:#151922;
    border-top:1px solid #292e3a;
}

.editor-state{
    margin:0 5px 6px;
    color:#8e98a8;
    font-size:12px;
}

.editor{
    min-height:95px;
    max-height:30vh;
    overflow-y:auto;
    padding:13px;
    border:1px solid #303745;
    border-radius:14px;
    background:#1c212b;
    color:#fff;
    outline:none;

    direction:rtl;
    text-align:right;

    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;

    line-height:1.8;
}
      
      .editor{
    width:80%;
    margin:0 auto;
      }

.editor:empty::before{
    content:"اكتبي ملاحظتك هنا…";
    color:#737d8e;
    pointer-events:none;
}

.editor:focus{
    border-color:#527df5;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    padding:7px 0 2px;
    scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 auto;
    width:52px;
    height:52px;
    border-radius:13px;
    background:#252c38;
    color:#fff;
    font-size:22px;
    font-weight:bold;
    transition:transform .08s,background .12s;
}

.tool.active{
    background:#4169d8;
}

.tool:active{
    transform:scale(.90);
}

.sub-toolbar{
    display:none;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    padding:5px 0;
    scrollbar-width:none;
}

.sub-toolbar::-webkit-scrollbar{
    display:none;
}

.sub-toolbar button{
    flex:0 0 auto;
    min-width:52px;
    height:48px;
    padding:0 12px;
    border-radius:12px;
    background:#292f3b;
    color:#fff;
    font-size:18px;
}

.sub-toolbar button.active{
    background:#4169d8;
}

.sub-toolbar button:active{
    transform:scale(.94);
}

.editor-actions{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:6px;
}

.send-button{
    position:absolute;
    top:-54px;
    left:10px;
    flex:0 0 46px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#3867dc;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.cancel-button{
    flex:0 0 38px;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#252c38;
    color:#fff;
    font-size:17px;
}

.undo-button{
    flex:0 0 46px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#303744;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:normal;
    line-height:1;
}

.undo-button:active{
    transform:scale(.92);
}

.send-button:active,
.cancel-button:active{
    transform:scale(.96);
}

.message-menu{
    position:fixed;
    z-index:2000;
    display:none;
    min-width:140px;
    padding:5px;
    background:#252b36;
    border:1px solid #3a4250;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.message-menu.open{
    display:block;
}

.message-menu button{
    display:block;
    width:100%;
    padding:11px;
    border-radius:8px;
    background:transparent;
    color:#fff;
    text-align:right;
}

.message-menu button:active{
    background:#343c4a;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:1500;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.62);
}

.overlay.open{
    display:flex;
}

.overlay-box{
    width:min(600px,100%);
    max-height:90dvh;
    overflow-y:auto;
    padding:18px;
    background:#191e27;
    border:1px solid #343b48;
    border-radius:22px 22px 0 0;
}

.overlay-title{
    margin-bottom:15px;
    font-size:18px;
    font-weight:bold;
}

.overlay-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
}

.overlay-actions button{
    flex:1;
    min-height:42px;
    border-radius:11px;
    background:#303744;
    color:#fff;
}

.overlay-actions .primary{
    background:#3867dc;
}

#colorOverlay{
    position:fixed;
    inset:auto 0 80px 0;
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:0 10px 10px;
    background:transparent;
}

#colorOverlay.open{
    display:flex;
}

#colorOverlay .overlay-box{
    position:relative;
    width:min(360px,92vw);
    max-height:none;
    padding:14px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.45);
}

#colorOverlay .color-wheel{
    width:min(240px,68vw);
    margin:0 auto 12px;
}

.close-color-overlay{
    position:absolute;
    top:10px;
    left:10px;
    width:36px;
    height:36px;
    border-radius:10px;
    background:#303744;
    color:#fff;
    font-size:20px;
}

.close-color-overlay:active{
    transform:scale(.94);
}

.color-wheel{
    position:relative;
    width:min(300px,80vw);
    aspect-ratio:1;
    margin:12px auto;
    border-radius:50%;
    overflow:hidden;
    touch-action:none;

    background:
        radial-gradient(
            circle at center,
            #fff 0%,
            rgba(255,255,255,0) 58%
        ),
        radial-gradient(
            circle at center,
            rgba(0,0,0,0) 35%,
            rgba(0,0,0,.9) 100%
        ),
        conic-gradient(
            red,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
        );
}

.color-marker{
    position:absolute;
    z-index:5;
    width:18px;
    height:18px;
    margin:-9px;
    border:2px solid #fff;
    border-radius:50%;
    box-shadow:0 1px 5px #000;
    pointer-events:none;
}

.color-presets{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:10px;
}

.color-preset{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid #fff;
}

#blackText{
    background:#000;
}

#whiteText{
    background:#fff;
}

.range-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
}

.range-row span{
    white-space:nowrap;
}

.range-row input{
    flex:1;
}

.counter-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:20px 0;
}

.counter-box button{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#303744;
    color:#fff;
    font-size:22px;
}

.counter-box strong{
    min-width:55px;
    text-align:center;
    font-size:19px;
}

.editor-table{
    width:auto;
    max-width:100%;
    margin:8px 0;
    border-collapse:collapse;
    table-layout:auto;
}

.editor-table td,
.editor-table th{
    padding:8px;
    min-width:50px;
    height:50px;
    border:3px solid #697386;
    vertical-align:top;
    line-height:1.6;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.editor-table td:focus,
.editor-table th:focus{
    outline:1px solid #527df5;
}

.table-wrapper{
    display:block;
    width:100%;
}

.table-text-line{
    min-height:1.8em;
    display:block;
}

.mind-box{
    width:fit-content;
    max-width:100%;
    margin:4px auto;
    padding:4px;
    background:transparent;
    overflow:hidden;
}

.mind-box-root{
    width:100%;
    min-width:140px;
    min-height:50px;
    max-width:100%;
    margin:0 auto;
    padding:5px 8px;
    border:2px solid #fff;
    border-radius:10px;
    background:transparent;
    text-align:center;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.6;
    white-space:pre-wrap;
}

.mind-box-branches{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap:4px;
    margin-top:6px;
}

.mind-box-branch{
    flex:0 1 auto;
    width:fit-content;
    max-width:220px;
    min-width:90px;
    min-height:45px;
    padding:7px 9px;
    border:2px solid #fff;
    border-radius:10px;
    background:transparent;
    text-align:center;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.6;
    white-space:pre-wrap;
}

.mind-box-root ul,
.mind-box-root ol,
.mind-box-branch ul,
.mind-box-branch ol{
    margin:0;
    padding-inline-start:16px;
}

.mind-box-root:empty::before{
    content:"الفكرة الرئيسية";
    color:#737d8e;
    pointer-events:none;
}

.mind-box-branch:empty::before{
    content:"اكتبي الفرع";
    color:#737d8e;
    pointer-events:none;
}

.search-input{
    width:100%;
    height:44px;
    padding:0 12px;
    border:1px solid #3a4250;
    border-radius:11px;
    outline:none;
    background:#202631;
    color:#fff;
    direction:rtl;
}

.search-input:focus{
    border-color:#527df5;
}

.search-result{
    margin-top:12px;
    color:#aab3c2;
}

.search-word{
    background:#ffe600;
    color:#111;
    border-radius:3px;
    padding:0 2px;
}

.search-highlight{
    outline:2px solid #ffc107;
    outline-offset:2px;
}

.editor u{
    text-decoration-line:underline;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
    text-decoration-skip-ink:none;
}

.word-text-highlight{
    -webkit-box-decoration-break:clone;
    box-decoration-break:clone;
}

body.keyboard-open .editor-area{
    padding-bottom:max(
        8px,
        env(safe-area-inset-bottom)
    );
}

body.keyboard-open #colorOverlay{
    bottom:0;
}

@media(max-width:600px){

    .note{
        max-width:96%;
    }

    .editor{
        max-height:32vh;
    }

    .overlay-box{
        padding:15px;
    }
}

/* =====================================================
   COLLAPSIBLE SECTION
===================================================== */

.collapsible-section{
    width:100%;
    margin:8px 0;
    border:1px solid #3a4250;
    border-radius:12px;
    overflow:hidden;
    background:#202631;
}

.collapsible-title{
    width:100%;
    min-height:48px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#252c38;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

.collapsible-arrow{
    flex:0 0 auto;
    font-size:16px;
    transition:transform .2s;
}

.collapsible-title-text{
    flex:1;
    min-width:0;
    outline:none;
}

.collapsible-title-text:empty::before{
    content:"اكتبي العنوان";
    color:#737d8e;
    pointer-events:none;
}

.collapsible-content{
    padding:12px 14px;
    min-height:60px;
    outline:none;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
}

.collapsible-content:empty::before{
    content:"اكتبي هنا...";
    color:#737d8e;
    pointer-events:none;
}

.collapsible-section.closed .collapsible-content{
    display:none;
}

.collapsible-section.closed .collapsible-arrow{
    transform:rotate(-90deg);
}

</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="title">
        ملاحظاتي
    </div>

    <div class="header-actions">

        <button
            id="newButton"
            type="button"
            aria-label="جديد">
            ＋
        </button>

        <button
            id="searchButton"
            type="button"
            aria-label="بحث">
            ⌕
        </button>

    </div>

</header>

<main
    id="messages"
    class="messages">
</main>

<section class="editor-area">

    <div
        id="state"
        class="editor-state">
        رسالة جديدة
    </div>

    <div
        id="editor"
        class="editor"
        contenteditable="true"
        spellcheck="true">
    </div>

    <button
        id="sendButton"
        class="send-button"
        type="button"
        aria-label="حفظ">
        ➤
    </button>

    <div
        id="colorOverlay"
        class="overlay">

        <div class="overlay-box">

            <button
                id="closeColorOverlay"
                class="close-color-overlay"
                type="button">
                ✕
            </button>

            <div class="overlay-title">
                ◉
            </div>

            <div
                id="textColorWheel"
                class="color-wheel">

                <span
                    id="textColorMarker"
                    class="color-marker">
                </span>

            </div>

            <div class="color-presets">

                <button
                    id="blackText"
                    class="color-preset"
                    type="button"
                    aria-label="أسود">
                </button>

                <button
                    id="whiteText"
                    class="color-preset"
                    type="button"
                    aria-label="أبيض">
                </button>

            </div>

            <div
                id="highlightOpacity"
                class="range-row"
                style="display:none;">

                <span>◉</span>

                <input
                    id="opacityRange"
                    type="range"
                    min="0"
                    max="100"
                    value="60">

            </div>

            <div class="overlay-actions">

                <button
                    id="removeHighlight"
                    type="button">
                    إزالة التمييز
                </button>

                <button
                    id="colorDone"
                    type="button"
                    class="primary">
                    ✓
                </button>

            </div>

        </div>

    </div>

    <div class="toolbar">

        <button
            id="boldButton"
            class="tool"
            type="button"
            aria-label="عريض">
            <b>B</b>
        </button>

        <button
            id="italicButton"
            class="tool"
            type="button"
            aria-label="مائل">
            <i>I</i>
        </button>

        <button
            id="underlineButton"
            class="tool"
            type="button"
            aria-label="تسطير">
            <u>U</u>
        </button>

        <button
            id="sizeButton"
            class="tool"
            type="button"
            aria-label="حجم">
            A
        </button>

        <button
            id="listButton"
            class="tool"
            type="button"
            aria-label="قائمة">
            ≡
        </button>

        <button
            id="alignmentButton"
            class="tool"
            type="button"
            aria-label="محاذاة">
            ≡
        </button>

        <button
            id="colorButton"
            class="tool"
            type="button"
            aria-label="لون">
            ◉
        </button>

        <button
            id="highlightButton"
            class="tool"
            type="button"
            aria-label="تمييز">
            ▰
        </button>

        <button
            id="tableButton"
            class="tool"
            type="button"
            aria-label="جدول">
            ▦
        </button>

        <button
            id="mindMapButton"
            class="tool"
            type="button"
            aria-label="مربع">
            ▣
        </button>

        <button
            id="addMindLeftButton"
            class="tool"
            type="button"
            aria-label="إضافة فكرة أو فرع">
            ⬅️
        </button>

        <button
            id="addTableRowButton"
            class="tool"
            type="button"
            aria-label="إضافة صف للجدول">
            ⬇️
        </button>
          
<button
    id="collapsibleButton"
    class="tool"
    type="button"
    aria-label="قسم قابل للفتح والإغلاق">
    ▾
</button>
          
        <button
            id="newLineDownButton"
            class="tool"
            type="button"
            aria-label="بداية سطر جديد لأسفل">
            ⇩
        </button>

        <button
            id="newLineUpButton"
            class="tool"
            type="button"
            aria-label="بداية سطر جديد لأعلى">
            ⇧
        </button>

    </div>

    <div
        id="fontSizeBar"
        class="sub-toolbar">
    </div>

    <div
        id="listBar"
        class="sub-toolbar">
    </div>

    <div
        id="alignmentBar"
        class="sub-toolbar">

        <button
            type="button"
            data-align="right">
            ≫
        </button>

        <button
            type="button"
            data-align="center">
            ≡
        </button>

        <button
            type="button"
            data-align="left">
            ≪
        </button>

        <button
            type="button"
            data-align="justify">
            ▤
        </button>

    </div>

    <div class="editor-actions">

        <button
            id="undoButton"
            class="undo-button"
            type="button"
            aria-label="تراجع">
            ↶
        </button>

        <button
            id="cancelButton"
            class="cancel-button"
            type="button"
            aria-label="إلغاء">
            ✕
        </button>

    </div>

</section>

</div>

<div
    id="messageMenu"
    class="message-menu">

    <button
        id="editButton"
        type="button"
        aria-label="تعديل">
        ✎
    </button>

    <button
        id="deleteButton"
        type="button"
        aria-label="حذف">
        🗑
    </button>

</div>

<div
    id="searchOverlay"
    class="overlay">

    <div class="overlay-box">

        <div class="overlay-title">
            ⌕
        </div>

        <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off">

        <div
            id="searchResult"
            class="search-result">
        </div>

        <div class="overlay-actions">

            <button
                id="searchDone"
                class="primary"
                type="button">
                ✕
            </button>

        </div>

    </div>

</div>

<script>

const editor = document.getElementById("editor");
editor.innerHTML = "";

const boldButton =
    document.getElementById("boldButton");

const italicButton =
    document.getElementById("italicButton");

const underlineButton =
    document.getElementById("underlineButton");


/* =====================================================
   التنسيقات التي ستبدأ بها الكتابة الجديدة
===================================================== */

const pendingFormats = {
    bold:false,
    italic:false,
    underline:false
};

      let selectedFontSize = null;

/* =====================================================
   ألوان الكتابة الجديدة
===================================================== */

let selectedColor = null;
let colorMode = "text";
let colorActive = false;


/* =====================================================
   تمييز الكتابة الجديدة
===================================================== */

let highlightActive = false;


/* =====================================================
   تحديث أزرار التنسيق
===================================================== */

function updateFormatButtons(){

    const selection =
        window.getSelection();

    if(
        !selection ||
        !selection.rangeCount
    ){
        return;
    }

    const range =
        selection.getRangeAt(0);

    if(
        !editor.contains(range.startContainer)
    ){
        return;
    }

    if(!range.collapsed){

        boldButton.classList.toggle(
            "active",
            document.queryCommandState("bold")
        );

        italicButton.classList.toggle(
            "active",
            document.queryCommandState("italic")
        );

        underlineButton.classList.toggle(
            "active",
            document.queryCommandState("underline")
        );

        return;
    }

    boldButton.classList.toggle(
        "active",
        pendingFormats.bold
    );

    italicButton.classList.toggle(
        "active",
        pendingFormats.italic
    );

    underlineButton.classList.toggle(
        "active",
        pendingFormats.underline
    );
}


/* =====================================================
   كتابة النص مع التنسيقات المختارة
===================================================== */

editor.addEventListener(
    "beforeinput",
    (event) => {

        if(event.inputType !== "insertText"){
            return;
        }

        if(
            !pendingFormats.bold &&
            !pendingFormats.italic &&
            !pendingFormats.underline &&
            !selectedFontSize &&
            !colorActive &&
            !highlightActive
        ){
            return;
        }

        const selection =
            window.getSelection();

        if(
            !selection ||
            !selection.rangeCount
        ){
            return;
        }

        const range =
            selection.getRangeAt(0);

        if(
            !editor.contains(range.startContainer)
        ){
            return;
        }

        event.preventDefault();

        const span =
            document.createElement("span");


        /* =========================
           BOLD
        ========================= */

        if(pendingFormats.bold){
            span.style.fontWeight = "bold";
        }


        /* =========================
           ITALIC
        ========================= */

        if(pendingFormats.italic){
            span.style.fontStyle = "italic";
        }


        /* =========================
           UNDERLINE
        ========================= */

        if(pendingFormats.underline){
            span.style.textDecoration = "underline";
        }

/* =========================
   FONT SIZE
========================= */

if(selectedFontSize){
    span.style.fontSize =
        selectedFontSize + "px";
}
          
        /* =========================
           لون الخط
        ========================= */

        if(
            colorActive &&
            colorMode === "text" &&
            selectedColor
        ){

            span.style.color =
                selectedColor;
        }


        /* =========================
           التمييز
        ========================= */

        if(
            highlightActive &&
            colorMode === "highlight" &&
            selectedColor
        ){

            const opacity =
                Number(opacityRange.value) / 100;

            span.style.backgroundColor =
                makeHighlightColor(
                    selectedColor,
                    opacity
                );

            span.classList.add(
                "word-text-highlight"
            );
        }


        span.textContent =
            event.data || "";


        range.deleteContents();

        range.insertNode(span);


        /* =========================
           المؤشر بعد الحرف مباشرة
        ========================= */

        const newRange =
            document.createRange();

        newRange.setStartAfter(span);
        newRange.collapse(true);

        selection.removeAllRanges();
        selection.addRange(newRange);

        updateFormatButtons();
    }
);

/* =====================================================
   تحويل اللون إلى لون تمييز
===================================================== */

function makeHighlightColor(
    color,
    opacity
){

    if(
        color.startsWith("hsl")
    ){

        return color
            .replace(
                "hsl(",
                "hsla("
            )
            .replace(
                ")",
                `, ${opacity})`
            );
    }

    if(
        color.startsWith("#")
    ){

        let hex =
            color.replace(
                "#",
                ""
            );

        if(hex.length === 3){

            hex =
                hex[0] + hex[0] +
                hex[1] + hex[1] +
                hex[2] + hex[2];
        }

        const r =
            parseInt(
                hex.substring(0,2),
                16
            );

        const g =
            parseInt(
                hex.substring(2,4),
                16
            );

        const b =
            parseInt(
                hex.substring(4,6),
                16
            );

        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
    }

    return color;
}

/* =====================================================
   عجلة الألوان
===================================================== */

textColorWheel.addEventListener(
    "pointerdown",
    (event) => {

        /*
           أهم سطر في النظام كله:
           يمنع عجلة الألوان من أخذ التركيز
           وبالتالي لا يتحرك المؤشر من مكانه.
        */
        event.preventDefault();

        const selection =
            window.getSelection();

        if(
            !selection ||
            !selection.rangeCount
        ){
            return;
        }

        const range =
            selection.getRangeAt(0);

        if(
            !editor.contains(
                range.commonAncestorContainer
            )
        ){
            return;
        }

        const rect =
            textColorWheel.getBoundingClientRect();

        const x =
            event.clientX -
            rect.left;

        const y =
            event.clientY -
            rect.top;

        const centerX =
            rect.width / 2;

        const centerY =
            rect.height / 2;

        const dx =
            x - centerX;

        const dy =
            y - centerY;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const radius =
            Math.min(
                centerX,
                centerY
            );

        const angle =
            Math.atan2(
                dy,
                dx
            );

        const hue =
            (
                angle *
                180 /
                Math.PI +
                360 +
                90
            ) % 360;

        const saturation =
            Math.min(
                distance / radius,
                1
            ) * 100;

        const lightness =
            100 -
            Math.min(
                distance / radius,
                1
            ) * 50;

        selectedColor =
            `hsl(${hue}, ${saturation}%, ${lightness}%)`;

        textColorMarker.style.left =
            x + "px";

        textColorMarker.style.top =
            y + "px";


        /* =========================
           اللون
        ========================= */

        if(
            colorMode === "text"
        ){

            colorActive = true;
            highlightActive = false;

            /*
               لو يوجد تحديد:
               نطبقه مباشرة.

               لو يوجد مؤشر فقط:
               لا نغير مكانه،
               ونترك اللون للكتابة القادمة.
            */

            if(!range.collapsed){

                document.execCommand(
                    "foreColor",
                    false,
                    selectedColor
                );
            }

            return;
        }


        /* =========================
           التمييز
        ========================= */

        if(
            colorMode === "highlight"
        ){

            highlightActive = true;
            colorActive = false;

            if(!range.collapsed){

                const opacity =
                    Number(
                        opacityRange.value
                    ) / 100;

                const color =
                    makeHighlightColor(
                        selectedColor,
                        opacity
                    );

                document.execCommand(
                    "hiliteColor",
                    false,
                    color
                );
            }
        }
    }
);

/* =====================================================
   INSERT AT CURSOR
===================================================== */

function insertAtCursor(element){

    editor.focus();

    const selection =
        window.getSelection();

    if(
        !selection ||
        !selection.rangeCount
    ){

        editor.appendChild(
            element
        );

        return;
    }

    const range =
        selection.getRangeAt(0);

    if(
        !editor.contains(
            range.commonAncestorContainer
        )
    ){

        editor.appendChild(
            element
        );

        return;
    }

    range.deleteContents();

    range.insertNode(
        element
    );

    selection.removeAllRanges();

    const newRange =
        document.createRange();

    newRange.setStartAfter(
        element
    );

    newRange.collapse(true);

    selection.addRange(
        newRange
    );
}

/* =====================================================
   تشغيل القسم القابل للفتح والإغلاق
===================================================== */

function setupCollapsibleSection(section){

    const title =
        section.querySelector(
            ".collapsible-title"
        );

    const titleText =
        section.querySelector(
            ".collapsible-title-text"
        );

    if(!title || !titleText){
        return;
    }


    /* الضغط على شريط العنوان أو السهم */
    title.addEventListener(
        "click",
        (event) => {

            /*
               الضغط داخل نص العنوان لا يفتح ولا يغلق القسم
            */
            if(
                event.target.closest(
                    ".collapsible-title-text"
                )
            ){
                return;
            }

            section.classList.toggle(
                "closed"
            );
        }
    );


    /*
       منع الضغط داخل العنوان من الوصول
       إلى حدث فتح وإغلاق القسم
    */
    titleText.addEventListener(
        "click",
        (event) => {

            event.stopPropagation();
        }
    );


    titleText.addEventListener(
        "pointerdown",
        (event) => {

            event.stopPropagation();
        }
    );
}

/* =====================================================
   TABLE BACKSPACE
   حذف الخلية الفارغة بزر Backspace
===================================================== */

editor.addEventListener(
    "keydown",
    (event) => {

        if(event.key !== "Backspace"){
            return;
        }

        const selection =
            window.getSelection();

        if(
            !selection ||
            !selection.rangeCount ||
            !selection.isCollapsed
        ){
            return;
        }

        let element =
            selection.anchorNode.nodeType === 1
                ? selection.anchorNode
                : selection.anchorNode.parentElement;

        if(!element){
            return;
        }


        /* =========================
           البحث عن الخلية الحالية
        ========================= */

        const cell =
            element.closest(
                ".editor-table td, .editor-table th"
            );

        if(!cell){
            return;
        }


        /* =========================
           التأكد أن الخلية فارغة
        ========================= */

        const isEmpty =
            cell.textContent.trim() === "" &&
            !cell.querySelector(
                "img, table, .mind-box"
            );

        if(!isEmpty){
            return;
        }


        /* =========================
           التأكد أن المؤشر داخل الخلية
        ========================= */

        const range =
            selection.getRangeAt(0);

        if(
            !cell.contains(
                range.startContainer
            )
        ){
            return;
        }


        /*
           الآن فقط نمنع Backspace
           ونحذف الخلية.
        */

        event.preventDefault();


        /* =========================
           الجدول والصف
        ========================= */

        const row =
            cell.closest("tr");

        const table =
            cell.closest(
                ".editor-table"
            );

        if(
            !row ||
            !table
        ){
            return;
        }


        /* =========================
           رقم الخلية قبل حذفها
        ========================= */

        const cellIndex =
            cell.cellIndex;


        /* =========================
           حذف الخلية
        ========================= */

        cell.remove();


        /* =========================
           لو الصف أصبح فارغًا
        ========================= */

        if(
            row.cells.length === 0
        ){

            row.remove();
        }


        /* =========================
           لو الجدول أصبح بدون صفوف
        ========================= */

        if(
            table.rows.length === 0
        ){

            const wrapper =
                table.closest(
                    ".table-wrapper"
                );

            if(wrapper){

                wrapper.remove();

            }else{

                table.remove();
            }

            editor.focus();

            return;
        }


        /* =========================
           تحديد خلية مناسبة للمؤشر
        ========================= */

        let targetRow =
            row;

        /*
           لو الصف الذي كانت فيه الخلية
           تم حذفه، نختار أقرب صف.
        */

        if(
            !targetRow.isConnected
        ){

            const rows =
                Array.from(
                    table.rows
                );

            targetRow =
                rows[
                    Math.min(
                        row.rowIndex,
                        rows.length - 1
                    )
                ];
        }


        if(!targetRow){
            return;
        }


        /* =========================
           اختيار الخلية المناسبة
        ========================= */

        let targetCell =
            targetRow.cells[
                Math.min(
                    cellIndex,
                    targetRow.cells.length - 1
                )
            ];


        /*
           احتياطًا لو لم توجد الخلية
        */

        if(!targetCell){

            targetCell =
                targetRow.cells[
                    targetRow.cells.length - 1
                ];
        }


        /* =========================
           وضع المؤشر داخل الخلية
        ========================= */

        if(targetCell){

            targetCell.focus();

            const newRange =
                document.createRange();

            newRange.selectNodeContents(
                targetCell
            );

            newRange.collapse(true);

            selection.removeAllRanges();

            selection.addRange(
                newRange
            );
        }
    }
);

/* =====================================================
   تنظيف SPANS
===================================================== */

function cleanTextSpans(){

    function normalizeStyle(
        element
    ){

        const styles = {};

        Array
            .from(element.style)
            .forEach(
                (property) => {

                    styles[property] =
                        element.style.getPropertyValue(
                            property
                        );
                }
            );

        element.removeAttribute(
            "style"
        );

        Object.entries(
            styles
        ).forEach(
            ([property,value]) => {

                element.style.setProperty(
                    property,
                    value
                );
            }
        );

        if(
            !element.getAttribute(
                "style"
            )
        ){

            element.removeAttribute(
                "style"
            );
        }
    }


    function mergeSpanIntoParent(
        span
    ){

        const parent =
            span.parentElement;

        if(
            !parent ||
            parent.tagName !== "SPAN"
        ){
            return false;
        }

        const styles = {};

        Array
            .from(parent.style)
            .forEach(
                (property) => {

                    styles[property] =
                        parent.style.getPropertyValue(
                            property
                        );
                }
            );

        Array
            .from(span.style)
            .forEach(
                (property) => {

                    styles[property] =
                        span.style.getPropertyValue(
                            property
                        );
                }
            );

        parent.removeAttribute(
            "style"
        );

        Object.entries(
            styles
        ).forEach(
            ([property,value]) => {

                parent.style.setProperty(
                    property,
                    value
                );
            }
        );

        while(
            span.firstChild
        ){

            parent.insertBefore(
                span.firstChild,
                span
            );
        }

        span.remove();

        return true;
    }


    let changed = true;

    while(changed){

        changed = false;

        Array
            .from(
                editor.querySelectorAll(
                    "span"
                )
            )
            .reverse()
            .forEach(
                (span) => {

                    normalizeStyle(
                        span
                    );

                    if(
                        span.textContent === "" &&
                        !span.querySelector(
                            "br"
                        )
                    ){

                        span.remove();

                        changed = true;

                        return;
                    }

                    if(
                        mergeSpanIntoParent(
                            span
                        )
                    ){

                        changed = true;
                    }
                }
            );
    }


    changed = true;

    while(changed){

        changed = false;

        Array
            .from(
                editor.querySelectorAll(
                    "span"
                )
            )
            .forEach(
                (span) => {

                    const next =
                        span.nextSibling;

                    if(
                        !next ||
                        next.nodeType !== 1 ||
                        next.tagName !== "SPAN"
                    ){
                        return;
                    }

                    normalizeStyle(
                        span
                    );

                    normalizeStyle(
                        next
                    );

                    if(
                        (
                            span.getAttribute(
                                "style"
                            ) || ""
                        ) ===
                        (
                            next.getAttribute(
                                "style"
                            ) || ""
                        )
                    ){

                        while(
                            next.firstChild
                        ){

                            span.appendChild(
                                next.firstChild
                            );
                        }

                        next.remove();

                        changed = true;
                    }
                }
            );
    }


    Array
        .from(
            editor.querySelectorAll(
                "span"
            )
        )
        .reverse()
        .forEach(
            (span) => {

                if(
                    span.textContent === "" &&
                    !span.querySelector(
                        "br"
                    )
                ){

                    span.remove();

                    return;
                }

                if(
                    !span.getAttribute(
                        "style"
                    ) &&
                    span.attributes.length === 0
                ){

                    const parent =
                        span.parentNode;

                    while(
                        span.firstChild
                    ){

                        parent.insertBefore(
                            span.firstChild,
                            span
                        );
                    }

                    span.remove();
                }
            }
        );
}


/* =====================================================
   NORMALIZE CONTENT
===================================================== */

function normalizeEditorContent(
    root
){

    function isWhitespaceText(
        node
    ){

        return (
            node.nodeType ===
            Node.TEXT_NODE &&
            node.textContent.trim() === ""
        );
    }

    Array
        .from(root.childNodes)
        .forEach(
            (node) => {

                if(
                    isWhitespaceText(
                        node
                    )
                ){

                    node.remove();
                }
            }
        );

    while(
        root.firstChild
    ){

        const first =
            root.firstChild;

        if(
            first.nodeType ===
            Node.ELEMENT_NODE &&
            first.tagName === "BR"
        ){

            first.remove();

            continue;
        }

        if(
            first.nodeType ===
            Node.ELEMENT_NODE &&
            first.tagName === "DIV" &&
            first.textContent.trim() === "" &&
            first.children.length <= 1
        ){

            first.remove();

            continue;
        }

        break;
    }

    while(
        root.lastChild
    ){

        const last =
            root.lastChild;

        if(
            last.nodeType ===
            Node.ELEMENT_NODE &&
            last.tagName === "BR"
        ){

            last.remove();

            continue;
        }

        if(
            last.nodeType ===
            Node.ELEMENT_NODE &&
            last.tagName === "DIV" &&
            last.textContent.trim() === "" &&
            last.children.length <= 1
        ){

            last.remove();

            continue;
        }

        break;
    }
}

    );

let selectedNote =
    null;

messages.addEventListener(
    "click",
    (event) => {

        const menu =
            event.target.closest(
                ".note-menu"
            );

        if(!menu){
            return;
        }

        selectedNote =
            menu.closest(
                ".note"
            );

        const rect =
            menu.getBoundingClientRect();

        messageMenu.style.top =
            rect.bottom + 5 + "px";

        messageMenu.style.left =
            rect.left + "px";

        messageMenu.classList.add(
            "open"
        );
    }
);


/* =====================================================
   EDIT
===================================================== */

editButton.addEventListener(
    "mousedown",
    (event) => {

        event.preventDefault();
    }
);

editButton.addEventListener(
    "click",
    () => {

        if(!selectedNote){
            return;
        }

        const noteContent =
            selectedNote.querySelector(
                ".note-content"
            );

        if(!noteContent){
            return;
        }

        editor.innerHTML =
            noteContent.innerHTML.replace(
                /^(<div><br><\/div>|<br>)+|(<div><br><\/div>|<br>)+$/g,
                ""
            );

        editor
            .querySelectorAll(
                ".mind-box-root, .mind-box-branch, .collapsible-title-text, .collapsible-content"
            )
            .forEach(
                (element) => {

                    element.contentEditable =
                        "true";
                }
            );

        messageMenu.classList.remove(
            "open"
        );

        editor.focus();

        updateFormatButtons();
    }
);


/* =====================================================
   DELETE
===================================================== */

deleteButton.addEventListener(
    "mousedown",
    (event) => {

        event.preventDefault();
    }
);

deleteButton.addEventListener(
    "click",
    () => {

        if(!selectedNote){
            return;
        }

        selectedNote.remove();

        selectedNote =
            null;

        messageMenu.classList.remove(
            "open"
        );
    }
);


/* =====================================================
   إغلاق قائمة الرسالة
===================================================== */

document.addEventListener(
    "click",
    (event) => {

        if(
            !event.target.closest(
                ".note-menu"
            ) &&
            !event.target.closest(
                ".message-menu"
            )
        ){

            messageMenu.classList.remove(
                "open"
            );
        }
    }
);

</script>

</body>
</html>
