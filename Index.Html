<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover">

<meta name="theme-color" content="#10131a">

<title>ملاحظاتي</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#10131a;
    color:#fff;
    font-family:Arial,"Noto Sans Arabic",sans-serif;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    touch-action:manipulation;
}

:root{
    --app-height:100dvh;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    max-width:900px;
    height:var(--app-height);
    margin:auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#10131a;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    flex:0 0 auto;
    min-height:56px;
    padding:8px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#171b24;
    border-bottom:1px solid #292e3a;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:6px;
}

.header-actions button{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#252b36;
    color:#fff;
    font-size:21px;
}

.header-actions button:active{
    transform:scale(.94);
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px;
    scroll-behavior:smooth;
}

.empty{
    padding:50px 20px;
    text-align:center;
    color:#7f8795;
}

.note{
    position:relative;
    max-width:92%;
    margin:0 0 12px auto;
    padding:14px 44px 14px 14px;
    background:#202631;
    border:1px solid #2c3441;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.note.editing{
    border-color:#527df5;
}

.note-content{
    min-width:0;
    font-size:17px;
    line-height:1.8;
    word-break:break-word;
    overflow-wrap:anywhere;
}

.note-menu{
    position:absolute;
    top:8px;
    left:7px;
    width:32px;
    height:32px;
    border-radius:9px;
    background:#2b323e;
    color:#fff;
    font-size:21px;
}

.note-menu:active{
    transform:scale(.94);
}


/* =====================================================
   EDITOR AREA
===================================================== */

.editor-area{
    position:relative;
    flex:0 0 auto;
    padding:8px 10px 10px;
    background:#151922;
    border-top:1px solid #292e3a;
}

.editor-state{
    margin:0 5px 6px;
    color:#8e98a8;
    font-size:12px;
}


/* =====================================================
   EDITOR
===================================================== */

.editor{
    min-height:95px;
    max-height:30vh;
    overflow-y:auto;
    padding:13px;
    border:1px solid #303745;
    border-radius:14px;
    background:#1c212b;
    color:#fff;
    outline:none;

    direction:rtl;
    text-align:right;

    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;

    line-height:1.8;
}

.editor:empty::before{
    content:"اكتبي ملاحظتك هنا…";
    color:#737d8e;
    pointer-events:none;
}

.editor:focus{
    border-color:#527df5;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
    display:flex;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    padding:7px 0 2px;
    scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#252c38;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    transition:transform .08s,background .12s;
}

.tool.active{
    background:#4169d8;
}

.tool:active{
    transform:scale(.90);
}


/* =====================================================
   SUB TOOLBAR
===================================================== */

.sub-toolbar{
    display:none;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    padding:5px 0;
    scrollbar-width:none;
}

.sub-toolbar::-webkit-scrollbar{
    display:none;
}

.sub-toolbar button{
    flex:0 0 auto;
    min-width:40px;
    height:36px;
    padding:0 8px;
    border-radius:9px;
    background:#292f3b;
    color:#fff;
}

.sub-toolbar button.active{
    background:#4169d8;
}

.sub-toolbar button:active{
    transform:scale(.94);
}


/* =====================================================
   ACTIONS
===================================================== */

.editor-actions{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:6px;
}

.send-button{
    position: absolute;
    top:-54px;
    left:10px;
    flex:0 0 46px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#3867dc;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.cancel-button{
    flex:0 0 38px;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#252c38;
    color:#fff;
    font-size:17px;
}

/* =====================================================
   UNDO BUTTON
===================================================== */

.undo-button{
    flex:0 0 46px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#303744;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:normal;
    line-height:1;
}

.undo-button:active{
    transform:scale(.92);
}

.send-button:active,
.cancel-button:active{
    transform:scale(.96);
}


/* =====================================================
   MESSAGE MENU
===================================================== */

.message-menu{
    position:fixed;
    z-index:2000;
    display:none;
    min-width:140px;
    padding:5px;
    background:#252b36;
    border:1px solid #3a4250;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.message-menu.open{
    display:block;
}

.message-menu button{
    display:block;
    width:100%;
    padding:11px;
    border-radius:8px;
    background:transparent;
    color:#fff;
    text-align:right;
}

.message-menu button:active{
    background:#343c4a;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{
    position:fixed;
    inset:0;
    z-index:1500;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.62);
}

.overlay.open{
    display:flex;
}

.overlay-box{
    width:min(600px,100%);
    max-height:90dvh;
    overflow-y:auto;
    padding:18px;
    background:#191e27;
    border:1px solid #343b48;
    border-radius:22px 22px 0 0;
}

.overlay-title{
    margin-bottom:15px;
    font-size:18px;
    font-weight:bold;
}

.overlay-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
}

.overlay-actions button{
    flex:1;
    min-height:42px;
    border-radius:11px;
    background:#303744;
    color:#fff;
}

.overlay-actions .primary{
    background:#3867dc;
}

#colorOverlay{
    position:fixed;
    inset:auto 0 0 0;
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:0 10px 10px;
    background:transparent;
}

#colorOverlay.open{
    display:flex;
}

#colorOverlay .overlay-box{
    width:min(200px,58vw);
    max-height:none;
    padding:14px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.45);
}

margin-bottom:10px;

#colorOverlay .color-wheel{
    width:min(240px,68vw);
    margin:0 auto 12px;
}

/* =====================================================
   COLOR WHEEL
===================================================== */

.color-wheel{
    position:relative;
    width:min(300px,80vw);
    aspect-ratio:1;
    margin:12px auto;
    border-radius:50%;
    overflow:hidden;
    touch-action:none;

    background:
        radial-gradient(
            circle at center,
            #fff 0%,
            rgba(255,255,255,0) 58%
        ),
        radial-gradient(
            circle at center,
            rgba(0,0,0,0) 35%,
            rgba(0,0,0,.9) 100%
        ),
        conic-gradient(
            red,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
        );
}

.color-marker{
    position:absolute;
    z-index:5;
    width:18px;
    height:18px;
    margin:-9px;
    border:2px solid #fff;
    border-radius:50%;
    box-shadow:0 1px 5px #000;
    pointer-events:none;
}


/* =====================================================
   COLOR PRESETS
===================================================== */

.color-presets{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:10px;
}

.color-preset{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid #fff;
}

#blackText{
    background:#000;
}

#whiteText{
    background:#fff;
}


/* =====================================================
   OPACITY
===================================================== */

.range-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
}

.range-row span{
    white-space:nowrap;
}

.range-row input{
    flex:1;
}


/* =====================================================
   COUNTERS
===================================================== */

.counter-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:20px 0;
}

.counter-box button{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#303744;
    color:#fff;
    font-size:22px;
}

.counter-box strong{
    min-width:55px;
    text-align:center;
    font-size:19px;
}

/* =====================================================
   TABLE
===================================================== */

.editor-table{
    width:100%;
    max-width:100%;
    margin:8px 0;
    border-collapse:collapse;
    table-layout:fixed;
}

.editor-table td,
.editor-table th{
    padding:9px 10px;
    border:1px solid #697386;
    vertical-align:top;
    line-height:1.6;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.editor-table td:focus,
.editor-table th:focus{
    outline:1px solid #527df5;
}

/* =====================================================
   MIND MAP BOX
===================================================== */

.mind-box{
    width:fit-content;
    max-width:100%;
    margin:12px auto;
    padding:14px;
    border:2px solid #fff;
    border-radius:14px;
    background:transparent;
    overflow:hidden;
}

.mind-box-root{
    width:fit-content;
    max-width:90%;
    margin:0 auto;
    padding:8px 12px;
    border:2px solid #fff;
    border-radius:10px;
    background:transparent;
    text-align:center;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.6;
}

.mind-box-branches{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap:10px;
    margin-top:16px;
}

.mind-box-branch{
    flex:0 1 auto;
    width:fit-content;
    max-width:220px;
    min-width:50px;
    padding:7px 10px;
    border:2px solid #fff;
    border-radius:10px;
    background:transparent;
    text-align:center;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.6;
}

/* =====================================================
   SEARCH
===================================================== */

.search-input{
    width:100%;
    height:44px;
    padding:0 12px;
    border:1px solid #3a4250;
    border-radius:11px;
    outline:none;
    background:#202631;
    color:#fff;
    direction:rtl;
}

.search-input:focus{
    border-color:#527df5;
}

.search-result{
    margin-top:12px;
    color:#aab3c2;
}

.search-word{
    background:#ffe600;
    color:#111;
    border-radius:3px;
    padding:0 2px;
}

.search-highlight{
    outline:2px solid #ffc107;
    outline-offset:2px;
}


/* =====================================================
   UNDERLINE
===================================================== */

.editor u{
    text-decoration-line:underline;
    text-decoration-thickness:auto;
    text-underline-offset:5.08px;
}

/* =====================================================
   HIGHLIGHT
===================================================== */

.word-text-highlight{
    -webkit-box-decoration-break:clone;
    box-decoration-break:clone;
}


/* =====================================================
   MOBILE KEYBOARD
===================================================== */

body.keyboard-open .editor-area{
    padding-bottom:max(
        8px,
        env(safe-area-inset-bottom)
    );
}

body.keyboard-open #colorOverlay{
    bottom:0;
}

@media(max-width:600px){

    .note{
        max-width:96%;
    }
    .editor{
        max-height:32vh;
    }

    .overlay-box{
        padding:15px;
    }
}

</style>
</head>

<script>

const editor = document.getElementById("editor");
editor.innerHTML = "";

const boldButton = document.getElementById("boldButton");
const italicButton = document.getElementById("italicButton");
const underlineButton = document.getElementById("underlineButton");

function updateFormatButtons(){

    boldButton.classList.toggle(
        "active",
        document.queryCommandState("bold")
    );

    italicButton.classList.toggle(
        "active",
        document.queryCommandState("italic")
    );

    underlineButton.classList.toggle(
        "active",
        document.queryCommandState("underline")
    );
}

boldButton.addEventListener("click", () => {

    editor.focus();

    document.execCommand("bold");

    updateFormatButtons();
});

italicButton.addEventListener("click", () => {

    editor.focus();

    document.execCommand("italic");

    updateFormatButtons();
});

underlineButton.addEventListener("click", () => {

    editor.focus();

    document.execCommand("underline");

    updateFormatButtons();
});

editor.addEventListener("keyup", updateFormatButtons);
editor.addEventListener("mouseup", updateFormatButtons);
editor.addEventListener("input", updateFormatButtons);
editor.addEventListener("click", updateFormatButtons);

const sizeButton = document.getElementById("sizeButton");
const fontSizeBar = document.getElementById("fontSizeBar");

const fontSizes = [12, 14, 16, 18, 20, 24, 30];

fontSizes.forEach(size => {

    const button = document.createElement("button");

    button.type = "button";
    button.textContent = size;

    button.addEventListener("click", () => {

        editor.focus();

        const selection = window.getSelection();

        if(!selection.rangeCount){
            return;
        }

        const range = selection.getRangeAt(0);

        if(range.collapsed){
            return;
        }

        const span = document.createElement("span");

        span.style.fontSize = size + "px";

        span.appendChild(range.extractContents());

        range.insertNode(span);

        selection.removeAllRanges();

        const newRange = document.createRange();
        newRange.selectNodeContents(span);
        selection.addRange(newRange);
    });

    fontSizeBar.appendChild(button);
});

sizeButton.addEventListener("click", () => {

    fontSizeBar.style.display =
        fontSizeBar.style.display === "flex"
            ? "none"
            : "flex";
});

const alignmentButton = document.getElementById("alignmentButton");
const alignmentBar = document.getElementById("alignmentBar");


alignmentBar.querySelectorAll("button").forEach(button => {

    button.addEventListener("click", () => {

        editor.focus();

        const align = button.dataset.align;

        document.execCommand(
            "justify" +
            align.charAt(0).toUpperCase() +
            align.slice(1)
        );

        const selection = window.getSelection();

        if(selection.rangeCount){

            let element =
                selection.anchorNode.nodeType === 1
                    ? selection.anchorNode
                    : selection.anchorNode.parentElement;

            const list = element?.closest("ul, ol");

            if(list){
                list.style.textAlign = align;

                list.querySelectorAll("li").forEach(li => {
                    li.style.textAlign = align;
                    li.style.listStylePosition = "inside";
                });
            }
        }

    });

});

alignmentButton.addEventListener("click", () => {

    alignmentBar.style.display =
        alignmentBar.style.display === "flex"
            ? "none"
            : "flex";

});

const colorButton = document.getElementById("colorButton");

const textColorWheel = document.getElementById("textColorWheel");
const textColorMarker = document.getElementById("textColorMarker");

const opacityRange = document.getElementById("opacityRange");

let colorMode = "text";

textColorWheel.addEventListener("pointerdown", (event) => {

    const rect = textColorWheel.getBoundingClientRect();

    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const dx = x - centerX;
    const dy = y - centerY;

    const distance = Math.sqrt(dx * dx + dy * dy);
    const radius = Math.min(centerX, centerY);

    const angle = Math.atan2(dy, dx);

    const hue =
        ((angle * 180 / Math.PI) + 360 + 90) % 360;

    const saturation =
        Math.min(distance / radius, 1) * 100;

    const lightness =
        100 - Math.min(distance / radius, 1) * 50;

    const color =
        `hsl(${hue}, ${saturation}%, ${lightness}%)`;

    textColorMarker.style.left = x + "px";
    textColorMarker.style.top = y + "px";

    applyColor(color);
});


function applyColor(color){

    editor.focus();

    if(colorMode === "text"){

        document.execCommand(
            "foreColor",
            false,
            color
        );

        return;
    }

    const opacity =
        Number(opacityRange.value) / 100;

    if(color.startsWith("#")){

        const hex = color.replace("#", "");

        const r = parseInt(hex.substring(0, 2), 16);
        const g = parseInt(hex.substring(2, 4), 16);
        const b = parseInt(hex.substring(4, 6), 16);

        color =
            `rgba(${r}, ${g}, ${b}, ${opacity})`;
    }

    document.execCommand(
        "hiliteColor",
        false,
        color
    );
}


document.getElementById("blackText").addEventListener("click", () => {
    applyColor("#000000");
});

document.getElementById("whiteText").addEventListener("click", () => {
    applyColor("#ffffff");
});

const tableButton = document.getElementById("tableButton");
const tableOverlay = document.getElementById("tableOverlay");

let tableRows = 3;
let tableCols = 3;

function updateTableInfo(){
    document.getElementById("tableRowsInfo").textContent = tableRows;
    document.getElementById("tableColsInfo").textContent = tableCols;
}

tableButton.addEventListener("click", () => {
    updateTableInfo();
    tableOverlay.classList.add("open");
});

document.getElementById("tableRowsPlus").addEventListener("click", () => {
    tableRows++;
    updateTableInfo();
});

document.getElementById("tableRowsMinus").addEventListener("click", () => {
    if(tableRows > 1){
        tableRows--;
        updateTableInfo();
    }
});

document.getElementById("tableColsPlus").addEventListener("click", () => {
    tableCols++;
    updateTableInfo();
});

document.getElementById("tableColsMinus").addEventListener("click", () => {
    if(tableCols > 1){
        tableCols--;
        updateTableInfo();
    }
});

document.getElementById("tableDone").addEventListener("click", () => {

    editor.focus();

    let table = document.createElement("table");
    table.className = "editor-table";

    for(let r = 0; r < tableRows; r++){

        const row = document.createElement("tr");

        for(let c = 0; c < tableCols; c++){

            const cell = document.createElement("td");

            cell.contentEditable = "true";
            cell.textContent = " ";

            row.appendChild(cell);
        }

        table.appendChild(row);
    }

    editor.appendChild(table);

    tableOverlay.classList.remove("open");
});

document.getElementById("mindDone").addEventListener("click", () => {

    editor.focus();

    const box = document.createElement("div");

    box.className = "mind-box";


    const root = document.createElement("div");

    root.className = "mind-box-root";

    root.contentEditable = "true";

    root.textContent = "الفكرة الرئيسية";


    const branches = document.createElement("div");

    branches.className = "mind-box-branches";


    for(let i = 0; i < mindBranches; i++){

});

searchInput.addEventListener("input", () => {

    const word = searchInput.value.trim();

    if(!word){
        searchResult.textContent = "";
        return;
    }

    const text = editor.innerText;

    if(text.includes(word)){
        searchResult.textContent = "تم العثور على الكلمة ✓";
    }else{
        searchResult.textContent = "لم يتم العثور عليها";
    }

});
