<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover">

<meta name="theme-color" content="#10131a">

<title>ملاحظاتي</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#10131a;
    color:#fff;
    font-family:Arial,"Noto Sans Arabic",sans-serif;
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    touch-action:manipulation;
}

:root{
    --app-height:100dvh;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    max-width:900px;
    height:var(--app-height);
    margin:auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#10131a;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    flex:0 0 auto;
    min-height:56px;
    padding:8px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#171b24;
    border-bottom:1px solid #292e3a;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    gap:6px;
}

.header-actions button{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#252b36;
    color:#fff;
    font-size:21px;
}

.header-actions button:active{
    transform:scale(.94);
}


/* =====================================================
   MESSAGES
===================================================== */

.messages{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px;
    scroll-behavior:smooth;
}

.empty{
    padding:50px 20px;
    text-align:center;
    color:#7f8795;
}

.note{
    position:relative;
    max-width:92%;
    margin:0 0 12px auto;
    padding:14px 44px 14px 14px;
    background:#202631;
    border:1px solid #2c3441;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.note.editing{
    border-color:#527df5;
}

.note-content{
    min-width:0;
    font-size:17px;
    line-height:1.8;
    word-break:break-word;
    overflow-wrap:anywhere;
}

.note-menu{
    position:absolute;
    top:8px;
    left:7px;
    width:32px;
    height:32px;
    border-radius:9px;
    background:#2b323e;
    color:#fff;
    font-size:21px;
}

.note-menu:active{
    transform:scale(.94);
}


/* =====================================================
   EDITOR AREA
===================================================== */

.editor-area{
    position:relative;
    flex:0 0 auto;
    padding:8px 10px 10px;
    background:#151922;
    border-top:1px solid #292e3a;
}

.editor-state{
    margin:0 5px 6px;
    color:#8e98a8;
    font-size:12px;
}


/* =====================================================
   EDITOR
===================================================== */

.editor{
    min-height:95px;
    max-height:30vh;
    overflow-y:auto;
    padding:13px;
    border:1px solid #303745;
    border-radius:14px;
    background:#1c212b;
    color:#fff;
    outline:none;

    direction:rtl;
    text-align:right;

    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;

    line-height:1.8;
}

.editor:empty::before{
    content:"اكتبي ملاحظتك هنا…";
    color:#737d8e;
    pointer-events:none;
}

.editor:focus{
    border-color:#527df5;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
    display:flex;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    padding:7px 0 2px;
    scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 auto;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#252c38;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    transition:transform .08s,background .12s;
}

.tool.active{
    background:#4169d8;
}

.tool:active{
    transform:scale(.90);
}


/* =====================================================
   SUB TOOLBAR
===================================================== */

.sub-toolbar{
    display:none;
    align-items:center;
    gap:5px;
    overflow-x:auto;
    padding:5px 0;
    scrollbar-width:none;
}

.sub-toolbar::-webkit-scrollbar{
    display:none;
}

.sub-toolbar button{
    flex:0 0 auto;
    min-width:40px;
    height:36px;
    padding:0 8px;
    border-radius:9px;
    background:#292f3b;
    color:#fff;
}

.sub-toolbar button.active{
    background:#4169d8;
}

.sub-toolbar button:active{
    transform:scale(.94);
}


/* =====================================================
   ACTIONS
===================================================== */

.editor-actions{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:6px;
}

.send-button{
    position: absolute;
    top:-54px;
    left:10px;
    flex:0 0 46px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#3867dc;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.cancel-button{
    flex:0 0 38px;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#252c38;
    color:#fff;
    font-size:17px;
}

/* =====================================================
   UNDO BUTTON
===================================================== */

.undo-button{
    flex:0 0 46px;
    width:46px;
    height:46px;
    border-radius:50%;
    background:#303744;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:normal;
    line-height:1;
}

.undo-button:active{
    transform:scale(.92);
}

.send-button:active,
.cancel-button:active{
    transform:scale(.96);
}


/* =====================================================
   MESSAGE MENU
===================================================== */

.message-menu{
    position:fixed;
    z-index:2000;
    display:none;
    min-width:140px;
    padding:5px;
    background:#252b36;
    border:1px solid #3a4250;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.message-menu.open{
    display:block;
}

.message-menu button{
    display:block;
    width:100%;
    padding:11px;
    border-radius:8px;
    background:transparent;
    color:#fff;
    text-align:right;
}

.message-menu button:active{
    background:#343c4a;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{
    position:fixed;
    inset:0;
    z-index:1500;
    display:none;
    align-items:flex-end;
    justify-content:center;
    background:rgba(0,0,0,.62);
}

.overlay.open{
    display:flex;
}

.overlay-box{
    width:min(600px,100%);
    max-height:90dvh;
    overflow-y:auto;
    padding:18px;
    background:#191e27;
    border:1px solid #343b48;
    border-radius:22px 22px 0 0;
}

.overlay-title{
    margin-bottom:15px;
    font-size:18px;
    font-weight:bold;
}

.overlay-actions{
    display:flex;
    gap:7px;
    margin-top:15px;
}

.overlay-actions button{
    flex:1;
    min-height:42px;
    border-radius:11px;
    background:#303744;
    color:#fff;
}

.overlay-actions .primary{
    background:#3867dc;
}


/* =====================================================
   COLOR WHEEL
===================================================== */

.color-wheel{
    position:relative;
    width:min(300px,80vw);
    aspect-ratio:1;
    margin:12px auto;
    border-radius:50%;
    overflow:hidden;
    touch-action:none;

    background:
        radial-gradient(
            circle at center,
            #fff 0%,
            rgba(255,255,255,0) 58%
        ),
        radial-gradient(
            circle at center,
            rgba(0,0,0,0) 35%,
            rgba(0,0,0,.9) 100%
        ),
        conic-gradient(
            red,
            yellow,
            lime,
            cyan,
            blue,
            magenta,
            red
        );
}

.color-marker{
    position:absolute;
    z-index:5;
    width:18px;
    height:18px;
    margin:-9px;
    border:2px solid #fff;
    border-radius:50%;
    box-shadow:0 1px 5px #000;
    pointer-events:none;
}


/* =====================================================
   COLOR PRESETS
===================================================== */

.color-presets{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:10px;
}

.color-preset{
    width:38px;
    height:38px;
    border-radius:50%;
    border:2px solid #fff;
}

#blackText{
    background:#000;
}

#whiteText{
    background:#fff;
}


/* =====================================================
   OPACITY
===================================================== */

.range-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
}

.range-row span{
    white-space:nowrap;
}

.range-row input{
    flex:1;
}


/* =====================================================
   COUNTERS
===================================================== */

.counter-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:20px 0;
}

.counter-box button{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#303744;
    color:#fff;
    font-size:22px;
}

.counter-box strong{
    min-width:55px;
    text-align:center;
    font-size:19px;
}

/* =====================================================
   TABLE
===================================================== */

.editor-table{
    width:100%;
    max-width:100%;
    margin:8px 0;
    border-collapse:collapse;
    table-layout:fixed;
}

.editor-table td,
.editor-table th{
    padding:9px 10px;
    border:1px solid #697386;
    vertical-align:top;
    line-height:1.6;
    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.editor-table td:focus,
.editor-table th:focus{
    outline:1px solid #527df5;
}

/* =====================================================
   MIND MAP
===================================================== */

.mind-map{
    width:100%;
    max-width:100%;
    margin:12px 0;
    padding:12px;
    border:1px solid #485263;
    border-radius:14px;
    overflow:hidden;
}

.mind-map-center{
    width:fit-content;
    max-width:90%;
    margin:auto;
    padding:9px 14px;
    border-radius:12px;
    background:#3867dc;
    text-align:center;
    word-break:break-word;
}

.mind-map-branches{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:12px;
}

.mind-map-branch{
    flex:1 1 100px;
    min-width:70px;
    max-width:180px;
    padding:8px;
    border-radius:10px;
    background:#303744;
    text-align:center;
    word-break:break-word;
    overflow-wrap:anywhere;
}

/* =====================================================
   MIND TREE — فروع بجوار بعضها + أسهم + حذف الشجرة
===================================================== */

.mind-tree{
    position:relative;
    width:100%;
    max-width:100%;
    margin:12px 0;
    padding:34px 10px 14px;
    border:1px solid #485263;
    border-radius:14px;
    overflow:hidden;
    box-sizing:border-box;
}

.mind-tree-root{
    width:fit-content;
    max-width:80%;
    margin:0 auto;
    padding:9px 14px;
    border-radius:12px;
    background:#3867dc;
    text-align:center;
    word-break:break-word;
    overflow-wrap:anywhere;
    position:relative;
    z-index:2;
}

.mind-tree-branches{
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    align-items:flex-start;
    justify-content:center;
    gap:28px 12px;
    margin-top:28px;
    width:100%;
}

.mind-tree-branch{
    position:relative;
    flex:0 1 auto;
    width:fit-content;
    min-width:70px;
    max-width:220px;
    padding:8px 10px;
    border-radius:10px;
    background:#303744;
    text-align:center;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.6;
    box-sizing:border-box;
}

.mind-tree-branch::before{
    content:"↓";
    position:absolute;
    top:-27px;
    left:50%;
    transform:translateX(-50%);
    color:#8fa8ff;
    font-size:22px;
    line-height:1;
    font-weight:bold;
    pointer-events:none;
}

.mind-tree-delete{
    position:absolute;
    top:7px;
    left:7px;
    width:28px;
    height:28px;
    padding:0;
    border:1px solid #8e98a8;
    border-radius:50%;
    background:transparent;
    color:#c9d0dc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    line-height:1;
    z-index:10;
}

.mind-tree-delete:active{
    transform:scale(.92);
}

.mind-map{
    position:relative;
}

.mind-map-delete{
    position:absolute;
    top:7px;
    left:7px;
    width:28px;
    height:28px;
    padding:0;
    border:1px solid #8e98a8;
    border-radius:50%;
    background:transparent;
    color:#c9d0dc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    line-height:1;
    z-index:10;
}

.mind-map-delete:active{
    transform:scale(.92);
}

/* =====================================================
   SEARCH
===================================================== */

.search-input{
    width:100%;
    height:44px;
    padding:0 12px;
    border:1px solid #3a4250;
    border-radius:11px;
    outline:none;
    background:#202631;
    color:#fff;
    direction:rtl;
}

.search-input:focus{
    border-color:#527df5;
}

.search-result{
    margin-top:12px;
    color:#aab3c2;
}

.search-word{
    background:#ffe600;
    color:#111;
    border-radius:3px;
    padding:0 2px;
}

.search-highlight{
    outline:2px solid #ffc107;
    outline-offset:2px;
}


/* =====================================================
   UNDERLINE
===================================================== */

.editor u{
    text-decoration-line:underline;
    text-decoration-thickness:auto;
    text-underline-offset:5.08px;
}

/* =====================================================
   HIGHLIGHT
===================================================== */

.word-text-highlight{
    -webkit-box-decoration-break:clone;
    box-decoration-break:clone;
}


/* =====================================================
   MOBILE KEYBOARD
===================================================== */

body.keyboard-open .editor-area{
    padding-bottom:max(
        8px,
        env(safe-area-inset-bottom)
    );
}


@media(max-width:600px){

    .note{
        max-width:96%;
    }

    .editor{
        max-height:32vh;
    }

    .overlay-box{
        padding:15px;
    }

    .mind-map-branch{
        flex-basis:80px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="title">
            ملاحظاتي
        </div>

        <div class="header-actions">

            <button
                id="newButton"
                type="button"
                aria-label="جديد">
                ＋
            </button>

            <button
                id="searchButton"
                type="button"
                aria-label="بحث">
                ⌕
            </button>

        </div>

    </header>


    <!-- NOTES -->

    <main
        id="messages"
        class="messages">
    </main>


    <!-- EDITOR -->

    <section class="editor-area">

        <div
            id="state"
            class="editor-state">
            رسالة جديدة
        </div>

        <div
            id="editor"
            class="editor"
            contenteditable="true"
            spellcheck="true">
        </div>
<button
    id="sendButton"
    class="send-button"
    type="button"
    aria-label="حفظ">
    ➤
</button>

        <!-- TOOLBAR -->

        <div class="toolbar">

            <button
                id="boldButton"
                class="tool"
                type="button"
                aria-label="عريض">
                <b>B</b>
            </button>

            <button
                id="italicButton"
                class="tool"
                type="button"
                aria-label="مائل">
                <i>I</i>
            </button>

            <button
                id="underlineButton"
                class="tool"
                type="button"
                aria-label="تسطير">
                <u>U</u>
            </button>

            <button
                id="sizeButton"
                class="tool"
                type="button"
                aria-label="حجم">
                A
            </button>

            <button
                id="listButton"
                class="tool"
                type="button"
                aria-label="قائمة">
                ≡
            </button>

            <button
                id="alignmentButton"
                class="tool"
                type="button"
                aria-label="محاذاة">
                ≡
            </button>

            <button
                id="colorButton"
                class="tool"
                type="button"
                aria-label="لون">
                ◉
            </button>

            <button
                id="highlightButton"
                class="tool"
                type="button"
                aria-label="تمييز">
                ▰
            </button>

            <button
                id="tableButton"
                class="tool"
                type="button"
                aria-label="جدول">
                ▦
            </button>

            <button
                id="mindMapButton"
                class="tool"
                type="button"
                aria-label="خريطة">
                ⌗
            </button>

            <button
                id="mindTreeButton"
                class="tool"
                type="button"
                aria-label="شجرة">
                🌳
            </button>

            <!-- أزرار بداية السطر -->
            <button
                id="newLineDownButton"
                class="tool"
                type="button"
                aria-label="بداية سطر جديد لأسفل">
                ⇩
            </button>

            <button
                id="newLineUpButton"
                class="tool"
                type="button"
                aria-label="بداية سطر جديد لأعلى">
                ⇧
            </button>

        </div>


        <!-- FONT SIZE -->

        <div
            id="fontSizeBar"
            class="sub-toolbar">
        </div>


        <!-- LIST -->

        <div
            id="listBar"
            class="sub-toolbar">
        </div>


        <!-- ALIGNMENT -->

        <div
            id="alignmentBar"
            class="sub-toolbar">

            <button
                type="button"
                data-align="right">
                ≫
            </button>

            <button
                type="button"
                data-align="center">
                ≡
            </button>

            <button
                type="button"
                data-align="left">
                ≪
            </button>

            <button
                type="button"
                data-align="justify">
                ▤
            </button>

        </div>


        <!-- ACTIONS -->

        <div class="editor-actions">

            <!-- زر التراجع -->
            <button
                id="undoButton"
                class="undo-button"
                type="button"
                aria-label="تراجع">
                ↶
            </button>

            <button
                id="cancelButton"
                class="cancel-button"
                type="button"
                aria-label="إلغاء">
                ✕
            </button>

        </div>

    </section>

</div>


<!-- =====================================================
   MESSAGE MENU
===================================================== -->

<div
    id="messageMenu"
    class="message-menu">

    <button
        id="editButton"
        type="button"
        aria-label="تعديل">
        ✎
    </button>

    <button
        id="deleteButton"
        type="button"
        aria-label="حذف">
        🗑
    </button>

</div>


<!-- =====================================================
   COLOR
===================================================== -->

<div
    id="colorOverlay"
    class="overlay">

    <div class="overlay-box">

        <div class="overlay-title">
            ◉
        </div>

        <div
            id="textColorWheel"
            class="color-wheel">

            <span
                id="textColorMarker"
                class="color-marker">
            </span>

        </div>

        <div class="color-presets">

            <button
                id="blackText"
                class="color-preset"
                type="button"
                aria-label="أسود">
            </button>

            <button
                id="whiteText"
                class="color-preset"
                type="button"
                aria-label="أبيض">
            </button>

        </div>

        <div class="overlay-actions">

            <button
                id="colorDone"
                class="primary"
                type="button">
                ✓
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
   HIGHLIGHT
===================================================== -->

<div
    id="highlightOverlay"
    class="overlay">

    <div class="overlay-box">

        <div class="overlay-title">
            ▰
        </div>

        <div
            id="highlightColorWheel"
            class="color-wheel">

            <span
                id="highlightColorMarker"
                class="color-marker">
            </span>

        </div>

        <div class="range-row">

            <span>◉</span>

            <input
                id="opacityRange"
                type="range"
                min="0"
                max="100"
                value="60">

        </div>

        <div class="overlay-actions">

            <button
                id="highlightDone"
                class="primary"
                type="button">
                ✓
            </button>

            <button
                id="removeHighlight"
                type="button">
                ⌫
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
   TABLE
===================================================== -->

<div
    id="tableOverlay"
    class="overlay">

    <div class="overlay-box">

        <div class="overlay-title">
            ▦
        </div>

        <div class="counter-box">

            <button
                id="tableRowsMinus"
                type="button">
                −
            </button>

            <strong id="tableRowsInfo">
                3
            </strong>

            <button
                id="tableRowsPlus"
                type="button">
                ＋
            </button>

        </div>

        <div class="counter-box">

            <button
                id="tableColsMinus"
                type="button">
                −
            </button>

            <strong id="tableColsInfo">
                3
            </strong>

            <button
                id="tableColsPlus"
                type="button">
                ＋
            </button>

        </div>

        <div class="overlay-actions">

            <button
                id="tableDone"
                class="primary"
                type="button">
                ✓
            </button>

</div>

        </div>

        <div class="counter-box">

            <button
                id="mindBranchMinus"
                type="button">
                −
            </button>

            <strong id="mindBranchInfo">

            </strong>

            <button

                type="button">
                ＋
            </button>

        </div>

        <div class="overlay-actions">

            <button
                id="mindDone"
                class="primary"
                type="button">
                ✓
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
   MIND TREE

<div
    id="mindTreeOverlay"
    class="overlay">

    <div class="overlay-box">

        <div class="overlay-title">
            🌳
        </div>

        <div class="counter-box">

            <button
                id="treeBranchMinus"
                type="button">
                −
            </button>

            <strong id="treeBranchInfo">
                2
            </strong>

            <button
                id="treeBranchPlus"
                type="button">
                ＋
            </button>

        </div>

        <div class="overlay-actions">

            <button

                type="button">

            </button>

        </div>

</div>


<!-- =====================================================
   SEARCH
===================================================== -->

<div
    id="searchOverlay"
    class="overlay">

    <div class="overlay-box">

        <div class="overlay-title">
            ⌕
        </div>

        <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off">

        <div
            id="searchResult"
            class="search-result">
        </div>

        <div class="overlay-actions">

            <button
                id="searchDone"
                class="primary"
                type="button">
                ✕
            </button>

        </div>

    </div>

</div>

<script>

const editor = document.getElementById("editor");
editor.innerHTML = "";

const boldButton = document.getElementById("boldButton");
const italicButton = document.getElementById("italicButton");
const underlineButton = document.getElementById("underlineButton");

function updateFormatButtons(){

    boldButton.classList.toggle(
        "active",
        document.queryCommandState("bold")
    );

    italicButton.classList.toggle(
        "active",
        document.queryCommandState("italic")
    );

    underlineButton.classList.toggle(
        "active",
        document.queryCommandState("underline")
    );
}

boldButton.addEventListener("click", () => {

    editor.focus();

    document.execCommand("bold");

    updateFormatButtons();
});

italicButton.addEventListener("click", () => {

    editor.focus();

    document.execCommand("italic");

    updateFormatButtons();
});

underlineButton.addEventListener("click", () => {

    editor.focus();

    document.execCommand("underline");

    updateFormatButtons();
});

editor.addEventListener("keyup", updateFormatButtons);
editor.addEventListener("mouseup", updateFormatButtons);
editor.addEventListener("input", updateFormatButtons);
editor.addEventListener("click", updateFormatButtons);

const sizeButton = document.getElementById("sizeButton");
const fontSizeBar = document.getElementById("fontSizeBar");

const fontSizes = [12, 14, 16, 18, 20, 24, 30];

fontSizes.forEach(size => {

    const button = document.createElement("button");

    button.type = "button";
    button.textContent = size;

    button.addEventListener("click", () => {
        editor.focus();
        document.execCommand("fontSize", false, size);
    });

    fontSizeBar.appendChild(button);
});

sizeButton.addEventListener("click", () => {
    fontSizeBar.style.display =
        fontSizeBar.style.display === "flex"
            ? "none"
            : "flex";
});

const listButton = document.getElementById("listButton");
const listBar = document.getElementById("listBar");

listBar.innerHTML = `
    <button type="button" data-list="ul">•</button>
    <button type="button" data-list="ol">1.</button>
`;

listBar.querySelectorAll("button").forEach(button => {

    button.addEventListener("click", () => {

        editor.focus();

        if(button.dataset.list === "ul"){
            document.execCommand("insertUnorderedList");
        }

        if(button.dataset.list === "ol"){
            document.execCommand("insertOrderedList");
        }

    });

});

listButton.addEventListener("click", () => {

    listBar.style.display =
        listBar.style.display === "flex"
            ? "none"
            : "flex";

});

const alignmentButton = document.getElementById("alignmentButton");
const alignmentBar = document.getElementById("alignmentBar");

alignmentBar.querySelectorAll("button").forEach(button => {

    button.addEventListener("click", () => {

        editor.focus();

        document.execCommand(
            "justify" + button.dataset.align.charAt(0).toUpperCase()
            + button.dataset.align.slice(1)
        );

    });

});

alignmentButton.addEventListener("click", () => {

    alignmentBar.style.display =
        alignmentBar.style.display === "flex"
            ? "none"
            : "flex";

});

const colorButton = document.getElementById("colorButton");
const colorOverlay = document.getElementById("colorOverlay");

colorButton.addEventListener("click", () => {
    colorOverlay.classList.add("open");
});

document.getElementById("blackText").addEventListener("click", () => {
    editor.focus();
    document.execCommand("foreColor", false, "#000000");
});

document.getElementById("whiteText").addEventListener("click", () => {
    editor.focus();
    document.execCommand("foreColor", false, "#ffffff");
});

document.getElementById("colorDone").addEventListener("click", () => {
    colorOverlay.classList.remove("open");
});

const highlightButton = document.getElementById("highlightButton");
const highlightOverlay = document.getElementById("highlightOverlay");

highlightButton.addEventListener("click", () => {
    highlightOverlay.classList.add("open");
});

document.getElementById("highlightDone").addEventListener("click", () => {
    editor.focus();

    document.execCommand(
        "hiliteColor",
        false,
        "#ffff00"
    );

    highlightOverlay.classList.remove("open");
});

document.getElementById("removeHighlight").addEventListener("click", () => {
    editor.focus();

    document.execCommand(
        "hiliteColor",
        false,
        "transparent"
    );

    highlightOverlay.classList.remove("open");
});

const tableButton = document.getElementById("tableButton");
const tableOverlay = document.getElementById("tableOverlay");

let tableRows = 3;
let tableCols = 3;

function updateTableInfo(){
    document.getElementById("tableRowsInfo").textContent = tableRows;
    document.getElementById("tableColsInfo").textContent = tableCols;
}

tableButton.addEventListener("click", () => {
    updateTableInfo();
    tableOverlay.classList.add("open");
});

document.getElementById("tableRowsPlus").addEventListener("click", () => {
    tableRows++;
    updateTableInfo();
});

document.getElementById("tableRowsMinus").addEventListener("click", () => {
    if(tableRows > 1){
        tableRows--;
        updateTableInfo();
    }
});

document.getElementById("tableColsPlus").addEventListener("click", () => {
    tableCols++;
    updateTableInfo();
});

document.getElementById("tableColsMinus").addEventListener("click", () => {
    if(tableCols > 1){
        tableCols--;
        updateTableInfo();
    }
});

document.getElementById("tableDone").addEventListener("click", () => {

    editor.focus();

    let table = document.createElement("table");
    table.className = "editor-table";

    for(let r = 0; r < tableRows; r++){

        const row = document.createElement("tr");

        for(let c = 0; c < tableCols; c++){

            const cell = document.createElement("td");

            cell.contentEditable = "true";
            cell.textContent = " ";

            row.appendChild(cell);
        }

        table.appendChild(row);
    }

    editor.appendChild(table);

    tableOverlay.classList.remove("open");
});

const mindMapButton = document.getElementById("mindMapButton");
const mindMapOverlay = document.getElementById("mindMapOverlay");

let mindBranches = 2;

function updateMindInfo(){
    document.getElementById("mindBranchInfo").textContent = mindBranches;
}

mindMapButton.addEventListener("click", () => {
    updateMindInfo();
    mindMapOverlay.classList.add("open");
});

document.getElementById("mindBranchPlus").addEventListener("click", () => {
    mindBranches++;
    updateMindInfo();
});

document.getElementById("mindBranchMinus").addEventListener("click", () => {
    if(mindBranches > 1){
        mindBranches--;
        updateMindInfo();
    }
});

document.getElementById("mindDone").addEventListener("click", () => {

    editor.focus();

    const map = document.createElement("div");
    map.className = "mind-map";

    const center = document.createElement("div");
    center.className = "mind-map-center";
    center.contentEditable = "true";
    center.textContent = "الفكرة الرئيسية";

    const branches = document.createElement("div");
    branches.className = "mind-map-branches";

    for(let i = 0; i < mindBranches; i++){

        const branch = document.createElement("div");

        branch.className = "mind-map-branch";
        branch.contentEditable = "true";
        branch.textContent = "فرع " + (i + 1);

        branches.appendChild(branch);
    }

    map.appendChild(center);
    map.appendChild(branches);

    editor.appendChild(map);

    mindMapOverlay.classList.remove("open");
});

const mindTreeButton = document.getElementById("mindTreeButton");
const mindTreeOverlay = document.getElementById("mindTreeOverlay");

let treeBranches = 2;

function updateTreeInfo(){
    document.getElementById("treeBranchInfo").textContent = treeBranches;
}

mindTreeButton.addEventListener("click", () => {
    updateTreeInfo();
    mindTreeOverlay.classList.add("open");
});

document.getElementById("treeBranchPlus").addEventListener("click", () => {
    treeBranches++;
    updateTreeInfo();
});

document.getElementById("treeBranchMinus").addEventListener("click", () => {
    if(treeBranches > 1){
        treeBranches--;
        updateTreeInfo();
    }
});

document.getElementById("treeDone").addEventListener("click", () => {

    editor.focus();

    const tree = document.createElement("div");
    tree.className = "mind-tree";

    const root = document.createElement("div");
    root.className = "mind-tree-root";
    root.contentEditable = "true";
    root.textContent = "الفكرة الرئيسية";

    const branches = document.createElement("div");
    branches.className = "mind-tree-branches";

    for(let i = 0; i < treeBranches; i++){

        const branch = document.createElement("div");

        branch.className = "mind-tree-branch";
        branch.contentEditable = "true";
        branch.textContent = "فرع " + (i + 1);

        branches.appendChild(branch);
    }

    tree.appendChild(root);
    tree.appendChild(branches);

    editor.appendChild(tree);

    mindTreeOverlay.classList.remove("open");
});

const undoButton = document.getElementById("undoButton");

undoButton.addEventListener("click", () => {
    editor.focus();
    document.execCommand("undo");
});

const cancelButton = document.getElementById("cancelButton");

cancelButton.addEventListener("click", () => {
    editor.innerHTML = "";
    editor.focus();
});


const newButton = document.getElementById("newButton");

newButton.addEventListener("click", () => {
    editor.innerHTML = "";
    editor.focus();
});
const searchButton = document.getElementById("searchButton");
const searchOverlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchResult = document.getElementById("searchResult");

searchButton.addEventListener("click", () => {
    searchOverlay.classList.add("open");
    searchInput.focus();
});

searchInput.addEventListener("input", () => {

    const word = searchInput.value.trim();

    if(!word){
        searchResult.textContent = "";
        return;
    }

    const text = editor.innerText;

    if(text.includes(word)){
        searchResult.textContent = "تم العثور على الكلمة ✓";
    }else{
        searchResult.textContent = "لم يتم العثور عليها";
    }

});

document.getElementById("searchDone").addEventListener("click", () => {
    searchOverlay.classList.remove("open");
    searchInput.value = "";
    searchResult.textContent = "";
});

const sendButton = document.getElementById("sendButton");
const messages = document.getElementById("messages");

sendButton.addEventListener("click", () => {

    const content = editor.innerHTML.trim();

    if(!content){
        return;
    }

    const note = document.createElement("div");
    note.className = "note";

    note.innerHTML = `
        <div class="note-content">
            ${content}
        </div>

        <button
            class="note-menu"
            type="button">
            ⋮
        </button>
    `;

    messages.appendChild(note);

    editor.innerHTML = "";

    messages.scrollTop = messages.scrollHeight;

    editor.focus();
});

const messageMenu = document.getElementById("messageMenu");
const editButton = document.getElementById("editButton");
const deleteButton = document.getElementById("deleteButton");

let selectedNote = null;

messages.addEventListener("click", (event) => {

    const menu = event.target.closest(".note-menu");

    if(!menu){
        return;
    }

    selectedNote = menu.closest(".note");

    const rect = menu.getBoundingClientRect();

    messageMenu.style.top = rect.bottom + 5 + "px";
    messageMenu.style.left = rect.left + "px";

    messageMenu.classList.add("open");
});


editButton.addEventListener("click", () => {

    if(!selectedNote){
        return;
    }

    editor.innerHTML =
        selectedNote.querySelector(".note-content").innerHTML;

    selectedNote.remove();

    messageMenu.classList.remove("open");

    editor.focus();
});


deleteButton.addEventListener("click", () => {

    if(!selectedNote){
        return;
    }

    selectedNote.remove();

    selectedNote = null;

    messageMenu.classList.remove("open");
});


document.addEventListener("click", (event) => {

    if(
        !event.target.closest(".note-menu") &&
        !event.target.closest(".message-menu")
    ){
        messageMenu.classList.remove("open");
    }

});
          
</script>

</body>
</html>
